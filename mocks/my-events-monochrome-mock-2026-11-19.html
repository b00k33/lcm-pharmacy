<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My events monochrome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<!-- her 2026-11-19 "i want to make my personal appointment colours more monochromatic and less colour diverse". Today her own events
     on the calendar are solid blocks in six group colours (Fitness green, Work blue, Home gold, Self-care purple, Together coral,
     Meals cyan) beside the patients' Cliniko colours. Four panels: Now · A one slate · B shades of slate by group · C greys by group.
     Patient blocks are made up and keep their Cliniko colours in every panel. -->
<style>
  :root { --ink: #141F23; --soft: #4A575B; --line: #D3DEE2; --herb: #165C74; --paper: #F6F9FA; --font: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 400 13px/1.3 var(--font); width: 1180px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .p { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(11,59,75,.08); padding: 12px; }
  .p h2 { margin: 0 0 4px; font: 700 13px var(--font); }
  .p .sub { margin: 0 0 10px; color: var(--soft); font-size: 11.5px; min-height: 30px; }
  .cal { position: relative; height: 560px; border-top: 1px solid var(--line); }
  .hr { position: absolute; left: 0; right: 0; border-top: 1px solid #EEF2F4; font-size: 10.5px; color: var(--soft); padding-left: 2px; }
  .b { position: absolute; border-radius: 6px; padding: 4px 7px; font: 700 12px/1.25 var(--font); color: #fff; overflow: hidden; box-shadow: 0 0 0 1px #fff; }
  .b small { display: block; font-weight: 400; opacity: .9; font-size: 11px; }
  .pt { left: 34px; width: calc(55% - 20px); }
  .me { left: calc(55% + 16px); right: 2px; }
  .g { display: inline-block; width: 12px; text-align: center; margin-right: 4px; font-weight: 400; }
  .key { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .key span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--soft); }
  .key i { width: 10px; height: 10px; border-radius: 3px; }
</style></head>
<body>
<div class="row" id="row"></div>
<script>
  // made-up day: patients (Cliniko colours) on the left, her own things on the right
  const pts = [[9, 1, "Zz Mia Hart", "#1DA6B9"], [10.5, 1, "Zz Ann Lee", "#E8A33D"], [13, 1, "Zz Eve Sato", "#1DA6B9"], [15, 1, "Zz Kim Ford", "#C2567A"], [16.5, 0.75, "Zz Nina Park", "#1DA6B9"]];
  const mine = [["fit", "Gym", 7, 1, "▲"], ["work", "Admin", 11.5, 1, "▤"], ["meal", "Lunch", 12.25, 0.5, "◍"], ["home", "Groceries", 14, 0.75, "⌂"], ["self", "Pilates", 17.5, 1, "✿"], ["tog", "Dinner out", 19, 1.5, "♥"]];
  const groups = ["fit", "work", "home", "self", "tog", "meal"], names = { fit: "Fitness", work: "Work", home: "Home", self: "Self-care", tog: "Together", meal: "Meals" };
  const P = [
    ["Now", "Six group colours", { fit: "#4FB36A", work: "#4F86E8", home: "#D9A93E", self: "#9A82E0", tog: "#E0775A", meal: "#3FB0C0" }],
    ["A · One slate", "All her things one colour; the icon says the group", Object.fromEntries(groups.map(g => [g, "#4E6470"]))],
    ["B · Shades of slate", "One colour, a lighter or deeper shade a group", { fit: "#2F4550", work: "#3E5662", home: "#557080", self: "#6C8794", tog: "#83A0AC", meal: "#9DB6C0" }],
    ["C · Greys", "Neutral greys a group; patients the only colour", { fit: "#3A3F42", work: "#4B5155", home: "#5E6468", self: "#71777B", tog: "#868C90", meal: "#9CA1A4" }],
  ];
  const y = h => (h - 7) * 40;
  document.getElementById("row").innerHTML = P.map(([t, sub, col]) => {
    const hrs = Array.from({ length: 14 }, (_, i) => `<div class="hr" style="top:${i * 40}px">${((i + 6) % 12) + 1}</div>`).join("");
    const pb = pts.map(([s, d, n, c]) => `<div class="b pt" style="top:${y(s)}px;height:${d * 40 - 2}px;background:${c}">${n}</div>`).join("");
    const mb = mine.map(([g, n, s, d, ic]) => `<div class="b me" style="top:${y(s)}px;height:${d * 40 - 2}px;background:${col[g]}"><span class="g">${ic}</span>${n}</div>`).join("");
    const key = groups.map(g => `<span><i style="background:${col[g]}"></i>${names[g]}</span>`).join("");
    return `<div class="p"><h2>${t}</h2><p class="sub">${sub}</p><div class="cal">${hrs}${pb}${mb}</div><div class="key">${key}</div></div>`;
  }).join("");
</script>
</body></html>
