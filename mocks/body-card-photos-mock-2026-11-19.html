<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body card photos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<!-- her 2026-11-19 "put my body photos relating to my body measurements" (her own record, Patient details › Body card).
     Her body photos live on Meals › Body › Over time (Front, Back, Side left / right, Arms abducted), covered until she taps Show.
     Three ways to put them beside the readings. Figures are drawn stand-ins, the numbers made up. -->
<style>
  :root { --ink: #141F23; --soft: #4A575B; --faint: #7A878B; --line: #D3DEE2; --herb: #165C74; --tint: #EDF5F8; --paper: #F4F8F9; --font: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #EEF3F5; color: var(--ink); font: 400 13px/1.3 var(--font); width: 1240px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .opt h2 { margin: 0 0 2px; font: 700 13px var(--font); }
  .opt .sub { margin: 0 0 8px; color: var(--soft); font-size: 11.5px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .sec { background: #E3EDF1; padding: 8px 12px; font: 700 10.5px var(--font); letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
  .in { padding: 8px 12px 12px; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat div { background: var(--paper); border-radius: 10px; padding: 6px 9px; } .stat b { display: block; font: 700 13px var(--font); } .stat small { color: var(--faint); font-size: 11.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 10px; }
  th { text-align: left; font: 700 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 6px 4px 0; }
  td { padding: 3px 6px 3px 0; color: var(--soft); vertical-align: middle; }
  .chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: 600 12px var(--font); color: var(--ink); }
  .bar { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .bar span { height: 28px; padding: 0 9px; display: inline-flex; align-items: center; font: 600 12px var(--font); border-left: 1px solid var(--line); }
  .bar span:first-child { border-left: 0; } .bar span.on { background: var(--herb); color: #fff; }
  .ph { display: block; background: #DDE6EA; border-radius: 6px; overflow: hidden; }
  .ph svg { display: block; width: 100%; height: 100%; }
  .th { width: 34px; height: 46px; }
  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .cols .c { text-align: center; } .cols .ph { aspect-ratio: 3/4; }
  .cols .d { font: 700 10.5px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
  .cols .v { font: 600 12px var(--font); color: var(--ink); } .cols .f { font-size: 11.5px; color: var(--soft); }
  .cols .c.now .d { color: var(--ink); }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 10px; }
  .vs .ph { aspect-ratio: 3/4; } .vs .cap { text-align: center; margin-top: 4px; font-size: 11.5px; color: var(--soft); } .vs .cap b { color: var(--ink); font: 700 13px var(--font); display: block; }
  .vs .mid { text-align: center; font: 700 13px var(--font); } .vs .mid small { display: block; font: 400 11.5px var(--font); color: var(--soft); }
  .strip { display: flex; gap: 6px; margin-top: 10px; } .strip .ph { width: 40px; height: 54px; } .strip .ph.sel { outline: 2px solid var(--herb); outline-offset: 1px; }
  .tools { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
</style></head>
<body>
<div class="row" id="row"></div>
<script>
  const fig = (w, tone) => `<svg viewBox="0 0 60 80"><rect width="60" height="80" fill="${tone || "#DDE6EA"}"/><circle cx="30" cy="13" r="6" fill="#9FB2BA"/><path d="M${30 - w} 22h${w * 2}l2 22-3 2-1 16-2 16h-4l-1-18-1 18h-4l-2-16-1-16-3-2z" fill="#9FB2BA"/></svg>`;
  const R = [["Thu 19 Nov", 59, "32%", 12], ["Mon 26 Oct", 58, "—", 11.6], ["Mon 28 Sep", 60.2, "33%", 12.4], ["Sun 30 Aug", 61, "34%", 12.8]];
  const stTop = `<div class="stat"><div><b>24.2</b><small>BMI</small></div><div><b>18.9 kg</b><small>fat mass</small></div></div>`;
  const head = right => `<div class="sec"><span>BODY</span>${right || ""}</div>`;
  const viewBar = `<span class="bar"><span class="on">Front</span><span>Back</span><span>Side</span><span>Arms</span></span>`;
  const A = `<div class="card">${head()}<div class="in">${stTop}
    <div class="tools">${viewBar}<span class="chip">Show</span></div>
    <table><tr><th>Date</th><th>Kg</th><th>Fat</th><th>Front</th></tr>
    ${R.map(r => `<tr><td>${r[0]} 2026</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="ph th">${fig(r[3])}</span></td></tr>`).join("")}</table></div></div>`;
  const B = `<div class="card">${head()}<div class="in">${stTop}
    <div class="tools">${viewBar}<span class="chip">Show</span></div>
    <div class="cols">${R.map((r, i) => `<div class="c${i ? "" : " now"}"><span class="ph">${fig(r[3])}</span><div class="d">${i ? r[0].slice(4) : "Today"}</div><div class="v">${r[1]} kg</div><div class="f">${r[2]}</div></div>`).join("")}</div></div></div>`;
  const C = `<div class="card">${head()}<div class="in">${stTop}
    <div class="tools">${viewBar}<span class="chip">Show</span></div>
    <div class="vs"><div><span class="ph">${fig(12.8)}</span><div class="cap"><b>61 kg · 34%</b>30 Aug</div></div>
      <div class="mid">−2 kg<small>−2% fat</small><small>12 wk</small></div>
      <div><span class="ph">${fig(12)}</span><div class="cap"><b>59 kg · 32%</b>Today</div></div></div>
    <div class="strip">${R.slice().reverse().map((r, i) => `<span class="ph${i === 0 ? " sel" : ""}">${fig(r[3])}</span>`).join("")}</div></div></div>`;
  const P = [["A · A photo on each row", "The readings table gains a Front column", A], ["B · Photos across, numbers under", "One column a day: the photo, kg, fat", B], ["C · First beside today", "Two photos, the change between; tap the strip to pick", C]];
  document.getElementById("row").innerHTML = P.map(([t, s, h]) => `<div class="opt"><h2>${t}</h2><p class="sub">${s}</p>${h}</div>`).join("");
</script>
</body></html>
