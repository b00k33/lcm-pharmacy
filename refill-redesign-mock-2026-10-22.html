<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula refill mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root {
  --ink: #141F23; --soft: #4A575B; --faint: #626D71; --line: #D3DEE2; --line2: #E7EEF0;
  --bg: #F3F6F7; --card: #FFFFFF; --navy: #0B3B4B; --teal: #165C74; --teal-tint: #E8F2F5;
  --gold: #D9AE47; --gold-deep: #8A6D1A; --gold-tint: #FFF8E1;
  --good: #2F7A4F; --good-tint: #E7F4EC; --bad: #A4262C; --bad-tint: #FCEDEE; --low: #C98A1B;
  --dur: 220ms; --ease: cubic-bezier(.2,.7,.2,1);
  font-family: Inter, system-ui, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: #DADFE1; font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-family: "Barlow Condensed", Inter, sans-serif; font-variant-numeric: tabular-nums; }

/* ---------- mock bar (grey, not part of the design) ---------- */
.mockbar { background: #5B6466; color: #fff; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; position: sticky; top: 0; z-index: 50; }
.mockbar b { font-weight: 700; margin-right: 2px; }
.mockbar .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 7px; overflow: hidden; }
.mockbar .seg button { background: none; border: 0; color: #fff; padding: 3px 8px; font-size: 12px; }
.mockbar .seg button.on { background: #fff; color: #333; font-weight: 700; }
.mockbar .replay { background: #fff; color: #333; border: 0; border-radius: 7px; padding: 4px 10px; font-weight: 700; }
.mockbar .q { display: inline-flex; gap: 4px; align-items: center; }

/* ---------- stage ---------- */
.stage { padding: 20px 16px 60px; display: flex; justify-content: center; }
.app { width: 100%; max-width: 1160px; background: var(--bg); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 28px rgba(0,0,0,.14); position: relative; }
body.phone .app { max-width: 380px; border-radius: 26px; }

/* top bar */
.top { background: var(--navy); color: #fff; padding: 16px 22px; display: flex; align-items: center; gap: 14px; }
.top h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.top .sum { color: #B9CDD4; font-size: 13px; display: flex; gap: 10px; }
.top .sum b { color: #fff; } .top .sum .s b { color: var(--gold); }
.top .sp { flex: 1; }
.tbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; display: grid; place-items: center; transition: background var(--dur); }
.tbtn:hover { background: rgba(255,255,255,.22); }
.tpill { height: 40px; border-radius: 20px; border: 0; background: var(--gold); color: #2A2105; font-weight: 700; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; }
.tmenu { position: absolute; right: 18px; top: 62px; background: #fff; border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.2); padding: 6px; z-index: 20; min-width: 220px; transform-origin: top right; animation: pop var(--dur) var(--ease); }
.tmenu button { display: flex; width: 100%; gap: 10px; align-items: center; background: none; border: 0; padding: 10px 12px; border-radius: 8px; text-align: left; }
.tmenu button:hover { background: var(--teal-tint); }
.tmenu small { display: block; color: var(--faint); font-size: 12px; }
body.phone .top { padding: 14px 16px; flex-wrap: wrap; }
body.phone .top h1 { font-size: 19px; }
body.phone .top .sum { order: 5; width: 100%; font-size: 12px; }

/* card */
.card { background: var(--card); margin: 16px; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
body.phone .card { margin: 10px; }
.tabs { display: flex; align-items: center; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--line2); }
.tab { background: none; border: 0; padding: 14px 10px 12px; color: var(--soft); font-weight: 500; position: relative; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.tab .c { font-size: 11px; background: var(--line2); color: var(--soft); border-radius: 9px; padding: 1px 7px; font-weight: 700; }
.tab.on { color: var(--ink); font-weight: 700; }
.tab.on .c { background: var(--navy); color: #fff; }
.tab::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--gold); transform: scaleX(0); transition: transform var(--dur) var(--ease); }
.tab.on::after { transform: scaleX(1); }
.tabs .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; color: var(--faint); font-size: 13px; min-width: 190px; }
body.phone .tabs { overflow-x: auto; padding: 0 6px; }
body.phone .search { display: none; }

/* week strip (Q8 A) */
.wstrip { display: flex; gap: 8px; padding: 14px 16px 4px; overflow-x: auto; }
.wtile { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 14px; text-align: left; min-width: 118px; transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur) var(--ease); }
.wtile:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.06); }
.wtile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; }
.wtile .v { display: flex; align-items: baseline; gap: 8px; }
.wtile .v .num { font-size: 22px; font-weight: 700; }
.wtile .v span { color: var(--soft); font-size: 12px; }
.wtile.late { border-color: #EBC9A0; background: var(--gold-tint); } .wtile.late .k { color: var(--gold-deep); }
.wtile.on { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }

/* short bar */
.short { margin: 12px 16px 2px; background: var(--gold-tint); border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; color: #6B5310; font-size: 13px; }
.short .sp { flex: 1; }
.short button { border: 0; background: none; font-weight: 700; color: var(--navy); white-space: nowrap; }
body.phone .short { flex-wrap: wrap; }

/* groups */
.grp { padding: 16px 20px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.grp .c { background: var(--line2); border-radius: 8px; padding: 0 6px; }
.grp.late { color: var(--gold-deep); }

/* ---------- rows ---------- */
.list { padding-bottom: 8px; }
.row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) 230px 80px 140px; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--line2); background: #fff; transition: background var(--dur), opacity var(--dur), transform var(--dur) var(--ease), max-height calc(var(--dur) * 1.6) var(--ease), padding calc(var(--dur) * 1.6) var(--ease); max-height: 600px; animation: rowIn calc(var(--dur) * 1.4) var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.row:hover { background: #FAFCFC; }
.nm { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.nm b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--teal); letter-spacing: .03em; }
.meter { display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 13px; }
.bar { width: 70px; height: 6px; border-radius: 3px; background: var(--line2); overflow: hidden; flex: 0 0 auto; }
.bar i { display: block; height: 100%; width: var(--p); background: var(--teal); border-radius: 3px; transition: width calc(var(--dur) * 3) var(--ease); }
.meter.low .bar i { background: var(--low); } .meter.zero .bar i { background: var(--bad); }
.meter .g { font-weight: 700; color: var(--ink); } .meter.zero .g { color: var(--bad); }
.wk { border: 0; background: none; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 15px; color: var(--teal); padding: 4px 8px; border-radius: 7px; transition: background var(--dur); }
.wk:hover { background: var(--teal-tint); }
.wk.late { color: var(--gold-deep); }
.act { display: flex; justify-content: flex-end; gap: 6px; }
.btn { border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 700; font-size: 13px; transition: transform 120ms, background var(--dur), box-shadow var(--dur); }
.btn:active { transform: scale(.97); }
.btn.go { background: var(--navy); color: #fff; min-width: 120px; }
.btn.go:hover { box-shadow: 0 4px 12px rgba(11,59,75,.25); }
.btn.fix { background: var(--bad-tint); color: var(--bad); min-width: 120px; }
.btn.ghost { background: var(--line2); color: var(--ink); }
.btn.good { background: var(--good-tint); color: var(--good); }
.btn.sm { padding: 6px 11px; font-size: 12px; min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; }
.badge.good { background: var(--good-tint); color: var(--good); }
.badge.bad { background: var(--bad-tint); color: var(--bad); }

/* row style B: jar cards */
.rowsB .row { grid-template-columns: 44px minmax(0,1fr) 80px 140px; padding: 12px 20px; }
.jar { width: 30px; height: 38px; position: relative; }
.jar svg { width: 100%; height: 100%; }
.jar .fill { transition: y calc(var(--dur) * 3) var(--ease), height calc(var(--dur) * 3) var(--ease); }
.rowsB .sub { display: block; color: var(--soft); font-size: 12.5px; margin-top: 2px; }
.rowsB .sub b { color: var(--ink); } .rowsB .zero .sub b, .rowsB .sub .zero { color: var(--bad); }
.rowsB .nmwrap { min-width: 0; }

/* row style C: compact */
.rowsC .row { grid-template-columns: 10px minmax(0,1fr) 70px 58px 64px 110px; padding: 7px 20px; gap: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); }
.dot.low { background: var(--low); } .dot.zero { background: var(--bad); }
.rowsC .gg { font-family: "Barlow Condensed"; font-weight: 700; font-size: 15px; text-align: right; }
.rowsC .dd { color: var(--faint); font-size: 12px; }
.rowsC .btn { padding: 6px 10px; min-width: 96px; }

/* phone rows: all styles stack */
body.phone .row, body.phone .rowsB .row, body.phone .rowsC .row { grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "nm wk" "mt act"; padding: 12px 14px; gap: 8px 10px; }
body.phone .rowsB .row { grid-template-columns: 34px minmax(0,1fr) auto; grid-template-areas: "jar nm wk" "jar mt act"; }
body.phone .row .nm, body.phone .row .nmwrap { grid-area: nm; } body.phone .row .meter, body.phone .row .mt { grid-area: mt; }
body.phone .row .wkc { grid-area: wk; justify-self: end; } body.phone .row .act { grid-area: act; }
body.phone .row .jar { grid-area: jar; align-self: center; }
body.phone .rowsC .row .dot, body.phone .rowsC .row .dd { display: none; }
body.phone .btn.go, body.phone .btn.fix { min-width: 96px; }
body.phone .nm b { font-size: 14.5px; white-space: normal; }

.badge, .btn { white-space: nowrap; }
.act { align-items: center; }
.tabs, .wstrip { scrollbar-width: none; } .tabs::-webkit-scrollbar, .wstrip::-webkit-scrollbar { display: none; }
body.phone .nm { display: block; } body.phone .nm i { margin-left: 6px; }
body.phone .tpill { height: 36px; padding: 0 12px; font-size: 13px; }
body.phone .tpill .long { display: none; }
body.phone .short { flex-wrap: nowrap; align-items: flex-start; }
body.phone .short > span:nth-child(2) { flex: 1; }
body.phone .short .sp { display: none; }
body.phone .act .badge { display: none; }

/* expansion area (fix / week / make) */
.ex { grid-column: 1 / -1; overflow: hidden; animation: exIn calc(var(--dur) * 1.3) var(--ease) both; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 4px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; transition: background var(--dur), border-color var(--dur); }
.chip:hover { background: var(--teal-tint); border-color: var(--teal); }
.chip.rec { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip.red { background: var(--bad-tint); border-color: #F0C6C9; color: var(--bad); }
.chip.warn { color: var(--gold-deep); }
.ex .lbl { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.ex .gap { width: 10px; }

/* week popover (Q4 A) */
.pop { position: absolute; z-index: 30; background: #fff; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.22); width: 270px; padding: 8px; transform-origin: top center; animation: pop var(--dur) var(--ease); }
.pop h4 { margin: 6px 8px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.pop .wr { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; padding: 8px 10px; border-radius: 8px; }
.pop .wr:hover { background: var(--teal-tint); }
.pop .wr.sel { background: var(--navy); color: #fff; } .pop .wr.sel span { color: #CFE0E6; }
.pop .wr.past { color: var(--gold-deep); }
.pop .wr span { color: var(--faint); font-size: 12px; }
.pop .foot { display: flex; gap: 6px; border-top: 1px solid var(--line2); margin-top: 6px; padding: 8px 4px 2px; }
.pop .foot button { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 12.5px; background: var(--line2); }
.pop .foot .off { background: var(--bad-tint); color: var(--bad); }

/* swipe (Q4 C, phone) */
.swipewrap { position: relative; overflow: hidden; }
.swipeback { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: stretch; }
.swipeback div { display: flex; align-items: center; padding: 0 18px; color: #fff; font-weight: 700; font-size: 13px; }
.swipeback .l { background: var(--gold-deep); } .swipeback .r { background: var(--bad); }
.swipewrap .row { touch-action: pan-y; }
.hint { font-size: 12px; color: var(--faint); padding: 6px 20px 0; }

/* side sheet (Q5 B, Q3 B) */
.scrim { position: absolute; inset: 0; background: rgba(11,30,36,.32); z-index: 40; animation: fade var(--dur) both; }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; z-index: 41; box-shadow: -12px 0 36px rgba(0,0,0,.18); display: flex; flex-direction: column; animation: slideIn calc(var(--dur) * 1.3) var(--ease) both; }
body.phone .sheet { top: auto; height: 82%; width: 100%; border-radius: 20px 20px 0 0; animation-name: slideUp; }
.sheet header { padding: 18px 20px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line2); }
.sheet header h3 { margin: 0; font-size: 17px; flex: 1; }
.sheet .body { padding: 12px 20px; overflow: auto; flex: 1; }
.sheet footer { padding: 12px 20px; border-top: 1px solid var(--line2); display: flex; gap: 8px; justify-content: flex-end; }
.sheet .x { border: 0; background: var(--line2); border-radius: 50%; width: 32px; height: 32px; }
.shr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 0; border-bottom: 1px solid var(--line2); }
.shr .t { font-weight: 600; } .shr .m { color: var(--soft); font-size: 12.5px; } .shr .m b { color: var(--bad); }
.shr .a { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; align-items: center; }
.field { display: block; margin-bottom: 12px; } .field span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 4px; }
.field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }

/* make inline (Q6 A) */
.mk { background: #F7FAFB; border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; margin: 6px 0 4px; }
.mk .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.ring { width: 42px; height: 42px; flex: 0 0 auto; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--line2); } .ring .fg { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset var(--dur) var(--ease); transform: rotate(-90deg); transform-origin: 50% 50%; }
.mk .head .t { flex: 1; } .mk .head .t b { display: block; } .mk .head .t span { color: var(--soft); font-size: 12.5px; }
.hb { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.herb { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; transition: background var(--dur), border-color var(--dur), opacity var(--dur); text-align: left; }
.herb .num { font-size: 18px; font-weight: 700; }
.herb.done { background: var(--good-tint); border-color: #B9DEC7; }
.herb.done .n::before { content: "✓ "; color: var(--good); font-weight: 800; }
.mk .finish { margin-top: 10px; display: flex; gap: 8px; align-items: center; justify-content: flex-end; }

/* focus mode (Q6 B) */
.focus { position: absolute; inset: 0; background: var(--navy); color: #fff; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; animation: fade calc(var(--dur) * 1.3) both; padding: 20px; text-align: center; }
.focus .step { color: #B9CDD4; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.focus .hn { font-size: 30px; font-weight: 700; }
.focus .hg { font-family: "Barlow Condensed"; font-size: 96px; font-weight: 700; line-height: 1; color: var(--gold); animation: numIn calc(var(--dur) * 1.5) var(--ease) both; }
.focus .dots { display: flex; gap: 6px; margin: 8px 0 14px; }
.focus .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background var(--dur); }
.focus .dots i.on { background: var(--gold); }
.focus .row2 { display: flex; gap: 10px; }
.focus .btn.go { background: var(--gold); color: #2A2105; min-width: 160px; font-size: 15px; padding: 12px 20px; }
.focus .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }

/* made shelf */
.made { margin: 6px 16px 16px; border-top: 1px dashed var(--line); padding-top: 10px; }
.made .h { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--good); margin-bottom: 6px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; color: var(--soft); animation: rowIn calc(var(--dur) * 1.4) var(--ease) both; }
.mrow .ck { width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
body.lively .mrow .ck { animation: ckPop 520ms var(--ease) both; }
.mrow b { color: var(--ink); font-weight: 600; } .mrow .sp { flex: 1; }
.mrow button { border: 0; background: none; color: var(--teal); font-weight: 700; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 14px 11px 16px; display: flex; gap: 14px; align-items: center; font-size: 13px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: toastIn calc(var(--dur) * 1.3) var(--ease) both; max-width: calc(100% - 24px); }
.toast button { border: 0; background: none; color: var(--gold); font-weight: 800; }

/* leaving rows */
.row.leaving { opacity: 0; transform: translateX(30px); max-height: 0; padding-top: 0; padding-bottom: 0; border-top-color: transparent; }
body.lively .row.leaving.up { transform: translateY(-14px) scale(.98); }
.row.flash { background: var(--good-tint); }

/* empty */
.empty { padding: 40px 20px; text-align: center; color: var(--soft); }
.empty .big { font-size: 40px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin: 6px 0 4px; }

/* note under the board */
.note { max-width: 1160px; margin: 0 auto; padding: 0 16px; color: #3C4648; font-size: 13px; }
.note b { color: #111; }

@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(-4px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes slideIn { from { transform: translateX(100%); } }
@keyframes slideUp { from { transform: translateY(100%); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes exIn { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 500px; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } }
@keyframes numIn { from { opacity: 0; transform: translateY(16px) scale(.92); } }
@keyframes ckPop { 0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
body.anim-off *, body.anim-off *::before, body.anim-off *::after { animation: none !important; transition: none !important; }
body.anim-subtle .row { animation-delay: 0ms; }
</style>
</head>
<body>

<div class="mockbar" id="mockbar"></div>
<div class="stage"><div class="app" id="app"></div></div>
<div class="note" id="note"></div>

<script>
// ---------- mock data (sample, from her screenshot) ----------
const DATA = () => [
  { id: "cgt", n: "Chai Gui Tang", c: "CGT", g: 0, line: 150, d: 0, wk: 41, short: [{ h: "Gui Zhi", need: 45, have: 10 }], batch: 300,
    herbs: [["Chai Hu", 60], ["Gui Zhi", 45], ["Huang Qin", 45], ["Ban Xia", 45], ["Bai Shao", 45], ["Gan Cao", 30], ["Da Zao", 30]] },

  { id: "dg", n: "Dang Gui Shao Yao San", c: "DGSYS", g: 0, line: 150, d: 0, wk: 43, short: [{ h: "Chuan Xiong #/ Cnidium", need: 40, have: 0 }], batch: 300,
    herbs: [["Dang Gui", 45], ["Bai Shao", 90], ["Chuan Xiong", 40], ["Fu Ling", 45], ["Ze Xie", 45], ["Bai Zhu", 35]] },
  { id: "mx", n: "Ma Xing Shi Gan Tang", c: "MXSGT", g: 40, line: 120, d: 5, wk: 43, short: [{ h: "Xing Ren", need: 50, have: 20 }], batch: 300,
    herbs: [["Ma Huang", 60], ["Xing Ren", 50], ["Shi Gao", 150], ["Gan Cao", 40]] },

  { id: "wls", n: "Wu Ling San", c: "WLS", g: 70, line: 150, d: 8, wk: 44, batch: 300,
    herbs: [["Ze Xie", 75], ["Fu Ling", 60], ["Zhu Ling", 60], ["Bai Zhu", 60], ["Gui Zhi", 45]] },
];
const THIS_WK = 43;

// ---------- the picks being mocked ----------
const Q = [
  ["view", "View", [["desk", "Desktop"], ["phone", "Phone"]]],
  ["q1", "1 Rows", [["A", "A Clean table"], ["B", "B Jar rows"], ["C", "C Compact"]]],
  ["q2", "2 Stocked up", [["A", "A Leaves itself"], ["B", "B Badge + Take off"], ["C", "C Stays"]]],
  ["q3", "3 + button", [["A", "A Plan a formula"], ["B", "B Recipe in a sheet"], ["C", "C Small menu"]]],
  ["q4", "4 Week tap", [["A", "A Popover"], ["B", "B Opens in row"], ["C", "C Swipe (phone)"]]],
  ["q5", "5 Fix short", [["A", "A In the row"], ["B", "B Side sheet"], ["C", "C Chips on row"]]],
  ["q6", "6 Make", [["A", "A In the row"], ["B", "B Focus screen"], ["C", "C Workbench (now)"]]],
  ["q7", "7 Motion", [["A", "A Subtle"], ["B", "B Lively"], ["C", "C Off"]]],
  ["q8", "8 Weeks", [["A", "A Week tiles"], ["B", "B Headings only"]]],
];
const S = { view: "desk", q1: "B", q2: "A", q3: "A", q4: "A", q5: "A", q6: "A", q7: "B", q8: "A" };
(location.hash.slice(1).split(/[&,]/)).forEach(p => { const m = p.match(/^(q\d|view)=?(\w+)$/); if (m && S[m[1]] != null) S[m[1]] = m[2] === "phone" || m[2] === "desk" ? m[2] : m[2].toUpperCase(); });

let F = DATA(), tab = "make", openEx = null, pop = null, sheet = null, focus = null, made = [], toast = null, tmenu = false, wkFilter = null, mk = {};
let toastTimer = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const grpOf = f => f.wk < THIS_WK ? ["late", "Overdue"] : f.wk === THIS_WK ? ["now", "This week"] : f.wk === THIS_WK + 1 ? ["next", "Next week"] : ["later", "Later"];
const lvl = f => f.g <= 0 ? "zero" : f.g < f.line ? "low" : "";
const pct = f => f.g <= 0 ? 3 : Math.min(100, Math.round(f.g / f.line * 100));
const daysTxt = f => f.g <= 0 ? "empty" : `~${f.d} d`;
const shorts = () => F.filter(f => f.short);
const shortHerbs = () => [...new Set(shorts().flatMap(f => f.short.map(s => s.h)))];

function jarSvg(f) {
  const p = f.g <= 0 ? 4 : Math.min(100, f.g / f.line * 100), h = 26 * p / 100, y = 34 - h;
  const col = lvl(f) === "zero" ? "var(--bad)" : lvl(f) === "low" ? "var(--low)" : "var(--teal)";
  return `<div class="jar"><svg viewBox="0 0 30 38"><rect x="7" y="1.5" width="16" height="5" rx="1.5" fill="var(--soft)"/><rect x="3" y="6.5" width="24" height="30" rx="5" fill="#F3F7F8" stroke="var(--line)" stroke-width="1.4"/><clipPath id="c${f.id}"><rect x="4" y="7.5" width="22" height="28" rx="4"/></clipPath><rect class="fill" clip-path="url(#c${f.id})" x="3" y="${y}" width="24" height="${h + 3}" fill="${col}" opacity=".85"/></svg></div>`;
}

function weekBtn(f) { return `<button class="wk${f.wk < THIS_WK ? " late" : ""}" data-wk="${f.id}" title="Change the week">Wk ${f.wk}</button>`; }

function actHtml(f) {
  if (f.stocked && S.q2 === "B") return `<span class="badge good">Stocked up</span><button class="btn good sm" data-off="${f.id}">Take off</button>`;
  if (f.short && S.q5 === "C") return `<button class="btn ghost sm" data-order="${f.id}">Order</button><button class="btn fix" data-fix="${f.id}" style="min-width:auto">Short</button>`;
  if (f.short) return `<button class="btn fix" data-fix="${f.id}" aria-expanded="${openEx && openEx.id === f.id}">Fix short ${openEx && openEx.id === f.id && openEx.k === "fix" ? "▴" : "▾"}</button>`;
  return `<button class="btn go" data-make="${f.id}">Make</button>`;
}

function shortChips(f) {
  if (f.stocked && S.q2 === "B" && S.view === "phone") return `<span class="badge good" style="margin-left:6px">Stocked up</span>`;
  return f.short && S.q5 === "C" ? `<span class="chips" style="padding:0;display:inline-flex">${f.short.map(s => `<span class="chip red" style="padding:2px 9px;font-size:11.5px">${esc(s.h.replace(/ #.*/, ""))} −${s.need - s.have} g</span>`).join("")}</span>` : "";
}

function exHtml(f) {
  if (!openEx || openEx.id !== f.id) return "";
  if (openEx.k === "fix") {
    const s = f.short[0], left = Math.floor(f.batch * s.have / s.need);
    return `<div class="ex"><div class="chips"><span class="lbl">Short</span>${f.short.map(s => `<span class="chip red">${esc(s.h)} · ${s.need - s.have} g short</span>`).join("")}<span class="gap"></span>
      ${left > 0 ? `<button class="chip rec" data-make="${f.id}">Use what is left · ${left} g</button>` : ""}<button class="chip">Substitute</button><button class="chip" data-order="${f.id}">Add to To order</button></div></div>`;
  }
  if (openEx.k === "week") {
    const wks = [THIS_WK, THIS_WK + 1, THIS_WK + 2, THIS_WK + 3];
    return `<div class="ex"><div class="chips"><span class="lbl">Make it</span>${wks.map((w, i) => `<button class="chip${w === f.wk ? " rec" : ""}" data-setwk="${f.id}:${w}">${i === 0 ? "This week" : i === 1 ? "Next week" : "Wk " + w}</button>`).join("")}<span class="gap"></span><span class="lbl">Not now</span><button class="chip warn" data-snooze="${f.id}">Snooze 1 week</button><button class="chip red" data-off="${f.id}">Take off the list</button></div></div>`;
  }
  if (openEx.k === "make") {
    const m = mk[f.id] || (mk[f.id] = new Set()), n = f.herbs.length, done = m.size, C = 2 * Math.PI * 18;
    return `<div class="ex"><div class="mk"><div class="head"><svg class="ring" viewBox="0 0 42 42"><circle class="bg" cx="21" cy="21" r="18"/><circle class="fg" cx="21" cy="21" r="18" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - done / n)}"/></svg>
      <div class="t"><b>Weigh ${f.batch} g of ${esc(f.n)}</b><span>${done} of ${n} herbs weighed · tap each one as it goes in</span></div><button class="btn ghost sm" data-close="1">Not now</button></div>
      <div class="hb">${f.herbs.map(([h, g], i) => `<button class="herb${m.has(i) ? " done" : ""}" data-weigh="${f.id}:${i}"><span class="n">${esc(h)}</span><span class="num">${g}<small style="font-size:11px"> g</small></span></button>`).join("")}</div>
      <div class="finish"><span style="color:var(--soft);font-size:12.5px">${done === n ? "All in. Finish adds it to the jar." : ""}</span><button class="btn go" data-finish="${f.id}" ${done === n ? "" : "disabled style=\"opacity:.45\""}>Finish · add ${f.batch} g</button></div></div></div>`;
  }
  return "";
}

function rowHtml(f, i) {
  const L = lvl(f), ex = exHtml(f);
  if (S.q1 === "B") return `<div class="row ${L}" data-id="${f.id}" style="--i:${i}">${jarSvg(f)}
    <div class="nmwrap"><div class="nm"><b>${esc(f.n)}</b><i>${f.c}</i></div><span class="sub mt"><b class="${L === "zero" ? "zero" : ""}">${f.g} g</b> · ${daysTxt(f)}${f.stocked && S.q2 !== "C" ? "" : ""} ${shortChips(f)}</span></div>
    <div class="wkc">${weekBtn(f)}</div><div class="act">${actHtml(f)}</div>${ex}</div>`;
  if (S.q1 === "C") return `<div class="row" data-id="${f.id}" style="--i:${i}"><span class="dot ${L}"></span><div class="nm"><b>${esc(f.n)}</b><i>${f.c}</i> ${shortChips(f)}</div>
    <span class="gg mt ${L === "zero" ? "zero" : ""}" style="${L === "zero" ? "color:var(--bad)" : ""}">${f.g} g</span><span class="dd">${daysTxt(f)}</span><div class="wkc">${weekBtn(f)}</div><div class="act">${actHtml(f)}</div>${ex}</div>`;
  return `<div class="row" data-id="${f.id}" style="--i:${i}"><div class="nm"><b>${esc(f.n)}</b><i>${f.c}</i> ${shortChips(f)}</div>
    <div class="meter ${L}"><div class="bar"><i style="--p:${pct(f)}%"></i></div><span class="g num" style="font-size:15px">${f.g} g</span><span>${daysTxt(f)}</span></div>
    <div class="wkc">${weekBtn(f)}</div><div class="act">${actHtml(f)}</div>${ex}</div>`;
}

function listHtml() {
  if (tab !== "make") return `<div class="empty"><div class="big">🫙</div><b>${tab === "below" ? "6 formulas below their line" : tab === "snoozed" ? "Nothing snoozed" : "64 recipes"}</b>This mock only draws the To make list.</div>`;
  let rows = F.filter(f => !wkFilter || grpOf(f)[0] === wkFilter);
  if (!rows.length) return `<div class="empty"><div class="big">✓</div><b>Nothing to make</b>Every planned formula is made. <div style="margin-top:12px"><button class="btn ghost">6 below the line</button></div></div>`;
  let last = "", out = "", i = 0;
  rows.forEach(f => {
    const [k, t] = grpOf(f);
    if (k !== last) { out += `<div class="grp ${k}">${t}<span class="c">${rows.filter(x => grpOf(x)[0] === k).length}</span></div>`; last = k; }
    const r = rowHtml(f, i++);
    out += S.q4 === "C" && S.view === "phone" ? `<div class="swipewrap"><div class="swipeback"><div class="l">Snooze 1 wk</div><div class="r">Take off</div></div>${r}</div>` : r;
  });
  return out;
}

function stripHtml() {
  if (S.q8 !== "A" || tab !== "make") return "";
  const g = [["late", "Overdue", "Wk 41"], ["now", "This week", "Wk 43"], ["next", "Next week", "Wk 44"]];
  return `<div class="wstrip">${g.map(([k, t, w]) => { const n = F.filter(f => grpOf(f)[0] === k).length; const sh = F.filter(f => grpOf(f)[0] === k && f.short).length;
    return `<button class="wtile${k === "late" ? " late" : ""}${wkFilter === k ? " on" : ""}" data-wf="${k}"><div class="k">${t}</div><div class="v"><span class="num">${n}</span><span>${w}${sh ? ` · ${sh} short` : ""}</span></div></button>`; }).join("")}</div>`;
}

function topHtml() {
  const plus = S.q3 === "A" ? `<button class="tpill" data-plus="1">＋ Plan<span class="long"> a formula</span></button>` : `<button class="tbtn" data-plus="1" title="${S.q3 === "B" ? "New formula recipe" : "Add"}">＋</button>`;
  return `<div class="top"><h1>Formula refill</h1><div class="sum"><span><b>${F.length}</b> to make</span><span class="s"><b>${shortHerbs().length}</b> herbs short</span>${made.length ? `<span><b style="color:#9FE0B8">${made.length}</b> made</span>` : ""}</div><span class="sp"></span><button class="tbtn" data-more="1">⋯</button>${plus}</div>
    ${tmenu ? `<div class="tmenu">${S.q3 === "C" ? `<button data-plusplan="1">🫙 <span>Plan a formula<small>Add one to a making week</small></span></button><button data-newrecipe="1">📝 <span>New formula recipe<small>Opens in a side sheet</small></span></button>` : `<button>🛒 <span>Order all short (${shortHerbs().length})</span></button><button>📋 <span>Refill history</span></button><button>🖨 <span>Print making sheet</span></button>${S.q3 === "A" ? `<button data-newrecipe="1">📝 <span>New formula recipe<small>Opens in a side sheet</small></span></button>` : ""}`}</div>` : ""}`;
}

function cardHtml() {
  const tabs = [["make", "To make", F.length], ["below", "Below the line", 6], ["snoozed", "Snoozed", 0], ["all", "All recipes", 64]];
  const sh = shorts();
  return `<div class="card"><div class="tabs">${tabs.map(([k, t, c]) => `<button class="tab${tab === k ? " on" : ""}" data-tab="${k}">${t}<span class="c">${c}</span></button>`).join("")}<span class="sp"></span><div class="search">🔍 Search formulas</div></div>
    ${stripHtml()}
    ${tab === "make" && sh.length ? `<div class="short"><span>⚠</span><span><b>${sh.length} short</b> · ${shortHerbs().length} herbs — ${shortHerbs().map(h => esc(h.replace(/ #.*/, ""))).join(", ")}</span><span class="sp"></span><button data-orderall="1">🛒 Order all ${shortHerbs().length}</button></div>` : ""}
    ${S.q4 === "C" && S.view === "phone" && tab === "make" ? `<div class="hint">Swipe a row right to snooze, left to take it off. Tap the week to change it.</div>` : ""}
    <div class="list rows${S.q1}" id="list">${listHtml()}</div>
    ${made.length ? `<div class="made"><div class="h">Made today</div>${made.map(m => `<div class="mrow"><span class="ck">✓</span><span><b>${esc(m.n)}</b> · +${m.batch} g · jar now ${m.g} g</span><span class="sp"></span><button data-undomade="${m.id}">Undo</button></div>`).join("")}</div>` : ""}
  </div>`;
}

function popHtml() {
  if (!pop) return "";
  const f = F.find(x => x.id === pop.id); if (!f) return "";
  const rows = (f.wk < THIS_WK ? [f.wk] : []).concat([0, 1, 2, 3, 4].map(i => THIS_WK + i));
  const rng = w => { const mon = new Date(2026, 0, 5 + (w - 2) * 7); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${mon.getDate()} ${M[mon.getMonth()]} – ${sun.getDate()} ${M[sun.getMonth()]}`; };
  return `<div class="pop" style="left:${pop.x}px;top:${pop.y}px"><h4>Which week?</h4>${rows.map(w => `<button class="wr${w === f.wk ? " sel" : ""}${w < THIS_WK ? " past" : ""}" data-setwk="${f.id}:${w}"><b class="num" style="font-size:15px">Wk ${w}${w === THIS_WK ? " · this week" : w === THIS_WK + 1 ? " · next week" : w < THIS_WK ? " · 2 weeks ago" : ""}</b><span>${rng(w)}</span></button>`).join("")}
    <div class="foot"><button data-snooze="${f.id}">Snooze 1 week</button><button class="off" data-off="${f.id}">Take off the list</button></div></div>`;
}

function sheetHtml() {
  if (!sheet) return "";
  if (sheet.k === "fix") {
    const f = F.find(x => x.id === sheet.id); if (!f) return "";
    return `<div class="scrim" data-closesheet="1"></div><div class="sheet"><header><h3>${esc(f.n)} is short</h3><button class="x" data-closesheet="1">✕</button></header>
      <div class="body"><p style="color:var(--soft);margin:0 0 6px">A ${f.batch} g batch needs more than is on the shelf.</p>
      ${f.short.map(s => `<div class="shr"><div class="t">${esc(s.h)}</div><div class="m">needs ${s.need} g · have ${s.have} g · <b>${s.need - s.have} g short</b></div><div class="a"><button class="btn ghost sm">Substitute</button><button class="btn go sm" data-order="${f.id}" style="min-width:0">Order</button></div></div>`).join("")}
      <div class="field" style="margin-top:16px"><span>Or make a smaller batch</span><div class="chips"><button class="chip rec" data-make="${f.id}">Use what is left · ${Math.floor(f.batch * f.short[0].have / f.short[0].need)} g</button><button class="chip">Make ½ batch</button></div></div></div>
      <footer><button class="btn ghost" data-closesheet="1">Close</button></footer></div>`;
  }
  if (sheet.k === "recipe") return `<div class="scrim" data-closesheet="1"></div><div class="sheet"><header><h3>New formula recipe</h3><button class="x" data-closesheet="1">✕</button></header>
      <div class="body"><label class="field"><span>Name</span><input placeholder="e.g. the formula's name"></label><label class="field"><span>Ingredients</span><input placeholder="Add a herb, or a formula abbreviation to pour its herbs in"></label>
      <div style="color:var(--faint);font-size:13px;padding:6px 0 14px">No ingredients yet.</div><label class="field"><span>Notes</span><input placeholder="Anything worth remembering about this one…"></label></div>
      <footer><button class="btn ghost" data-closesheet="1">Cancel</button><button class="btn go" data-closesheet="1">✓ Save recipe</button></footer></div>`;
  if (sheet.k === "plan") return `<div class="scrim" data-closesheet="1"></div><div class="sheet"><header><h3>Plan a formula</h3><button class="x" data-closesheet="1">✕</button></header>
      <div class="body"><label class="field"><span>Which formula?</span><input placeholder="Search 64 recipes…" value="Ban Xia"></label>
      <div class="shr"><div class="t">Ban Xia Xie Xin Tang <i style="font-style:normal;font-size:11px;color:var(--teal);font-weight:700">BXXXT</i></div><div class="m">60 g · ~6 d · below its line</div><div class="a"><button class="chip rec" data-closesheet="1">This week</button><button class="chip" data-closesheet="1">Next week</button></div></div>
      <div class="shr"><div class="t">Ban Xia Hou Po Tang <i style="font-style:normal;font-size:11px;color:var(--teal);font-weight:700">BXHPT</i></div><div class="m">210 g · ~25 d</div><div class="a"><button class="chip" data-closesheet="1">This week</button><button class="chip" data-closesheet="1">Next week</button></div></div></div>
      <footer><button class="btn ghost" data-closesheet="1">Done</button></footer></div>`;
  return "";
}

function focusHtml() {
  if (!focus) return "";
  const f = F.find(x => x.id === focus.id); if (!f) return "";
  const i = focus.i, n = f.herbs.length;
  if (i >= n) return `<div class="focus"><div class="step">All ${n} herbs in</div><div class="hn">${esc(f.n)}</div><div class="hg">${f.batch}<span style="font-size:40px"> g</span></div><div class="row2"><button class="btn ghost" data-fback="1">Back</button><button class="btn go" data-finish="${f.id}">Finish · add to jar</button></div></div>`;
  const [h, g] = f.herbs[i];
  return `<div class="focus"><div class="step">${esc(f.n)} · herb ${i + 1} of ${n}</div><div class="hn">${esc(h)}</div><div class="hg" key="${i}">${g}<span style="font-size:40px"> g</span></div>
    <div class="dots">${f.herbs.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("")}</div>
    <div class="row2"><button class="btn ghost" data-fstop="1">Stop</button>${i ? `<button class="btn ghost" data-fback="1">Back</button>` : ""}<button class="btn go" data-fnext="1">Weighed ✓ Next</button></div></div>`;
}

function render() {
  document.body.className = `${S.view === "phone" ? "phone" : ""} ${S.q7 === "B" ? "lively" : S.q7 === "C" ? "anim-off" : "anim-subtle"}`;
  document.documentElement.style.setProperty("--dur", S.q7 === "A" ? "160ms" : S.q7 === "B" ? "260ms" : "0ms");
  $("#app").innerHTML = topHtml() + cardHtml() + popHtml() + sheetHtml() + focusHtml() + (toast ? `<div class="toast"><span>${toast.t}</span>${toast.undo ? `<button data-undo="1">Undo</button>` : ""}</div>` : "");
  $("#mockbar").innerHTML = Q.map(([k, l, opts]) => `<span class="q"><b>${l}</b><span class="seg">${opts.map(([v, t]) => `<button class="${S[k] === v ? "on" : ""}" data-s="${k}:${v}">${t}</button>`).join("")}</span></span>`).join("") + `<button class="replay" data-reset="1">↺ Start again</button>`;
  $("#note").innerHTML = NOTES[S.q1] || "";
  bindSwipe();
}
const NOTES = {
  A: "<b>Try:</b> tap <b>Wk 41</b> on any row · <b>Fix short</b> on Chai Gui Tang · <b>Make</b> on Gui Zhi Fu Ling Wan · the gold <b>＋</b> · the week tiles. Wen Dan Tang shows question 2 (it was planned at 40 g and is now 320 g). Sample formulas and grams only.",
};
NOTES.B = NOTES.C = NOTES.A;

function showToast(t, undo) {
  toast = { t, undo }; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast = null; render(); }, 5200);
}
function leave(id, cls, then) {
  const el = document.querySelector(`.row[data-id="${id}"]`);
  if (!el || S.q7 === "C") { then(); render(); return; }
  if (cls) el.classList.add(cls);
  el.style.maxHeight = el.offsetHeight + "px"; void el.offsetHeight;
  el.classList.add("leaving");
  setTimeout(() => { then(); render(); }, S.q7 === "A" ? 260 : 420);
}
let undoStack = null;
function takeOff(id, msg) {
  const f = F.find(x => x.id === id); if (!f) return;
  undoStack = JSON.parse(JSON.stringify(F)); openEx = null; pop = null;
  leave(id, "up", () => { F = F.filter(x => x.id !== id); showToast(msg || `${f.n} taken off To make`, true); });
}
function finish(id) {
  const f = F.find(x => x.id === id); if (!f) return;
  focus = null; openEx = null; render();
  const el = document.querySelector(`.row[data-id="${id}"]`);
  const go = () => leave(id, "", () => { F = F.filter(x => x.id !== id); made.unshift({ ...f, g: f.g + f.batch }); showToast(`${f.n} made · jar now ${f.g + f.batch} g`, false); });
  if (el && S.q7 === "B") {
    el.classList.add("flash");
    const bar = el.querySelector(".bar i"); if (bar) bar.style.setProperty("--p", "100%");
    const fill = el.querySelector(".jar .fill"); if (fill) { fill.setAttribute("y", "7"); fill.setAttribute("height", "30"); }
    setTimeout(go, 700);
  } else go();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-closesheet], [data-wf]");
  if (!t) { if (pop || tmenu) { pop = null; tmenu = false; render(); } return; }
  const d = t.dataset;
  if (d.s) { const [k, v] = d.s.split(":"); S[k] = v; openEx = null; pop = null; sheet = null; focus = null; tmenu = false; if (k === "q2") resetData(); render(); return; }
  if (d.reset) { resetData(); render(); return; }
  if (d.tab) { tab = d.tab; wkFilter = null; render(); return; }
  if (d.wf) { wkFilter = wkFilter === d.wf ? null : d.wf; render(); return; }
  if (d.more) { tmenu = !tmenu; render(); return; }
  if (d.plus) { tmenu = false; if (S.q3 === "A") sheet = { k: "plan" }; else if (S.q3 === "B") sheet = { k: "recipe" }; else tmenu = true; render(); return; }
  if (d.plusplan) { tmenu = false; sheet = { k: "plan" }; render(); return; }
  if (d.newrecipe) { tmenu = false; sheet = { k: "recipe" }; render(); return; }
  if (d.closesheet) { sheet = null; render(); return; }
  if (d.wk) {
    if (S.q4 === "B" || (S.q4 === "C" && S.view === "phone" && false)) { openEx = openEx && openEx.id === d.wk && openEx.k === "week" ? null : { id: d.wk, k: "week" }; pop = null; render(); return; }
    const r = t.getBoundingClientRect(), a = $("#app").getBoundingClientRect();
    let x = r.left - a.left - 100, y = r.bottom - a.top + 6; x = Math.max(8, Math.min(x, a.width - 278));
    pop = pop && pop.id === d.wk ? null : { id: d.wk, x, y }; openEx = null; render(); return;
  }
  if (d.setwk) { const [id, w] = d.setwk.split(":"); const f = F.find(x => x.id === id); f.wk = +w; pop = null; openEx = null; showToast(`${f.n} moved to Wk ${w}`, false); render(); return; }
  if (d.snooze) { const f = F.find(x => x.id === d.snooze); takeOff(d.snooze, `${f.n} snoozed until Wk ${THIS_WK + 1}`); return; }
  if (d.off) { takeOff(d.off); return; }
  if (d.undo) { if (undoStack) { F = undoStack; undoStack = null; } toast = null; render(); return; }
  if (d.fix) { if (S.q5 === "B") { sheet = { k: "fix", id: d.fix }; render(); return; } if (S.q5 === "C") { sheet = { k: "fix", id: d.fix }; render(); return; } openEx = openEx && openEx.id === d.fix && openEx.k === "fix" ? null : { id: d.fix, k: "fix" }; pop = null; render(); return; }
  if (d.order || d.orderall) { const n = d.orderall ? shortHerbs().length : 1; showToast(`${n} short herb${n > 1 ? "s" : ""} added to To order`, false); render(); return; }
  if (d.make) {
    sheet = null; pop = null;
    if (S.q6 === "B") { focus = { id: d.make, i: 0 }; render(); return; }
    if (S.q6 === "C") { showToast("Opens the making workbench, as it does now", false); render(); return; }
    openEx = { id: d.make, k: "make" }; render(); return;
  }
  if (d.weigh) { const [id, i] = d.weigh.split(":"); const m = mk[id] || (mk[id] = new Set()); m.has(+i) ? m.delete(+i) : m.add(+i); render(); return; }
  if (d.close) { openEx = null; render(); return; }
  if (d.finish) { finish(d.finish); return; }
  if (d.fnext) { focus.i++; render(); return; }
  if (d.fback) { focus.i = Math.max(0, focus.i - 1); render(); return; }
  if (d.fstop) { focus = null; render(); return; }
  if (d.undomade) { const m = made.find(x => x.id === d.undomade); made = made.filter(x => x !== m); F.push({ ...m, g: m.g - m.batch }); render(); return; }
});

// swipe on phone (Q4 C)
function bindSwipe() {
  if (!(S.q4 === "C" && S.view === "phone")) return;
  document.querySelectorAll(".swipewrap .row").forEach(el => {
    let x0 = null, dx = 0;
    el.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
    el.addEventListener("pointermove", e => { if (x0 == null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px)`; });
    el.addEventListener("pointerup", () => { if (x0 == null) return; x0 = null; el.style.transition = ""; const id = el.dataset.id;
      if (dx < -90) takeOff(id); else if (dx > 90) { const f = F.find(x => x.id === id); takeOff(id, `${f.n} snoozed until Wk ${THIS_WK + 1}`); } else el.style.transform = ""; dx = 0; });
  });
}

function resetData() {
  F = DATA(); made = []; openEx = null; pop = null; sheet = null; focus = null; tmenu = false; wkFilter = null; mk = {}; toast = null; tab = "make";
  if (S.q2 === "A") { render(); setTimeout(() => { undoStack = JSON.parse(JSON.stringify(F)); leave("wdt", "up", () => { F = F.filter(x => x.id !== "wdt"); showToast("Wen Dan Tang is stocked up (320 g) — taken off To make", true); }); }, 1100); }
}
resetData(); render();
</script>
