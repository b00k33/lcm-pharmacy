#pharmacyPage .ph-eg .mw { fill: #E7AFA8; }
#pharmacyPage .ph-eg .sg { fill: #F3CEC8; }
#pharmacyPage .ph-eg .vw { fill: #F7DEDA; }
#pharmacyPage .ph-eg .vwl { fill: none; stroke: #E4AFAA; stroke-width: 3; }
#pharmacyPage .ph-eg .drp { fill: #B3174A; opacity: 0; }
/* 6 · three months */
#pharmacyPage .ph-eg .trk { fill: #E3EAED; }
#pharmacyPage .ph-eg .pg { fill: var(--ph-herb); transform-box: fill-box; transform-origin: left center; transition: transform 2.8s linear; }
#pharmacyPage .ph-eg .mk { fill: var(--ph-white); stroke: var(--ph-herb); stroke-width: 2.4; transition: transform 2.8s linear; }
#pharmacyPage .ph-eg .fo { transform-box: fill-box; transform-origin: center bottom; transition: opacity .5s ease var(--d), transform .5s ease var(--d); }
#pharmacyPage .ph-eg :is(.ov, .bl) { transition: opacity .5s; }
#pharmacyPage .ph-eg .br { fill: none; stroke: var(--ph-herb); stroke-width: 1.4; stroke-dasharray: 330; transition: stroke-dashoffset 1s; }
#pharmacyPage .ph-eg .eg-sc.pl:not(.b1) .pg { transform: scaleX(0); transition: none; }
#pharmacyPage .ph-eg .eg-sc.pl:not(.b1) .mk { transform: translateX(-312px); transition: none; }
#pharmacyPage .ph-eg .eg-sc.pl:not(.b1) .fo { opacity: 0; transform: scale(.4); transition: none; }
#pharmacyPage .ph-eg .eg-sc.pl:not(.b2) :is(.ov, .bl) { opacity: 0; }
#pharmacyPage .ph-eg .eg-sc.pl:not(.b2) .br { stroke-dashoffset: 330; }
@media (prefers-reduced-motion: no-preference) {
  #pharmacyPage .ph-eg .eg-sc.b2 .p2 .spk { animation: phIrOzSpk .6s ease-out backwards; animation-delay: calc(1.3s + var(--i) * 120ms); }
  #pharmacyPage .ph-eg .eg-sc.b3 .spm { animation: phEgSpm 1s ease-in both; }
  #pharmacyPage .ph-eg .eg-sc.b3 .k2 { animation: phEgFlash .6s ease 1s both; }
  #pharmacyPage .ph-eg .eg-sc.b3 .k4 { animation: phEgFlash .6s ease 1.6s both; }
  #pharmacyPage .ph-eg svg.go .rbg { animation: phEgSpin 1.8s cubic-bezier(.3, .7, .3, 1) backwards; }
  #pharmacyPage .ph-eg svg.go .o2i { animation: phIrOzIn 1.2s ease-out backwards; animation-delay: calc(var(--d, 0ms) + var(--i, 0) * 90ms); }
  #pharmacyPage .ph-eg svg.go .spk { animation: phIrOzSpk .6s ease-out backwards; animation-delay: calc(1.5s + var(--i, 0) * 110ms); }
  #pharmacyPage .ph-eg svg.go .cl { animation: phEgFlow 1.8s cubic-bezier(.25, .7, .3, 1) backwards; }
  #pharmacyPage .ph-eg svg.go .rbu { animation: phEgUp 1.2s ease-out backwards; animation-delay: calc(var(--i) * 140ms); }
  #pharmacyPage .ph-eg .eg-sc.b1 .drp { animation: phEgDrop 1.1s ease-in both; animation-delay: calc(var(--i) * 160ms); }
  #pharmacyPage .ph-eg .eg-sc.b2 .ov .spk { animation: phIrOzSpk .6s ease-out backwards; }
}
@keyframes phEgSpm { 0% { opacity: 0; transform: translate(-14px, -8px); } 30% { opacity: 1; } 70% { opacity: 1; transform: translate(10px, 6px); } 100% { opacity: 0; transform: translate(12px, 7px); } }
@keyframes phEgFlash { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes phEgSpin { 0% { transform: rotate(-18deg); } 100% { transform: none; } }
@keyframes phEgFlow { 0% { transform: translateX(-170px); } 100% { transform: none; } }
@keyframes phEgUp { 0% { transform: translateY(26px); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes phEgDrop { 0% { transform: translateY(-46px); opacity: 0; } 25% { opacity: 1; } 85% { opacity: 1; } 100% { transform: none; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #pharmacyPage .ph-eg :is(.eg-sc, .eg-sc *) { transition: none !important; } #pharmacyPage .ph-eg :is([data-eg-play], .eg-go) { display: none; } #pharmacyPage .ph-eg .eg-ce { cursor: default; } #pharmacyPage .ph-eg .eg-ce .pic { box-shadow: none !important; } }
@media (max-width: 860px) { #pharmacyPage .ph-eg .eg-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) {
  #pharmacyPage .ph-eg .eg-lz { grid-template-columns: minmax(0, .8fr) 12px minmax(0, 1.2fr); }
  #pharmacyPage .ph-eg .eg-lz .ar { width: 12px; height: 12px; }
}
/* Print: only this page, its six scenes at rest, one to a block */
@media print {
  body.ph-eg-printing * { visibility: hidden; }
  body.ph-eg-printing #phEg, body.ph-eg-printing #phEg * { visibility: visible; }
  body.ph-eg-printing #phEg { position: absolute; left: 0; top: 0; width: 100%; background: #fff; }
  body.ph-eg-printing #phEg :is(.ir-steps, .ir-btn, .ir-chip, .ir-seg, .ir-draft, .eg-film) { display: none; }
  body.ph-eg-printing #phEg .eg-sc { break-inside: avoid; margin-bottom: 12px; }
}
/* ==== end of EGGS TEACHING PAGE ==== */

/* the patient's copy: no Draft tags, no Copy link, no door to the clinic's Iron page; the body pale with less blood flow */
#pharmacyPage :is(.ir-draft, [data-eg-link], [data-ir-open]) { display: none !important; }
#pharmacyPage .lens.body.pale svg { filter: saturate(.3) brightness(1.06); }
#pharmacyPage { --eg-above: 188px; }   /* no app head above the stage here, so its fields keep their height longer */

    const cell = (x, y, r, lo) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${lo ? "#EBA3B5" : "#C2304F"}" stroke="${lo ? "#D98AA0" : "#A3233F"}" stroke-width=".7"/><circle cx="${x}" cy="${y}" r="${(r * (lo ? .6 : .4)).toFixed(1)}" fill="${lo ? "#F8E1E7" : "#E07A90"}"/>`;
    const hi = Array.from({ length: 9 }, (_, k) => [172 + k * 22, k % 2 ? 105 : 98]), lo = [[178, 101], [226, 103], [274, 99], [322, 102]];
    const tok = (x, w, t, cls) => `<g class="tok${cls ? " " + cls : ""}"><rect x="${x - w / 2}" y="10" width="${w}" height="20" rx="10"/><text x="${x}" y="24">${t}</text></g>`;
    const drop = (x, i) => `<circle class="drp" cx="${x}" cy="92" r="3.2" style="--i:${i}"/>`;
    return `<svg class="an" viewBox="0 0 360 164" aria-hidden="true" focusable="false"><defs><clipPath id="phEgVc"><path d="M148,84 C190,80 250,88 362,84 L362,118 C250,122 190,114 148,118 Z"/></clipPath></defs>
      ${tok(36, 48, "Iron")}${tok(92, 48, "B12")}${tok(152, 60, "Folate")}${tok(228, 76, "Herbs", "hb")}
      <path class="dash" d="M36,32 L58,74 M92,32 L84,74 M152,32 L112,74 M228,32 C200,50 150,58 128,76"/>
      <rect x="10" y="60" width="152" height="80" rx="34" class="bn"/><rect x="26" y="74" width="122" height="52" rx="24" class="mw"/>${phEgDots(87, 100, 22, 16, 9, 8).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" class="sg"/>`).join("")}
      ${[58, 84, 112, 128].map(drop).join("")}<text x="87" y="158" class="lb mid">Bone marrow</text>
      <path d="M148,84 C190,80 250,88 362,84 L362,118 C250,122 190,114 148,118 Z" class="vw"/><path d="M148,84 C190,80 250,88 362,84 M148,118 C250,122 190,114 362,118" class="vwl"/>
      <g clip-path="url(#phEgVc)"><g class="cl hi">${hi.map(([x, y]) => cell(x, y, 7.5) + phIrOzO2(x, y - 7.5) + phIrOzO2(x + 7.5, y)).join("")}</g><g class="cl lo-only">${lo.map(([x, y]) => cell(x, y, 5.5, true) + phIrOzO2(x, y - 5.5)).join("")}</g></g></svg>`;
  }

  // 6 · three months: a 90-day bar from today; a follicle grows along it to the egg released at the end; the care spans it
  function phEgMonthsSvg() {
    const fo = [[30, 4, 0], [128, 8, 1], [232, 14, 2], [314, 24, 2.8]].map(([x, r, d]) => { const cy = 92 - r;
      return `<g class="fo" style="--d:${d}s"><circle cx="${x}" cy="${cy}" r="${r}" class="gr"/>${r >= 8 ? `<circle cx="${x}" cy="${cy}" r="${(r * .66).toFixed(1)}" class="fl"/>` : ""}<circle cx="${(x - r * .32).toFixed(1)}" cy="${(cy + r * .3).toFixed(1)}" r="${Math.max(1.6, r * .26).toFixed(1)}" class="zp"/></g>`; }).join("");
    return `<svg class="an" viewBox="0 0 360 168" aria-hidden="true" focusable="false">
      ${fo}<g class="ov"><g transform="translate(340 46)"><path class="spk" d="${PH_IR_SPK}" style="--i:0"/></g><text x="314" y="30" class="lb mid">Ovulation</text></g>
      <rect x="24" y="100" width="312" height="8" rx="4" class="trk"/><rect x="24" y="100" width="312" height="8" rx="4" class="pg"/><circle cx="336" cy="104" r="6" class="mk"/>
      ${[[24, "Today", "st"], [128, "1 month", "mid"], [232, "2 months", "mid"], [336, "3 months", "en"]].map(([x, t, a]) => `<text x="${x}" y="126" class="lb sm ${a}">${t}</text>`).join("")}
      <path class="br" d="M24,138 V144 H336 V138"/><text x="180" y="162" class="lb sm mid bl">Herbs · acupuncture · food · iron</text></svg>`;
  }

  function phEgSceneHtml(n) {
    const [, , h, L] = PH_EG_SC[n - 1], st = phEg.st[n], seg = PH_EG_SEG[n], nx = PH_EG_SC[n];
    if (n === 1) return `<section class="ir-box eg-sc eg-sc1" data-sc="1"><div class="ir-bh"><h3>${esc(h)}</h3><span class="ir-draft" title="These words wait for your read">Draft</span></div>${phEgPlateHtml()}
        <ol class="eg-lines">${L.map((l, i) => `<li><span class="num">${i + 1}</span><span>${esc(l)}</span></li>`).join("")}</ol>
        <div class="ir-foot"><button type="button" class="ir-btn" data-eg-sc="${nx[0]}">${esc(nx[1])} ›</button></div></section>`;
    const fig = n === 2 ? phEgWhySvg() : n === 3 || n === 5 ? phEgLensHtml(n) : n === 4 ? phEgMarrowSvg() : phEgMonthsSvg();
    return `<section class="ir-box eg-sc" data-sc="${n}"${st ? ` data-st="${st}"` : ""}><div class="eg-grid"><div class="eg-fig">${fig}</div>
      <div class="eg-tx"><div class="ir-bh"><h3>${esc(h)}</h3><span class="sp"></span><span class="ir-draft" title="These words wait for your read">Draft</span></div>
        ${seg ? `<span class="ir-seg" role="group" aria-label="${seg[2]}">${seg.slice(0, 2).map(([k, l]) => `<button type="button" class="${k === st ? "on" : ""}" data-eg-st="${k}" aria-pressed="${k === st}">${l}</button>`).join("")}</span>` : ""}
        <ol class="eg-lines">${L.map((l, i) => `<li><span class="num">${i + 1}</span><span>${esc(l)}</span></li>`).join("")}</ol>
        <div class="ir-foot">${n === 4 ? `<button type="button" class="ir-chip" data-ir-open="">Iron foods ›</button>` : ""}<button type="button" class="ir-btn" data-eg-sc="${nx ? nx[0] : 1}">${nx ? `${esc(nx[1])} ›` : "‹ Back to the start"}</button></div></div></div></section>`;
  }
  // the film, above the scenes (her 2026-11-04 "Ninety Days"; her picks: both shapes, loaded only on play): its own files beside the page,
  // the shape that fits the screen; sw.js never stores the .mp4 (39 MB a file, and every app on this origin shares one quota). While it
  // is open phEg.film keeps its place, so a redraw (a sync landing, another Guide tab) leaves it paused where it was, not back at the start
  function phEgFilmHtml(note) {
    if (phEg.film) return `<div class="eg-fp"><video controls playsinline preload="auto" src="ninety-days-wide.mp4"></video><button type="button" class="ir-chip" data-eg-film-x="1">Close</button></div>`;
    return `<div class="eg-fr"><img src="ninety-days-poster.jpg" alt="" width="52" height="52" loading="lazy"><span class="t"><b>Ninety Days</b><span>${note || "The film · 1:53"}</span></span><button type="button" class="ir-btn go" data-eg-film="1">▸ Play film</button></div>`;
  }
  function phEgFilmDraw(note, play) {
    const H = document.getElementById("phEgFilm"); if (!H) return;
    const was = H.querySelector("video"); if (was) { was.pause(); was.removeAttribute("src"); was.load(); }   // closed: the download stops too
    H.innerHTML = phEgFilmHtml(note);
    const v = H.querySelector("video"); if (!v) return;
    v.addEventListener("timeupdate", () => { if (phEg.film) phEg.film.t = v.currentTime; });
    v.addEventListener("error", () => { phEg.film = null; phEgFilmDraw("The film needs the internet"); });
    if (phEg.film.t) v.addEventListener("loadedmetadata", () => { if (phEg.film) v.currentTime = phEg.film.t; }, { once: true });
    if (play) { v.addEventListener("loadedmetadata", () => H.scrollIntoView({ block: "nearest" }), { once: true }); const p = v.play(); if (p) p.catch(() => {}); }
  }
  function phEgHtml() {
    return `<div class="ph-ir ph-eg" id="phEg">
      <div class="ir-top"><span class="ir-h">Eggs</span><span class="ir-sub">energy, oxygen and blood for egg quality</span><span class="sp"></span>
        <span class="ir-seg ir-steps" role="tablist" aria-label="Scenes">${PH_EG_SC.map(([n, l]) => `<button type="button" role="tab" class="${phEg.sc === n ? "on" : ""}" aria-selected="${phEg.sc === n}" data-eg-sc="${n}"><span class="n">${n}</span>${l}</button>`).join("")}</span>
        <button type="button" class="ir-btn" data-eg-play="1">▸ Play again</button><button type="button" class="ir-chip" data-eg-print="1" title="All six scenes on paper, or saved as a PDF to send her">Print</button><button type="button" class="ir-chip" data-eg-link="1" title="A link to this page, for her phone">Copy link</button></div>
      <div class="eg-film" id="phEgFilm">${phEgFilmHtml()}</div>
      <div id="phEgPane">${phEgSceneHtml(phEg.sc)}</div>
      <div class="ir-src">${PH_EG_SRC}</div></div>`;
  }
  // the lenses' body: her colour with more blood flow, pale with less (the Iron page's still body)
  function phEgPaint() { document.querySelectorAll("#phEg .lens.body").forEach(h => { const S = h.closest(".eg-sc").dataset.st === "lo" ? PH_IR_LOW : PH_IR_OK; phIrBodyEase(h, S, S, 0); }); phEgCellsMount(); }
  // a scene's state (Less | More blood flow, Low Blood | Blood built); flow = its cells and oxygen move in again (a real change)
  function phEgSt(n, st, flow) {
    const S = document.querySelector(`#phEgPane .eg-sc[data-sc="${n}"]`); if (!S) return;
    const was = S.dataset.st === "lo" ? PH_IR_LOW : PH_IR_OK, go = flow && phIrMotion(); S.dataset.st = phEg.st[n] = st;
    S.querySelectorAll("[data-eg-st]").forEach(b => { const on = b.dataset.egSt === st; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    const fg = S.querySelector(".lens.body"); if (fg) phIrBodyEase(fg, was, st === "hi" ? PH_IR_OK : PH_IR_LOW, go ? 1100 : 0);
    if (go) S.querySelectorAll("svg.an").forEach(s => { s.classList.remove("go"); void s.getBoundingClientRect(); s.classList.add("go"); });
  }
  // a scene's play: "pl" sets its parts at their start, each beat adds b1, b2… and lights its line; then it rests (its plain look,
  // which is also the reduced-motion and the printed look)
  function phEgRun(n) {
    const S = document.querySelector("#phEgPane .eg-sc"); if (!S) return 0;
    if (n === 1) { S.classList.add("pl"); if (phEgCS) phEgCS.play(); return 19000; }   // its stage has its own clock, and lights its own lines
    const lines = [...S.querySelectorAll(".eg-lines li")], lit = k => lines.forEach((l, j) => { l.classList.toggle("cur", j === k); l.classList.toggle("todo", j > k); });
    const beat = (ms, k, f) => phEgT(ms, () => { if (!S.isConnected) return; S.classList.add("b" + k); if (k <= lines.length) lit(k - 1); if (f) f(); });
    S.classList.add("pl"); lit(-1); void S.offsetWidth;
    let end = 5200;
    if (n === 2) { beat(80, 1); beat(1900, 2); beat(3900, 3); end = 6600; }
    if (n === 3 || n === 4 || n === 5) { phEgSt(n, "lo", false); beat(80, 1); beat(1400, 2, () => phEgSt(n, "hi", true)); beat(3400, 3); if (n === 5) { beat(4800, 4); end = 6400; } }
    if (n === 6) { beat(80, 1); beat(3000, 2); end = 5000; }
    phEgT(end, () => { if (!S.isConnected) return; S.classList.remove("pl", "b1", "b2", "b3", "b4"); lines.forEach(l => l.classList.remove("cur", "todo")); });
    return end;
  }
  function phEgShow(n, play) {
    phEg.sc = n;
    document.querySelectorAll("#phEg .ir-steps > button").forEach(b => { const on = +b.dataset.egSc === n; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    const pane = document.getElementById("phEgPane"); if (!pane) return 0;
    pane.innerHTML = phEgSceneHtml(n); phEgPaint();
    return play && phIrMotion() ? phEgRun(n) : 0;
  }
  // first sight (or Play again): the six scenes in order, each played, a pause between; it rests on the last
  function phEgAuto(n) {
    const dur = phEgShow(n, true), r = document.getElementById("phEg"); if (r) r.classList.add("auto");
    const next = () => { if (!document.getElementById("phEgPane")) return; if (n < PH_EG_SC.length) phEgAuto(n + 1); else phEgStop(); };
    if (n === 1 && dur && phEgCS) phEgCS.onEnd = () => phEgT(1600, next);   // its clock holds while the stage is out of view, so the wait is the stage's
    else phEgT(dur + (n < PH_EG_SC.length ? 1600 : 0), next);
  }
  // after a draw (the page can be built twice in a moment: the first sight still plays)
  function phEgMount() {
    if (!document.getElementById("phEgPane")) return;
    phEgPaint(); if (phEg.film) phEgFilmDraw();
    if ((!phEg.seen || Date.now() - phEg.seen < 600) && phIrMotion()) { if (!phEg.seen) phEg.seen = Date.now(); phEgStop(); phEgAuto(phEg.sc = 1); }
  }
  // Print (her pick 8, both): the six scenes at rest, one under another, on paper or as a PDF to send her; then back as it was
  function phEgPrint() {
    phEgStop(); const pane = document.getElementById("phEgPane"); if (!pane) return;
    pane.innerHTML = PH_EG_SC.map(([n]) => phEgSceneHtml(n)).join(""); phEgPaint();
    document.body.classList.add("ph-eg-printing");
    const back = () => { window.removeEventListener("afterprint", back); document.body.classList.remove("ph-eg-printing"); phEgShow(phEg.sc, false); };
    window.addEventListener("afterprint", back); setTimeout(() => window.print(), 60);
  }
  // a door: the Eggs tab from its first scene, played
  function phEgOpen() {
    phEgStop(); if (typeof phIrStop === "function") phIrStop();
    Object.assign(phEg, { sc: 1, seen: 0, film: null }); phGdTab = "eggs"; phGdSearch = ""; PHARMACY.activeTab = "guide";
    savePharmacy(); renderPharmacy();
  }
  function phEgClick(e) {
    const T = e.target; let el;
    if (!T.closest) return false;
    if (T.closest("[data-eg-open]")) { phEgOpen(); return true; }
    if (!T.closest(".ph-eg")) return false;
    if (T.closest("[data-eg-film]")) { phEgStop(); phEg.film = { t: 0 }; phEgFilmDraw("", true); return true; }
    if (T.closest("[data-eg-film-x]")) { phEg.film = null; phEgFilmDraw(); return true; }
    if ((el = T.closest("[data-eg-sc]"))) { phEgStop(); phEgShow(+el.dataset.egSc, true); const top = document.getElementById("phEg"); if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: "start" }); return true; }
    if (T.closest("[data-eg-play]")) { phEgStop(); if (phIrMotion()) phEgAuto(1); else phEgShow(1, false); return true; }
    if ((el = T.closest("[data-eg-cell]"))) { phEgStop(); if (phIrMotion() && phEgCS) phEgCS.playOne(+el.dataset.egCell); return true; }
    if ((el = T.closest("[data-eg-st]"))) { phEgStop(); const S = el.closest(".eg-sc"); if (S) phEgSt(+S.dataset.sc, el.dataset.egSt, true); return true; }
    if (T.closest("[data-eg-print]")) { phEgPrint(); return true; }
    if ((el = T.closest("[data-eg-link]"))) { phCkCopy(PH_EG_URL, "Link copied", el); return true; }
    return false;
  }
  // ---- end of EGGS ----

document.addEventListener("click", phEgClick);
document.getElementById("phGdHost").innerHTML = phEgHtml();
phEgMount();
</script>
</body>
