name: Deploy to GitHub Pages

# Actions-based Pages pipeline, same pattern as book33-app: builds an
# artifact from just the files the app actually serves and deploys it to
# Pages directly. ABOUT-ME.md, CLAUDE.md, .github/ and the *.json data
# backups live in the repo for reference but are excluded from what's
# actually published.
#
# 2026-08-16: index.html had been advertising itself as installable (it
# links a manifest and registers a service worker) since the PWA work went
# in, but this step only ever copied index.html -- so manifest.json, sw.js
# and icons/ 404'd and the app could not actually be installed. Anything
# index.html references MUST be staged here too.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage only what the app actually serves
        run: |
          mkdir _site
          cp index.html _site/
          # patient self-fill intake form (2026-09-05) -- standalone page,
          # linked from index.html's generated link but never itself
          # referenced BY index.html, so it's easy to forget here; the same
          # class of miss as the manifest/sw.js/icons note above.
          cp intake.html _site/
          # 2026-09-15: the patient's own "My Cycle" chart app (Stage 2) --
          # same class as intake.html: linked from a generated link, never
          # referenced by index.html, so it has to be named here or it 404s.
          cp chart.html chart.webmanifest _site/
          cp manifest.json _site/
          cp sw.js _site/
          cp -r icons _site/
          # 2026-09-03: manifest.json now lists screenshots/ for the desktop
          # install dialog -- same rule as icons/: referenced, so staged.
          cp -r screenshots _site/
          echo "staged:" && ls -R _site
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strip comments from what ships to browsers
        # index.html is hand-edited WITH comments in the repo -- this only
        # touches the staged copy in _site/, right before it goes out to
        # her phone. Comments are ~19% of the file's lines but ~28% of its
        # gzip weight (prose compresses far worse than code), so this is
        # the real lever for the BlackBerry Key2's ~920KB gzip ceiling.
        # Verified 2026-09-15 against a real Actions build (not just
        # locally): identical rendered UI, identical interactive elements,
        # identical (pre-existing, unrelated) console errors, before vs
        # after -- see .github/scripts/strip-comments.mjs for how it stays
        # safe (real JS parser, comments-only, no compress/mangle).
        run: |
          echo "before: $(wc -c < _site/index.html) bytes"
          npm install --no-save terser@5.51.2
          node .github/scripts/strip-comments.mjs _site/index.html
          echo "after:  $(wc -c < _site/index.html) bytes"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
