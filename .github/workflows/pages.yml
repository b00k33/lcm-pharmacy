name: Deploy to GitHub Pages

# Actions-based Pages pipeline, same pattern as book33-app: builds an
# artifact from just the file the app actually serves and deploys it to
# Pages directly. ABOUT-ME.md, CLAUDE.md, and .github/ live in the repo for
# reference but are excluded from what's actually published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage only what the app actually serves
        run: |
          mkdir _site
          cp index.html _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
