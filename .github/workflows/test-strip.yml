name: Test comment-stripping (no deploy)

# TEMPORARY -- manual-only verification harness for strip-comments.mjs.
# Stages the site exactly like pages.yml, runs the stripper, and uploads
# the result as a plain build artifact for inspection. Never touches
# GitHub Pages. Delete this file once strip-comments.mjs is folded into
# pages.yml for real.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage only what the app actually serves
        run: |
          mkdir _site
          cp index.html _site/
          cp intake.html _site/
          cp chart.html chart.webmanifest _site/
          cp manifest.json _site/
          cp sw.js _site/
          cp -r icons _site/
          cp -r screenshots _site/
      - name: Sizes before
        run: |
          echo "raw bytes: $(wc -c < _site/index.html)"
          gzip -9 -c _site/index.html | wc -c | xargs echo "gzip bytes:"
          cp _site/index.html /tmp/index.before.html
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install terser
        run: npm install --no-save terser@5.51.2
      - name: Strip comments
        run: node .github/scripts/strip-comments.mjs _site/index.html
      - name: Sizes after
        run: |
          echo "raw bytes: $(wc -c < _site/index.html)"
          gzip -9 -c _site/index.html | wc -c | xargs echo "gzip bytes:"
      - name: Upload artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: stripped-site
          path: _site
          retention-days: 3
