    if (r.id === "sounds") extras = spotBar("gas");
    if (r.id === "temp") extras = ["cold", "cool", "warm"].map(atPills).join("") + tempTable();
    if (r.id === "feel") extras = ["tender", "tighthypo", "pulsation", "tightrect", "thinwall"].map(atPills).join("");
    const sgs = S.opt === "b" ? `<div class="abm-sgs">${PAIRS.filter(p => p[0] === r.id).map(p => sgChip(p, fresh)).join("")}</div>` : "";
    return `<div class="ph-tng2-row"><i>${r.lab}${r.sub ? `<small>${r.sub}</small>` : ""}</i><div class="ph-ltr-quals ph-visit-quals ph-abd2-tsf">${bar}${extras ? `<div class="ph-tng2-extras">${extras}</div>` : ""}</div>${sgs}</div>`;
  }
  function summary() {
    const parts = [], e = S.tempC.epi, l = S.tempC.lower;
    const tp = []; if (e != null) tp.push(`epi ${e.toFixed(1)} °C`); if (l != null) tp.push(`lower ${l.toFixed(1)} °C`);
    if (e != null && l != null && e !== l) tp.push(`lower ${Math.abs(e - l).toFixed(1)} °C ${e > l ? "cooler" : "warmer"}`);
    if (tp.length) parts.push(tp.join(", "));
    ROWS.forEach(r => (r.chips || []).forEach(([m, lb]) => { if (!on(m)) return; const zs = S.marks[m]; parts.push(lb + (zs.length ? " " + zs.map(z => m === "tender" && z === "epi" ? "epigastrium (心下, Xia Xin)" : ZL[z]).join(", ") : "")); }));
    if (S.tension) parts.push("tension " + S.tension);
    return parts.join(" · ");
  }
  let lastN = null;
  function rowsHtml(fresh) {
    const n = nOn(), roll = lastN != null && lastN !== n; lastN = n;
    const leg = S.opt === "b" ? `<div class="abm-leg"><span><i class="d"></i>Today · Bing</span><span><i class="p"></i>Usual · Ren</span><em><b class="${roll ? "roll" : ""}">${n}</b> of ${KEYS.length}</em></div>` : "";
    const said = S.opt === "b" ? `<div class="ph-tng2-row"><i>Reported<small>not on the chart</small></i><div class="abm-sgs" style="margin-top:0">${PAIRS.filter(p => p[0] === "said").map(p => sgChip(p, fresh)).join("")}</div></div>` : "";
    const sum = summary();
    return leg + ROWS.map(r => rowHtml(r, fresh)).join("") + said
      + (sum ? `<div class="ph-tng2-sum"><b>Reads as</b> ${esc(sum)}</div>` : "")
      + `<div class="ph-tng2-acts"><button type="button" class="ph-abd2-wherebtn cancel" data-mk="clear">Clear</button></div>`;
  }

  // ---- A: the Tongue page's panel, for the abdomen ----
  let flashA = new Set(), lastNA = null;
  function panelA() {
    const n = nOn(), roll = lastNA != null && lastNA !== n; lastNA = n;
    const reach = KEYS.filter(k => SIGS[k].t() || k in S.said), rest = KEYS.filter(k => !reach.includes(k));
    const row = k => {
      const s = SG[k], kind = s.kind, v = eff(k), said = S.said[k], auto = said === undefined && v;
      const pills = s.fs.map(f => `<span class="ph-tfp-fp"><i style="background:${f.c}"></i>${esc(f.n)} <em>+${f.p}</em></span>`).join("") + (s.nfs > 4 ? `<span class="ph-tfp-fp">+${s.nfs - 4} more</span>` : "");
      return `<div class="ph-tfp-sg${said === false ? " no" : ""}${flashA.has(k) ? " lit flash" : ""}" data-tfp-sg="${k}">
        <span class="tg ${kind === "d" ? "b" : "r"}">${kind === "d" ? "Bing" : "Ren"}</span>
        <button type="button" class="tx" data-light="${k}"><span class="lb">${esc(s.label)}</span>${pills ? `<span class="ph-tfp-fs">${pills}</span>` : ""}</button>
        <span class="ph-tfp-yn"><button type="button" class="${said === true ? "on" : auto ? "on auto" : ""}" data-yn="${k}:y" aria-pressed="${v}"${auto ? ' title="From the chart"' : ""}>Yes</button><button type="button" class="${said === false ? "on" : ""}" data-yn="${k}:n" aria-pressed="${said === false}">No</button></span>
      </div>`;
    };
    const col = (list, kind, lbl) => `<div><div class="ph-tfp-colh">${lbl}</div>${list.filter(k => SG[k].kind === kind).map(row).join("") || `<div class="ph-tfp-none">Nothing yet</div>`}</div>`;
    const ticked = []; ROWS.forEach(r => (r.chips || []).forEach(([m, l]) => { if (on(m) && !linked(m)) ticked.push(l); })); if (S.tension && !linked("tension:" + S.tension)) ticked.push("tension " + S.tension);
    const html = `<div class="ph-tfp" data-tfp-host="1">
      <div class="ph-tfp-hd"><span>Fang Bing Ren from this abdomen</span><em><b class="${roll ? "roll" : ""}">${n}</b> of ${KEYS.length} signs</em></div>
      <div class="ph-tfp-cols">${col(reach, "d", "Bing · today")}${col(reach, "p", "Ren · constitution")}</div>
      ${ticked.length ? `<div class="ph-tfp-not">Not in Fang Bing Ren: ${esc(ticked.join(", "))}</div>` : ""}
      ${rest.length ? `<button type="button" class="ph-tng2-morebtn" data-more="1" aria-expanded="${S.more}">${S.more ? "▾" : "▸"} Other abdomen signs · ${rest.length}</button>
        ${S.more ? `<div class="ph-tfp-cols">${col(rest, "d", "Bing")}${col(rest, "p", "Ren")}</div>` : ""}` : ""}
    </div>`;
    flashA = new Set();
    return html;
  }

  // ---- C: a place and its signs ----
  let lastPlace = null;
  function placeHtml(fresh) {
    if (S.opt !== "c") return "";
    const z = S.place, cnt = zz => KEYS.filter(k => eff(k) && SIGS[k].pl.includes(zz)).length;
    const whole = `<div class="abm-places"><div class="ph-tng2-seg"><button type="button" class="ph-ltr-qual${z === "whole" ? " on" : ""}" data-place="whole">Whole abdomen · ${cnt("whole")}</button></div></div>`;
    if (!z) return whole;
    const marks = []; ROWS.forEach(r => (r.chips || []).forEach(([m, l]) => { if (on(m) && (z === "whole" ? !S.marks[m].length || S.marks[m].includes("whole") : S.marks[m].includes(z) || (z === "epi" && m === "xiaxin"))) marks.push(l); }));
    if (z === "whole" && S.tension) marks.push("tension " + S.tension);
    const ps = PAIRS.filter(p => [p[2], p[3]].filter(Boolean).some(k => SIGS[k].pl.includes(z)));
    const fresh2 = lastPlace !== z; lastPlace = z;
    return whole + `<div class="abm-place${fresh2 && !RM() ? " in" : ""}"><div class="abm-place-hd"><b>${esc(ZL[z].replace(/^./, c => c.toUpperCase()))}</b><em>${cnt(z)} ticked</em></div>
      <div class="abm-place-f">${marks.length ? esc(marks.join(" · ")) : "Nothing marked here"}</div>
      ${ps.length ? `<div class="abm-sgs">${ps.map(p => sgChip(p, fresh)).join("")}</div>` : `<div class="abm-none">No Fang Bing Ren sign here</div>`}</div>`;
  }

  // ---- the charts ----
  let FRONT = null, SIDE = null;
  function mountCharts() {
    const f = $("#tFront").content.firstElementChild.cloneNode(true), s = $("#tSide").content.firstElementChild.cloneNode(true);
    // take off the captured marks: they are drawn from the state below
    $$('g[clip-path] > path[pointer-events="none"]', f).forEach(p => { if (/^rgba/.test(p.getAttribute("fill") || "")) p.remove(); });
    $$(":scope > g.ph-abd2-m-swell, :scope > g[transform]", f).forEach(g => g.remove());
    const ns = "http://www.w3.org/2000/svg", mg = document.createElementNS(ns, "g"); mg.setAttribute("id", "mkM"); mg.setAttribute("pointer-events", "none"); f.appendChild(mg);
    $$('g[clip-path] > rect', s).forEach(r => { if (/^rgba/.test(r.getAttribute("fill") || "")) r.remove(); });
    const bands = ["epi", "umb", "lower"];
    $$('g[clip-path] > rect[fill="#FFFFFF"]', s).forEach((r, i) => { const b = r.cloneNode(); b.setAttribute("fill", "none"); b.setAttribute("data-band", bands[i]); r.after(b); });
    $("#mkFront").replaceChildren(f); $("#mkSide").replaceChildren(s);
    FRONT = f; SIDE = s;
  }
  function paintFront(freshBdg) {
    if (!FRONT) return;
    const tz = {}; ["cold", "cool", "warm"].forEach(m => (S.marks[m] || []).forEach(z => { tz[z] = m; }));
    $$(".ph-abd2-zone", FRONT).forEach(p => { const z = p.dataset.visitZone.split(":")[1]; p.setAttribute("fill", tz[z] ? TC[tz[z]].fill : "#FFFFFF"); p.classList.toggle("abm-sel", S.opt === "c" && S.place === z); });
    let h = "";
    const X = ([x, y]) => `<g transform="translate(${x},${y})"><circle r="4.6" class="ph-abd2-m-halo" fill="rgba(178,58,58,.2)"/><path d="M-2.6,-2.6 l5.2,5.2 M2.6,-2.6 l-5.2,5.2" class="ph-abd2-x" stroke-linecap="round"/></g>`;
    const ring = ([x, y]) => `<g transform="translate(${x},${y})"><circle r="2.4" class="ph-abd2-m-ring" fill="none" stroke="#7A2F45" stroke-width=".6"/><circle r="2.4" class="ph-abd2-m-ring r2" fill="none" stroke="#7A2F45" stroke-width=".6"/><circle r="1.7" class="ph-abd2-m-beat" fill="#7A2F45"/></g>`;
    (S.marks.distended || []).forEach(r => { const [x, y, rx, ry] = ROWC[r]; h += `<g class="ph-abd2-m-swell" style="transform-origin:${x}px ${y}px"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="rgba(168,60,80,.07)" stroke="#A83C50" stroke-width=".8" stroke-dasharray="2 1.4"/><ellipse cx="${x}" cy="${y}" rx="${rx * .55}" ry="${ry * .55}" fill="none" stroke="#A83C50" stroke-width=".7" stroke-dasharray="2 1.4" stroke-opacity=".8"/></g>`; });
    (S.marks.bulging || []).forEach(r => { const [x, y, rx, ry] = ROWC[r]; h += `<ellipse cx="${x}" cy="${y}" rx="${rx * .7}" ry="${ry * .7}" fill="rgba(168,60,80,.12)" stroke="#A83C50" stroke-width=".8"/>`; });
    (S.marks.sunken || []).forEach(r => { const [x, y, rx, ry] = ROWC[r]; h += `<ellipse cx="${x}" cy="${y}" rx="${rx * .8}" ry="${ry * .8}" fill="rgba(138,146,147,.1)" stroke="#8A9293" stroke-width=".7" stroke-dasharray="1.2 1.2"/>`; });
    (S.marks.vispulse || []).forEach(r => { const [x, y] = ROWC[r]; h += ring([x, y + (r === "umb" ? 4 : 0)]); });
    (S.marks.tender || []).forEach(z => { if (ZP[z]) h += X(ZP[z]); });
    // tight hypochondrium: a firm band along the rib edge on that side
    (S.marks.tighthypo || []).forEach(z => { const L = z === "hypoR"; h += `<path d="${L ? "M31,47 Q40,56 51,63" : "M89,47 Q80,56 69,63"}" fill="none" stroke="#A83C50" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".75"/><path d="${L ? "M33.5,53 Q41,60 49.5,65.5" : "M86.5,53 Q79,60 70.5,65.5"}" fill="none" stroke="#A83C50" stroke-width=".7" stroke-dasharray="1.6 1.2" stroke-linecap="round"/>`; });
    (S.marks.pulsation || []).forEach(z => { if (ZP[z]) h += ring(ZP[z]); });
    if (on("water")) h += `<path d="M51,96 q2.25,-1.6 4.5,0 t4.5,0 t4.5,0 t4.5,0 M53,99.5 q2.25,-1.6 4.5,0 t4.5,0 t4.5,0" fill="none" stroke="#8A9293" stroke-width=".7" stroke-linecap="round"/>`;
    (S.marks.gas || []).forEach(z => { const p = ZP[z]; if (p) h += `<g fill="none" stroke="#8A9293" stroke-width=".55"><circle cx="${p[0] - 3}" cy="${p[1] - 5}" r="1.3"/><circle cx="${p[0] + 1.5}" cy="${p[1] - 7}" r="1.8"/><circle cx="${p[0] + 3.6}" cy="${p[1] - 3.6}" r="1"/></g>`; });
    if (on("tightrect")) { const zs = S.marks.tightrect, lo = zs.some(z => LO.includes(z)), y1 = zs.length && lo && !zs.some(z => ["epi", "umb", "whole"].includes(z)) ? 100 : 30; h += `<path d="M53.5,${y1} L53.5,133 M66.5,${y1} L66.5,133" stroke="#A83C50" stroke-width="1.1" stroke-dasharray="2.4 1.6" stroke-linecap="round"/>`; }
    if (on("thinwall")) { const zs = S.marks.thinwall; (zs.length ? zs : ["whole"]).forEach(z => { const c = ZP[z] || [60, 85]; const r = z === "whole" || !ZP[z] ? [26, 44] : [9, 7]; h += `<ellipse cx="${c[0]}" cy="${c[1]}" rx="${r[0]}" ry="${r[1]}" fill="none" stroke="#8A9293" stroke-width=".6" stroke-dasharray=".6 1.4" stroke-linecap="round"/>`; }); }
    if (S.opt === "c") Object.keys(ZB).forEach(z => { const n = KEYS.filter(k => eff(k) && SIGS[k].pl.includes(z)).length; if (n) h += `<g class="abm-bdg${freshBdg && freshBdg.has(z) && !RM() ? " in" : ""}"><circle cx="${ZB[z][0]}" cy="${ZB[z][1]}" r="3.4"/><text x="${ZB[z][0]}" y="${ZB[z][1] + 1.55}" text-anchor="middle">${n}</text></g>`; });
    $("#mkM", FRONT).innerHTML = h;
  }
  function paintSide() {
    if (!SIDE) return;
    const rowOf = { epi: "epi", hypoR: "epi", hypoL: "epi", umb: "umb", flankR: "umb", flankL: "umb", lower: "lower", iliacR: "lower", iliacL: "lower" };
    const bz = {}; ["cold", "cool", "warm"].forEach(m => (S.marks[m] || []).forEach(z => { bz[rowOf[z]] = m; }));
    $$("rect[data-band]", SIDE).forEach(r => r.setAttribute("fill", bz[r.dataset.band] ? TC[bz[r.dataset.band]].fill : "none"));
    const strokes = $$('path[stroke^="rgb("]', SIDE), dots = $$('circle[fill^="rgb("]', SIDE), nums = $$(".ph-abd2-tnum", SIDE);
    ["epi", "lower"].forEach((sp, i) => { const c = therm(S.tempC[sp]); [strokes[i], dots[i], nums[i]].forEach(el => { if (el) el.style.display = c ? "" : "none"; }); if (!c) return; strokes[i].setAttribute("stroke", c); dots[i].setAttribute("fill", c); nums[i].textContent = S.tempC[sp].toFixed(1) + "°"; });
    const pv = on("pulsation"); $$(".ph-abd2-m-aflow", SIDE).forEach(e => { e.style.display = pv ? "" : "none"; }); $$(".ph-abd2-m-ring", SIDE).forEach(e => { e.parentNode.style.display = pv ? "" : "none"; });
  }

  // ---- paint ----
  const CAP = {
    a: `<p><b>A · Like the Tongue page (your pick), after the chip audit.</b> The signs the chart ticks sit in one panel under it. Tap a sign: its chips light up. Tap a chip: the signs it ticks flash.</p>`,
    b: `<p><b>B · In the rows.</b> Each row shows the signs it ticks, right under its chips: ◆ today (Bing), ● usual (Ren), one chip per sign. The separate strip goes; pain and ascites sit in a Reported row.</p>`,
    c: `<p><b>C · Tap a place.</b> Numbers on the chart = signs ticked there. Tap a place (or Whole abdomen): its signs open under the chart. The separate strip goes.</p>`
  };
  const CAP2 = `<p class="n2">All three: Temp = <i style="background:${TC.cold.dot}"></i>cold <i style="background:${TC.cool.dot}"></i>cool <i style="background:${TC.warm.dot}"></i>warm, and the side view's °C runs blue to red. New chips carry a <i style="background:#C9A227;width:6px;height:6px;margin-left:2px"></i> gold dot (flat, cool, tight hypochondrium). Xia Xin tender = tender at epi (one chip). Tap anything; nothing is saved.</p>`;
  function card() {
    return `<div class="ph-pfw-card ph-abd">
      <div class="ph-pfw-hd"><h3>Abdomen</h3><button type="button" class="ph-pfw-opt">Nothing unusual</button></div>
      <div class="ph-tng2 abd">
        <div class="ph-tng2-left">
          <div class="ph-tng2-pair ph-abd2-charts">
            <figure class="ph-abd2-fig"><div class="ph-visit-abd-map" id="mkFront"></div><figcaption>Front</figcaption></figure>
            <figure class="ph-abd2-fig"><div class="ph-visit-abd-side" id="mkSide"></div><figcaption>Side · from the right</figcaption></figure>
          </div>
          <div id="mkPlace" style="width:100%"></div>
        </div>
        <div class="ph-tng2-rows" id="mkRows"></div>
      </div>
      <div id="mkPanel"></div>
      <div class="ph-pfw-lab">Your own words (optional)</div>
      <input type="text" class="ph-cc-said" maxlength="200" value="" placeholder="Note" aria-label="Abdomen note">
    </div>`;
  }
  function build() {
    $("#mkCap").innerHTML = CAP[S.opt] + CAP2;
    $("#mkHost").innerHTML = card(); mountCharts(); lastN = null; lastNA = null; lastPlace = null; paint();
  }
  function paint(fresh, freshBdg) {
    $("#mkRows").innerHTML = rowsHtml(fresh);
    $("#mkPanel").innerHTML = S.opt === "a" ? panelA() : "";
    $("#mkPlace").innerHTML = placeHtml(fresh);
    paintFront(freshBdg); paintSide();
  }
  // which sign chips / place numbers just changed, so only those pop
  function changed(fn) {
    const before = {}; KEYS.forEach(k => { before[k] = eff(k); });
    const zb = {}; Object.keys(ZB).forEach(z => { zb[z] = KEYS.filter(k => eff(k) && SIGS[k].pl.includes(z)).length; });
    fn();
    const now = KEYS.filter(k => eff(k) !== before[k]);
    if (S.opt === "a") flashA = new Set(now.filter(eff));
    const fresh = new Set(RM() ? [] : PAIRS.filter(p => [p[2], p[3]].some(k => k && now.includes(k))).map(p => p[1]));
    const fb = new Set(Object.keys(ZB).filter(z => KEYS.filter(k => eff(k) && SIGS[k].pl.includes(z)).length > zb[z]));
    paint(fresh, fb);
  }

  // ---- taps ----
  document.addEventListener("click", e => {
    const T = e.target;
    const o = T.closest("#mkOpt button"); if (o) { S.opt = o.dataset.o; $$("#mkOpt button").forEach(b => b.classList.toggle("on", b === o)); S.pick = null; build(); return; }
    if (!T.closest("#mkHost")) return;
    const k = T.closest("[data-k]"); if (k) { changed(() => flip(k.dataset.k)); return; }
    const yn = T.closest("[data-yn]");
    if (yn) { const [key, v] = yn.dataset.yn.split(":"), want = v === "y"; changed(() => { if (S.said[key] === want) delete S.said[key]; else S.said[key] = want; }); return; }
    if (T.closest("[data-more]")) { S.more = !S.more; paint(); return; }
    const lt = T.closest("[data-light]");
    if (lt) {
      const key = lt.dataset.light, row = lt.closest(".ph-tfp-sg"), was = row.classList.contains("lit");
      $$(".ph-tfp-sg.lit").forEach(x => x.classList.remove("lit", "flash")); $$("#mkRows [data-chip]").forEach(c => c.classList.remove("tfp-glow", "tfp-dim")); clearTimeout(lt.t);
      if (was) return;
      row.classList.add("lit"); $$("#mkRows [data-chip]").forEach(c => { const hit = SIGS[key].c.includes(c.dataset.chip); c.classList.toggle("tfp-glow", hit); c.classList.toggle("tfp-dim", !hit); });
      setTimeout(() => { $$(".tfp-glow, .tfp-dim").forEach(c => c.classList.remove("tfp-glow", "tfp-dim")); row.classList.remove("lit"); }, 2200);
      return;
    }
    const pl = T.closest("[data-place]"); if (pl) { S.place = S.place === "whole" ? null : "whole"; paint(); return; }
    const zone = T.closest("[data-visit-zone]");
    if (zone) {
      const z = zone.dataset.visitZone.split(":")[1];
      if (S.pick && ONLY[S.pick] && !ONLY[S.pick].includes(z)) return;   // tight hypochondrium lands only under the ribs
      if (S.pick) { changed(() => { const a = S.marks[S.pick] || (S.marks[S.pick] = []); const i = a.indexOf(z); if (i >= 0) a.splice(i, 1); else { if (["cold", "cool", "warm"].includes(S.pick)) ["cold", "cool", "warm"].forEach(m => { if (m !== S.pick && S.marks[m]) S.marks[m] = S.marks[m].filter(x => x !== z); }); a.push(z); } }); return; }
      if (S.opt === "c") { S.place = S.place === z ? null : z; paint(); }
      return;
    }
    const mk = T.closest("[data-mk]"); if (!mk) return;
    const [act, a1, a2] = mk.dataset.mk.split(":");
    changed(() => {
      if (act === "mark") { if (on(a1)) { delete S.marks[a1]; if (S.pick === a1) S.pick = null; } else { S.marks[a1] = (START[a1] || []).slice(); S.pick = BRUSH.has(a1) ? a1 : null; } }
      else if (act === "tension") S.tension = S.tension === a1 ? null : a1;
      else if (act === "spot") { const arr = S.marks[a1], i = arr.indexOf(a2); if (i >= 0) arr.splice(i, 1); else arr.push(a2); }
      else if (act === "at") S.marks[a1] = S.marks[a1].filter(z => z !== a2);
      else if (act === "pick") S.pick = S.pick === a1 ? null : a1;
      else if (act === "tempc") { const v = S.tempC[a1] == null ? 34 : S.tempC[a1]; S.tempC[a1] = Math.min(40, Math.max(28, Math.round((v + (a2 === "+1" ? .1 : -.1)) * 10) / 10)); }
      else if (act === "clear") { S.marks = {}; S.tension = null; S.tempC = {}; S.pick = null; }
    });
  });
  document.addEventListener("change", e => {
    const i = e.target.closest && e.target.closest("[data-abd-temp]"); if (!i) return;
    const v = parseFloat(i.value), sp = i.dataset.abdTemp;
    changed(() => { if (isNaN(v)) delete S.tempC[sp]; else S.tempC[sp] = Math.min(40, Math.max(28, Math.round(v * 10) / 10)); });
  });
  build();
})();
</script>
</body>
</html>
