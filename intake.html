<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4D2A">
<title>Patient Intake — LCM - Linh Chinese Medicine</title>
<!-- Standalone, unauthenticated patient-facing form (her ask 2026-09-05: a
     link she can send that blocks the patient from seeing the rest of the
     app). Deliberately its own file, not part of index.html's single-page
     app -- it has zero navigation into the practitioner app by construction,
     and talks to Supabase directly with no login, through two narrow
     SECURITY DEFINER functions (see supabase/intake_forms_setup.sql). Colour
     tokens and the PH_HISTORY_GROUPS / PH_CYCLE_* data below are copied
     verbatim from index.html rather than shared, matching this project's
     existing single-file-per-app convention (see the print-view <style> in
     index.html for the same trimmed token set this reuses). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ph-green-deep: #0E4D2A; --ph-green: #1B7A46; --ph-green-tint: #EAF5EE;
    --ph-green-press: #0A3A20; --ph-line: #D3E2D8; --ph-soft: #4A5B50;
    --ph-ink: #14231A; --ph-paper: #F6FAF7; --ph-white: #FFFFFF;
    --ph-negative: #B4483A; --margin-rule: #E3C87A;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ph-paper); color: var(--ph-ink); font-family: var(--font-body); }
  body { padding-bottom: 100px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header.top { background: var(--ph-green-deep); color: #EAF5EE; padding: 22px 16px 20px; text-align: center; }
  header.top h1 { font-family: var(--font-serif); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: 0.01em; }
  header.top p { margin: 4px 0 0; font-size: 12px; color: #B8D2C2; }
  .card { background: var(--ph-white); border: 1px solid var(--ph-line); border-radius: 14px; padding: 16px; margin-top: 16px; }
  .lead { font-size: 14px; line-height: 1.5; margin: 0 0 4px; }
  .note { font-size: 12px; color: var(--ph-soft); line-height: 1.5; margin: 8px 0 0; }
  .center { text-align: center; padding: 40px 16px; }
  .center h2 { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--ph-green-deep); margin: 0 0 8px; }
  .center p { font-size: 14px; color: var(--ph-soft); line-height: 1.6; }
  .err { color: var(--ph-negative); font-size: 13px; margin-top: 8px; }
  .section-h { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ph-green-deep); margin: 22px 0 8px; padding: 0 2px; }
  .field { margin-bottom: 14px; }
  .field label.q, .field span.q { display: block; font-size: 13px; font-weight: 600; color: var(--ph-ink); margin-bottom: 6px; }
  .field .hint { font-size: 11.5px; color: var(--ph-soft); margin-top: 4px; }
  input[type="date"], input[type="number"], input[type="text"], textarea, select {
    width: 100%; font: inherit; font-size: 14px; color: var(--ph-ink); background: var(--ph-paper);
    border: 1px solid var(--ph-line); border-radius: 10px; padding: 11px 12px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ph-green); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 56px; font-family: inherit; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--ph-line); background: var(--ph-white); font: inherit; font-size: 14px; font-weight: 600; color: var(--ph-ink); cursor: pointer; }
  .seg button.on { background: var(--ph-green-deep); border-color: var(--ph-green-deep); color: #fff; }
  .hx-group { margin-bottom: 6px; }
  .hx-group-h { font-size: 12.5px; font-weight: 700; color: var(--ph-green-deep); margin: 14px 0 6px; }
  .hx-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--ph-line); }
  .hx-row:last-child { border-bottom: none; }
  /* her 2026-10-26 picks: a Yes opens a details box on its row; family history has Don't know; supplements are rows */
  .hx-row { flex-wrap: wrap; }
  .hx-note { flex: 1 0 100%; margin-top: 2px; min-height: 40px; padding: 8px 10px; font-size: 13px; }
  .hx-sub { font-size: 12px; font-weight: 400; color: var(--ph-soft); margin: -2px 0 6px; }
  .hx-btn.unsure.on { background: #EEF0EF; border-color: #8A958F; color: var(--ph-ink); }
  .supp-block { flex: 1 0 100%; margin-top: 4px; }
  .supp-block .q { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .supp-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 32px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .supp-row input { padding: 9px 10px; font-size: 13px; }
  .supp-row .rm { width: 32px; height: 32px; border: none; background: none; color: var(--ph-soft); font-size: 18px; line-height: 1; cursor: pointer; border-radius: 50%; }
  /* her 2026-10-27 pick 3: "+ Something else" at the end of General health and Family history; a row = the condition + its details */
  .ox-block { margin-top: 8px; }
  .ox-row { display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 6px; margin-bottom: 6px; align-items: start; }
  .ox-row .f { display: grid; gap: 6px; min-width: 0; }
  .ox-row input, .ox-row textarea { padding: 9px 10px; font-size: 13px; }
  .ox-row .rm { width: 32px; height: 32px; border: none; background: none; color: var(--ph-soft); font-size: 18px; line-height: 1; cursor: pointer; border-radius: 50%; }
  .ox-add { padding: 7px 13px; border-radius: 999px; border: 1px dashed var(--ph-green); background: var(--ph-white); font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ph-green-deep); cursor: pointer; }
  .again { background: #FBF3DC; border-color: #E3C87A; }
  .hx-label { font-size: 13.5px; flex: 1; min-width: 0; }
  .hx-toggle { display: flex; gap: 6px; flex: 0 0 auto; }
  .hx-btn, .fbr-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--ph-line); background: var(--ph-white); font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ph-soft); cursor: pointer; }
  .hx-btn.on, .fbr-btn.on { background: var(--ph-green-tint); border-color: var(--ph-green); color: var(--ph-green-deep); }
  .checkrow { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 0; }
  .checkrow input { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--ph-line); background: var(--ph-white); font: inherit; font-size: 12.5px; color: var(--ph-soft); cursor: pointer; }
  .chip.on { background: var(--ph-green-tint); border-color: var(--ph-green); color: var(--ph-green-deep); font-weight: 600; }
  .cq-inline { display: flex; align-items: center; gap: 8px; }
  .cq-inline input { width: 90px; flex: 0 0 auto; }
  .cq-inline select { flex: 1; }
  /* IVF history (her ask 2026-09-13, card 11: "Intake form too, marked until
     you confirm") -- kept to the three plain funnel fields (Eggs/Fertilised/
     Frozen) plus date and clinic; the bonus fields (Mature/Day3/Blasts/PGT)
     stay practitioner-only, typed at her next visit, not asked of the patient. */
  .ivf-card { background: var(--ph-paper); border: 1px solid var(--ph-line); border-radius: 12px; padding: 12px; margin-top: 10px; position: relative; }
  .ivf-card .rm { position: absolute; top: 8px; right: 8px; border: none; background: none; color: var(--ph-soft); font-size: 16px; line-height: 1; cursor: pointer; padding: 4px; }
  .ivf-row2 { display: flex; gap: 8px; margin-bottom: 8px; }
  .ivf-row2 label { flex: 1; min-width: 0; }
  .ivf-row2 label span.mini { display: block; font-size: 11px; color: var(--ph-soft); margin-bottom: 3px; }
  .ivf-row2 input { padding: 9px 10px; font-size: 13px; }
  #ivfAddRow { margin-top: 10px; }
  #cycleSec[hidden], #femaleHx[hidden] { display: none; }
  .submitbar { position: sticky; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--ph-paper) 70%, transparent); padding: 16px 0 0; margin-top: 4px; }
  .submitbtn { width: 100%; padding: 15px; border-radius: 999px; border: none; background: var(--ph-green-deep); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .submitbtn:disabled { opacity: 0.5; cursor: default; }
  .submitbtn:not(:disabled):active { background: var(--ph-green-press); }
  .dob-row { display: grid; grid-template-columns: 78px 1fr 100px; gap: 8px; }
  .dob-row select { min-width: 0; }
  .miss { box-shadow: 0 0 0 2px #B3261E; border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top"><h1>LCM - Linh Chinese Medicine</h1><p>Patient intake</p></header>
<div class="wrap">
  <div id="app"><div class="center"><p>Loading your form…</p></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function titleCase(s) { return String(s == null ? "" : s).toLowerCase().replace(/(^|[^a-z0-9])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }); }

  var PH_HISTORY_GROUPS = [
    { g: "Cycle & bleeding", items: [
      ["heavy_menstrual_bleeding", "Heavy menstrual bleeding"], ["dysmenorrhoea", "Dysmenorrhoea"],
      ["irregular_menstruation", "Irregular menstruation"], ["amenorrhoea", "Amenorrhoea"],
      ["pms", "PMS"], ["pmdd", "PMDD"] ] },
    { g: "Structural", items: [
      ["uterine_fibroids", "Uterine fibroids"], ["adenomyosis", "Adenomyosis"],
      ["ovarian_cysts", "Ovarian cysts"], ["endometriosis", "Endometriosis"] ] },
    { g: "Reproductive", items: [
      ["pcos", "PCOS"], ["infertility_unexplained", "Infertility (unexplained)"],
      ["history_of_miscarriage", "History of miscarriage"], ["pregnant", "Pregnant"],
      ["breastfeeding", "Breastfeeding"] ] },
    { g: "General health", items: [
      ["diabetes", "Diabetes"], ["high_blood_pressure", "High blood pressure"],
      ["thyroid_condition", "Thyroid condition"], ["heart_condition", "Heart condition"],
      ["asthma", "Asthma"], ["lung_condition", "Other lung condition"], ["digestive_condition", "Digestive condition"],
      ["kidney_condition", "Kidney condition"], ["liver_condition", "Liver condition"], ["autoimmune_condition", "Autoimmune condition"],
      ["cancer", "Cancer (current or past)"], ["myelodysplastic_syndrome", "Myelodysplastic syndrome (MDS)"] ] },
    { g: "Skin", items: [
      ["tinea_fungal_skin", "Tinea / fungal skin (ringworm, athlete's foot)"] ] },
    { g: "Medication & allergies", items: [
      ["taking_prescribed_medication", "Taking prescribed medication"], ["taking_supplements", "Taking supplements"],
      ["known_drug_allergy", "Known drug allergy"], ["known_food_allergy", "Known food allergy"],
      ["allergic_to_herbs", "Allergic to any herbs"], ["blood_thinning_medication", "Blood-thinning medication"] ] },
    { g: "Family history", f: 1, items: [
      ["fh_diabetes", "Diabetes"], ["fh_heart_disease_stroke", "Heart disease or stroke"],
      ["fh_high_blood_pressure", "High blood pressure"], ["fh_cancer", "Cancer"],
      ["fh_thyroid_condition", "Thyroid condition"], ["fh_autoimmune_condition", "Autoimmune condition"],
      ["fh_endometriosis", "Endometriosis"], ["fh_pcos", "PCOS"], ["fh_early_menopause", "Early menopause"] ] },
  ];
  var PH_HX_FEMALE_GROUPS = { "Cycle & bleeding": 1, "Structural": 1, "Reproductive": 1 };
  PH_HISTORY_GROUPS.forEach(function (gr) { gr.fem = !!PH_HX_FEMALE_GROUPS[gr.g]; });
  // her 2026-10-26 report ("it doesnt show the tinea question"): this page kept its own copy of the questions and the app's grew. The app now
  // sends its list with every link (prefill.qs: [{ g, f = family, fem = women only, items: [[key, words]] }]); the copy above is only used when
  // a link arrives without one. A list that is not well formed is ignored.
  function questionsFrom(p) {
    var qs = p && Array.isArray(p.qs) ? p.qs : null;
    if (!qs || !qs.length) return PH_HISTORY_GROUPS;
    var ok = qs.every(function (gr) {
      return gr && typeof gr.g === "string" && Array.isArray(gr.items) && gr.items.every(function (it) { return Array.isArray(it) && /^[a-z0-9_]+$/.test(it[0] || "") && typeof it[1] === "string"; });
    });
    return ok ? qs.map(function (gr) { return { g: gr.g, f: !!gr.f, fem: !!gr.fem, items: gr.items }; }) : PH_HISTORY_GROUPS;
  }
  // her ask 2026-10-13 (the short Fang Bing Ren questions): [sign key, the patient's words, "F" = women only]. Keys are rows of
  // PH_REN_SIGNS ("p", how she usually is) and PH_BING_SIGNS ("d", the last few weeks) in index.html; only a Yes travels, as
  // history.fbr = { v, p: [keys], d: [keys] }, and the app puts it straight onto her signs when the form is applied. Optional:
  // none of these rows counts as a missing answer. THE WORDING IS A DRAFT for her to correct, here and nowhere else.
  var PH_FBR_Q = {
    p: [
      ["chest_hypo_tend", "Do you often feel fullness, tightness or an aching pressure in your chest or ribs?"],
      ["edema_tend", "Do your feet or lower legs tend to swell?"],
      ["nausea_tend", "Do you often feel nauseous?"],
      ["constipation_tend", "Are you usually constipated?"],
      ["cold_extrem", "Are your hands and feet usually cold?"],
      ["palp_tend", "Do you often feel your heart racing or pounding?"],
      ["sweat_profuse_tend", "Do you sweat heavily?"],
      ["appetite_poor_tend", "Is your appetite usually poor?"],
      ["wheeze_tend", "Do you tend to wheeze or feel tight in the chest when you breathe?"],
      ["irritable_restless_tend", "Are you often irritable?"]
    ],
    d: [
      ["edema_surf", "Have you had puffy swelling under the skin (face, hands or ankles)?"],
      ["nausea_vomit", "Have you felt nauseous?"],
      ["feverish", "Have you felt feverish?"],
      ["insomnia_dream", "Have you slept poorly?"],
      ["diarrhea", "Have you had loose stools?"],
      ["headache", "Have you had headaches?"],
      ["menstrual_irreg_now", "Have your periods been irregular?", "F"],
      ["constipation_now", "Have you been constipated?"],
      ["joint_ache", "Have you had body aches?"],
      ["alt_fever_chill", "Have you had a fever that comes and goes with chills?"]
    ]
  };
  var PH_CYCLE_FLOW = [["light", "Light"], ["moderate", "Moderate"], ["heavy", "Heavy"]];
  var PH_CYCLE_PAIN = [["none", "None"], ["mild", "Mild"], ["moderate", "Moderate"], ["severe", "Severe"]];
  var PH_CYCLE_SYMPTOMS = [["cramping", "Cramping"], ["mood", "Mood changes"], ["breast", "Breast tenderness"], ["headache", "Headaches"], ["bloating", "Bloating"], ["fatigue", "Fatigue"], ["acne", "Acne"]];
  var PH_CYCLE_CONTRACEPTION = [["none", "None"], ["pill", "Pill"], ["iud_h", "IUD (hormonal)"], ["iud_c", "IUD (copper)"], ["implant", "Implant"], ["condoms", "Condoms"], ["recent", "Recently stopped"], ["other", "Other"]];

  var sb = window.supabase.createClient("https://jkpfhqaxhsiwtijxxzql.supabase.co", "sb_publishable_td_6_5ACewMZq8fVEB3Gww_KB-EDlYY");
  var token = new URLSearchParams(location.search).get("t");
  var app = document.getElementById("app");

  function centerScreen(title, text) {
    app.innerHTML = '<div class="center"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p></div>";
  }

  function selHtml(id, opts, defaultVal) {
    return '<select id="' + id + '">' + opts.map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === defaultVal ? " selected" : "") + '>' + esc(o[1]) + "</option>";
    }).join("") + "</select>";
  }

  // her 2026-10-26 picks (the medical history link): a Yes opens a details box on its own row (the one Medication & allergies box it
  // replaces asked "which ones" for six rows at once); "Taking supplements" Yes opens supplement rows instead (name + dose, + Add another);
  // family history rows add Don't know, with one "Unsure about anything?" box under the group.
  function historyGroupsHtml(groups) {
    return groups.map(function (gr) {
      var fam = !!gr.f, ow = fam ? "fam" : gr.g === "General health" ? "own" : "";
      return '<div class="hx-group"' + (fam ? ' data-hx-fam="1"' : '') + '><div class="hx-group-h">' + esc(gr.g) + '</div>' +
        (fam ? '<p class="hx-sub">Parents, brothers, sisters, children</p>' : '') +
        gr.items.map(function (it) {
          var supp = it[0] === "taking_supplements";
          return '<div class="hx-row" data-hx-item="' + it[0] + '"><span class="hx-label">' + esc(it[1]) + '</span>' +
            '<div class="hx-toggle"><button type="button" class="hx-btn" data-hx-val="yes">Yes</button><button type="button" class="hx-btn" data-hx-val="no">No</button>' +
            (fam ? '<button type="button" class="hx-btn unsure" data-hx-val="unsure">Don’t know</button>' : '') + '</div>' +
            (supp
              ? '<div class="supp-block" id="suppBlock" hidden><span class="q">All the supplements you take, with the dose if you know it</span><div id="suppRows"></div><button type="button" class="chip" id="suppAdd">+ Add another</button></div>'
              : '<textarea class="hx-note" data-hx-note="' + it[0] + '" rows="1" placeholder="Details" aria-label="Details: ' + esc(it[1]) + '" hidden></textarea>') +
            '</div>';
        }).join("") +
        (ow ? '<div class="ox-block"><div id="oxRows-' + ow + '"></div><button type="button" class="ox-add" data-ox-add="' + ow + '">+ Something else</button></div>' : '') +
        (fam ? '<div class="field" style="margin-top:10px"><label class="q" for="fFhNote">Unsure about anything?</label><textarea id="fFhNote" rows="2" placeholder=""></textarea></div>' : '') +
        "</div>";
    }).join("");
  }
  // a row's details box shows while its Yes is picked (the text is kept if she flips it, and only sent while Yes); the supplement rows the same
  function hxRowSync(row) {
    var yes = !!row.querySelector('.hx-btn.on[data-hx-val="yes"]');
    var note = row.querySelector(".hx-note");
    if (note) note.hidden = !yes;
    if (row.dataset.hxItem === "taking_supplements") {
      document.getElementById("suppBlock").hidden = !yes;
      if (yes && !suppRows.length) suppAddRow();
    }
  }
  // ---- supplements: one row per supplement, name + dose ----
  var suppRows = [];
  function suppAddRow() { suppRows.push({ name: "", dose: "" }); suppRenderRows(); }
  function suppRenderRows() {
    var wrap = document.getElementById("suppRows");
    if (!wrap) return;
    wrap.innerHTML = suppRows.map(function (r, i) {
      return '<div class="supp-row" data-supp-idx="' + i + '"><input type="text" data-supp-f="name" value="' + esc(r.name) + '" placeholder="Supplement" aria-label="Supplement">' +
        '<input type="text" data-supp-f="dose" value="' + esc(r.dose) + '" placeholder="Dose" aria-label="Dose">' +
        '<button type="button" class="rm" data-supp-rm="' + i + '" aria-label="Remove">×</button></div>';
    }).join("");
    wrap.querySelectorAll("[data-supp-f]").forEach(function (input) {
      input.addEventListener("input", function () { suppRows[+input.closest("[data-supp-idx]").dataset.suppIdx][input.dataset.suppF] = input.value; });
    });
    wrap.querySelectorAll("[data-supp-rm]").forEach(function (btn) {
      btn.addEventListener("click", function () { suppRows.splice(+btn.dataset.suppRm, 1); suppRenderRows(); });
    });
  }

  // ---- her 2026-10-27 pick 3 (Other condition): a condition the list does not have, at the end of General health and Family history.
  // A row = the condition + its details; sent as history.others = [{ n, f: 1 = family, note }]. Optional: never a missing answer.
  var otherRows = { own: [], fam: [] };
  function otherAddRow(w) { otherRows[w].push({ n: "", note: "" }); otherRenderRows(w); }
  function otherRenderRows(w) {
    var wrap = document.getElementById("oxRows-" + w);
    if (!wrap) return;
    wrap.innerHTML = otherRows[w].map(function (r, i) {
      return '<div class="ox-row" data-ox-idx="' + i + '"><div class="f"><input type="text" data-ox-f="n" value="' + esc(r.n) + '" placeholder="Condition" aria-label="Condition" maxlength="120">' +
        '<textarea data-ox-f="note" rows="1" placeholder="Details" aria-label="Details">' + esc(r.note) + '</textarea></div>' +
        '<button type="button" class="rm" data-ox-rm="' + i + '" aria-label="Remove">×</button></div>';
    }).join("");
    wrap.querySelectorAll("[data-ox-f]").forEach(function (input) {
      input.addEventListener("input", function () { otherRows[w][+input.closest("[data-ox-idx]").dataset.oxIdx][input.dataset.oxF] = input.value; });
    });
    wrap.querySelectorAll("[data-ox-rm]").forEach(function (btn) {
      btn.addEventListener("click", function () { otherRows[w].splice(+btn.dataset.oxRm, 1); otherRenderRows(w); });
    });
  }

  function fbrRowsHtml(kind) {
    return PH_FBR_Q[kind].map(function (q) {
      return '<div class="hx-row" data-fbr-item="' + q[0] + '" data-fbr-kind="' + kind + '"' + (q[2] === "F" ? ' data-fbr-f="1" hidden' : '') + '><span class="hx-label">' + esc(q[1]) + '</span>' +
        '<div class="hx-toggle"><button type="button" class="fbr-btn" data-fbr-val="yes">Yes</button><button type="button" class="fbr-btn" data-fbr-val="no">No</button></div></div>';
    }).join("");
  }
  // women-only rows (a period question) show once she is Female, whether she taps it or the form arrived pre-filled
  function showFemaleRows(isF) {
    document.getElementById("femaleHx").hidden = !isF;
    document.getElementById("cycleSec").hidden = !isF;
    document.querySelectorAll("[data-fbr-f]").forEach(function (r) { r.hidden = !isF; });
  }

  // again = { at } when the patient reopens a form she already sent (her 2026-10-26 pick "Same link reopens"): her own answers are back on it
  function renderForm(name, prefill, again) {
    var groupsAll = questionsFrom(prefill);
    var alwaysGroups = groupsAll.filter(function (gr) { return !gr.fem; });
    var femaleGroups = groupsAll.filter(function (gr) { return gr.fem; });
    app.innerHTML =
      '<div class="card">' +
        '<p class="lead">Hi ' + esc(titleCase(name)) + ' — a few questions before your visit.</p>' +

    document.querySelectorAll(".hx-btn").forEach(function (btn) {

  function longDate(iso) {

  // her ask 2026-10-13 ("prefill details if patient already has it in their file"): what her practitioner's file
  // already holds is filled into "Your details" for the patient to check and correct. Only values that are really
  // there; set directly (no events), so nothing is flagged as missing before the patient has touched the form.
  function applyPrefill(p) {
    if (!p || typeof p !== "object") return;
    if (p.sex === "F" || p.sex === "M") {
      var sexBtn = document.querySelector('#sexSeg .sexbtn[data-sex="' + p.sex + '"]');
      if (sexBtn) {
        sexBtn.classList.add("on");
        showFemaleRows(p.sex === "F");
      }
    }
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof p.dob === "string" ? p.dob : "");
    if (dm) {
      document.getElementById("fDobDay").value = String(Number(dm[3]));
      document.getElementById("fDobMon").value = String(Number(dm[2]));
      document.getElementById("fDobYr").value = dm[1];
    }
    if (typeof p.mobile === "string") document.getElementById("fPhone").value = p.mobile;
    if (typeof p.email === "string") document.getElementById("fEmail").value = p.email;
    if (typeof p.address === "string") document.getElementById("fAddress").value = p.address;
    document.getElementById("pfNote").hidden = !Object.keys(p).filter(function (k) { return k !== "qs"; }).length;
    // her ask 2026-10-13 ("integrate the form with her profile"): the cycle answers and the Yes / No medical history her file already holds.
    // The app only sends values that carry real information (never its own starting values), so a blank here is a question still to answer.
    var cy = p.cycle && typeof p.cycle === "object" ? p.cycle : null;
    if (cy) {
      var setVal = function (id, v) { if (v != null && v !== "") document.getElementById(id).value = String(v); };
      if (typeof cy.lmp === "string" && /^\d{4}-\d{2}-\d{2}$/.test(cy.lmp)) setVal("fLmp", cy.lmp);
      setVal("fCycleLen", cy.cycleLen); setVal("fFlowDays", cy.flowDays); setVal("fMenarche", cy.menarcheAge); setVal("fTtc", cy.ttcMonths);
      var setSel = function (id, v, list) { if (list.some(function (o) { return o[0] === v; })) document.getElementById(id).value = v; };
      setSel("fFlowIntensity", cy.flowIntensity, PH_CYCLE_FLOW); setSel("fPain", cy.pain, PH_CYCLE_PAIN); setSel("fContraception", cy.contraception, PH_CYCLE_CONTRACEPTION);
      if (cy.regular === false) document.getElementById("fRegular").checked = false;
      if (Array.isArray(cy.symptoms)) cy.symptoms.forEach(function (s) { if (!/^[a-z_]+$/.test(s)) return; var chip = document.querySelector('[data-symptom="' + s + '"]'); if (chip) chip.classList.add("on"); });
    }
    var hx = p.history && typeof p.history === "object" ? p.history : null;
    if (hx) Object.keys(hx).forEach(function (k) {
      if ((hx[k] !== "yes" && hx[k] !== "no" && hx[k] !== "unsure") || !/^[a-z0-9_]+$/.test(k)) return;
      var btn = document.querySelector('[data-hx-item="' + k + '"] .hx-btn[data-hx-val="' + hx[k] + '"]');
      if (btn) btn.classList.add("on");
    });
    // the "How you usually are" rows her file already has as a Yes (the app only sends keys of that list)
    if (p.fbr && Array.isArray(p.fbr.p)) p.fbr.p.forEach(function (k) {
      if (!/^[a-z0-9_]+$/.test(k)) return;
      var yes = document.querySelector('[data-fbr-item="' + k + '"][data-fbr-kind="p"] .fbr-btn[data-fbr-val="yes"]');
      if (yes) yes.classList.add("on");
    });
    // the details beside a Yes (her app sends only the medication and allergy rows' own notes; a resend brings back every box she wrote)
    if (p.notes && typeof p.notes === "object") Object.keys(p.notes).forEach(function (k) {
      if (!/^[a-z0-9_]+$/.test(k) || typeof p.notes[k] !== "string") return;
      var box = document.querySelector('[data-hx-note="' + k + '"]');
      if (box) box.value = p.notes[k];
    });
    if (Array.isArray(p.supps)) {
      suppRows = p.supps.filter(function (r) { return r && typeof r.name === "string" && r.name.trim(); }).slice(0, 30)
        .map(function (r) { return { name: r.name, dose: typeof r.dose === "string" ? r.dose : "" }; });
      suppRenderRows();
    }
    var fhBox = document.getElementById("fFhNote");
    if (fhBox && typeof p.fhNote === "string") fhBox.value = p.fhNote;
    // the conditions she added on an earlier link (her app sends their words; a resend brings back her details too)
    if (Array.isArray(p.others)) {
      otherRows = { own: [], fam: [] };
      p.others.slice(0, 20).forEach(function (r) { if (r && typeof r.n === "string" && r.n.trim()) otherRows[r.f ? "fam" : "own"].push({ n: r.n, note: typeof r.note === "string" ? r.note : "" }); });
      otherRenderRows("own"); otherRenderRows("fam");
    }
    // the "last few weeks" rows come back only on a resend (her app never sends them: they go stale)
    if (p.fbr && Array.isArray(p.fbr.d)) p.fbr.d.forEach(function (k) {
      if (!/^[a-z0-9_]+$/.test(k)) return;
      var yes = document.querySelector('[data-fbr-item="' + k + '"][data-fbr-kind="d"] .fbr-btn[data-fbr-val="yes"]');
      if (yes) yes.classList.add("on");
    });
    // her IVF / egg collection / egg freezing rounds already on file: the question reads Yes with each round filled in. Each row keeps `ref`
    // (her app's id for that round) so an unchanged round is recognised on the review screen and a changed one is matched to the right round.
    if (Array.isArray(p.ivf) && p.ivf.length) {
      var str = function (v) { return v == null ? "" : String(v); };
      ivfRows = p.ivf.map(function (r) {
        return { ref: typeof r.ref === "string" ? r.ref : "", when: /^\d{4}-\d{2}$/.test(r.when || "") ? r.when : "", clinic: typeof r.clinic === "string" ? r.clinic : "",
          eggs: str(r.eggs), fertilised: str(r.fertilised), frozen: str(r.frozen) };
      });
      var ivfYes = document.querySelector('#ivfSeg .sexbtn[data-ivf="yes"]');
      if (ivfYes) ivfYes.classList.add("on");
      document.getElementById("ivfList").hidden = false;
      ivfRenderRows();
    } else if (p.ivfNo) {
      // a resend: she answered No to the IVF question last time
      var ivfNoBtn = document.querySelector('#ivfSeg .sexbtn[data-ivf="no"]');
      if (ivfNoBtn) ivfNoBtn.classList.add("on");
    }
  }

  // ---- IVF history (her ask 2026-09-13, card 11) ----
  // one plain object per row; only the three funnel numbers a patient can
  // actually answer without her clinic letter in front of her -- Mature/
  // Day3/Blastocysts/PGT stay practitioner-typed, at the visit.
  var ivfRows = [];
  function ivfAddRow() {
    ivfRows.push({ when: "", clinic: "", eggs: "", fertilised: "", frozen: "" });
    ivfRenderRows();
  }
  function ivfRenderRows() {
    var wrap = document.getElementById("ivfRows");

          '<label><span class="mini">Clinic</span><input type="text" data-ivf-f="clinic" value="' + esc(r.clinic) + '" placeholder=""></label>' +
        '</div>' +
        '<div class="ivf-row2">' +
          '<label><span class="mini">Eggs collected</span><input type="number" min="0" data-ivf-f="eggs" value="' + esc(r.eggs) + '" placeholder=""></label>' +
          '<label><span class="mini">Fertilised</span><input type="number" min="0" data-ivf-f="fertilised" value="' + esc(r.fertilised) + '" placeholder="if known"></label>' +
          '<label><span class="mini">Frozen</span><input type="number" min="0" data-ivf-f="frozen" value="' + esc(r.frozen) + '" placeholder="if known"></label>' +

    wrap.querySelectorAll("[data-ivf-f]").forEach(function (input) {
      input.addEventListener("input", function () {

      });

    wrap.querySelectorAll("[data-ivf-rm]").forEach(function (btn) {
      btn.addEventListener("click", function () { ivfRows.splice(+btn.dataset.ivfRm, 1); ivfRenderRows(); });
    });
  }

  // ---- required answers ----
  // every question must be answered before the form can be sent. Missing
  // items are listed under the form, and the Submit button stays disabled
  // until the list is empty.
  var PH_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // showMissing turns on the first time she changes anything, so the red
  // outlines never appear on a blank form before she has touched it.
  var showMissing = false;
  var submitting = false;

  // day / month / year, read as an Australian date. Null until it is a real
  // date in the past, so a half-typed or impossible date never gets through.
  function dobIso() {
    var d = document.getElementById("fDobDay").value.trim();
    var m = document.getElementById("fDobMon").value;
    var y = document.getElementById("fDobYr").value.trim();
    if (!/^\d{1,2}$/.test(d) || !m || !/^\d{4}$/.test(y)) return null;
    var dd = Number(d), mm = Number(m), yy = Number(y);
    var dt = new Date(Date.UTC(yy, mm - 1, dd));
    if (dt.getUTCFullYear() !== yy || dt.getUTCMonth() !== mm - 1 || dt.getUTCDate() !== dd) return null;
    if (yy < 1900 || dt.getTime() > Date.now()) return null;
    return yy + "-" + String(mm).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
  }

  // { label, el } for each unanswered question; el is the box to highlight
  function missingItems() {
    var miss = [];
    var blank = function (id) { return !document.getElementById(id).value.trim(); };
    if (!document.querySelector("#sexSeg .sexbtn.on")) miss.push({ label: "Sex", el: document.getElementById("sexSeg") });
    if (!dobIso()) miss.push({ label: "Date of birth", el: document.getElementById("dobField") });
    if (blank("fPhone")) miss.push({ label: "Mobile number", el: document.getElementById("fPhone") });
    if (blank("fEmail")) miss.push({ label: "Email", el: document.getElementById("fEmail") });
    if (blank("fAddress")) miss.push({ label: "Address", el: document.getElementById("fAddress") });
    var cycle = document.getElementById("cycleSec");
    if (!cycle.hidden) {
      if (blank("fLmp")) miss.push({ label: "Last period start", el: document.getElementById("fLmp") });
      if (blank("fCycleLen")) miss.push({ label: "Usual cycle length", el: document.getElementById("fCycleLen") });
      if (blank("fFlowDays")) miss.push({ label: "Days you bleed", el: document.getElementById("fFlowDays") });
      if (blank("fMenarche")) miss.push({ label: "Age at first period", el: document.getElementById("fMenarche") });
      if (!document.querySelector("#ivfSeg .sexbtn.on")) miss.push({ label: "IVF question", el: document.getElementById("ivfSeg") });
    }
    // medical history rows in a hidden group (e.g. female-only for a man) don't count
    document.querySelectorAll("[data-hx-item]").forEach(function (row) {
      if (row.closest("[hidden]") || row.querySelector(".hx-btn.on")) return;
      miss.push({ label: "Medical history", el: row, hx: true });
    });
    return miss;
  }

  function refreshGate() {
    var miss = missingItems();
    var btn = document.getElementById("submitBtn");
    var note = document.getElementById("missNote");
    document.querySelectorAll(".miss").forEach(function (el) { el.classList.remove("miss"); });
    if (showMissing) miss.forEach(function (m) { m.el.classList.add("miss"); });
    btn.disabled = submitting || miss.length > 0;
    if (!miss.length) {
      note.textContent = "Everything is answered. Thank you.";
      return;
    }
    var names = miss.filter(function (m) { return !m.hx; }).map(function (m) { return m.label; });
    var hx = miss.filter(function (m) { return m.hx; }).length;
    if (hx) names.push(hx + (hx === 1 ? " medical history question" : " medical history questions"));
    note.textContent = "Still to answer: " + names.join(", ") + ".";
  }

  function gateChanged() { showMissing = true; refreshGate(); }

  function numOrNull(id) {
    var v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
  }

  function collectPayload() {
    var sexBtn = document.querySelector("#sexSeg .sexbtn.on");
    var sex = sexBtn ? sexBtn.dataset.sex : "";
    var demographics = {
      sex: sex,
      dob: dobIso(),
      mobile: document.getElementById("fPhone").value.trim() || null,
      email: document.getElementById("fEmail").value.trim() || null,
      address: document.getElementById("fAddress").value.trim() || null,
    };
    var history = {};
    document.querySelectorAll("[data-hx-item]").forEach(function (row) {
      var on = row.querySelector(".hx-btn.on");
      if (on) history[row.dataset.hxItem] = on.dataset.hxVal;
    });
    // her 2026-10-26 picks: the details beside each Yes (history.notes = { key: text }), the supplement rows (history.supps = [{ name, dose }])
    // and the family box (history.fhNote). Plain keys on the same jsonb blob, like medNotes before them: no SQL change.
    var notes = {};
    document.querySelectorAll("[data-hx-note]").forEach(function (box) {
      var row = box.closest("[data-hx-item]"), v = box.value.trim();
      if (v && row && row.querySelector('.hx-btn.on[data-hx-val="yes"]')) notes[box.dataset.hxNote] = v.slice(0, 1000);
    });
    if (Object.keys(notes).length) history.notes = notes;
    if (history.taking_supplements === "yes") {
      var supps = suppRows.filter(function (r) { return r.name.trim(); }).map(function (r) { return { name: r.name.trim().slice(0, 120), dose: r.dose.trim().slice(0, 120) }; });
      if (supps.length) history.supps = supps;
    }
    var fhEl = document.getElementById("fFhNote");
    if (fhEl && fhEl.value.trim()) history.fhNote = fhEl.value.trim().slice(0, 1000);
    var others = [];
    ["own", "fam"].forEach(function (w) {
      otherRows[w].forEach(function (r) { var n = r.n.trim(); if (n) others.push({ n: n.slice(0, 120), f: w === "fam" ? 1 : 0, note: r.note.trim().slice(0, 1000) }); });
    });
    if (others.length) history.others = others.slice(0, 20);
    // her ask 2026-10-13: the short Fang Bing Ren lists. ONLY a Yes travels (a No or a skipped row stays blank on her side), as one more
    // plain key on the same jsonb blob (no SQL change, like medNotes). A row hidden for her sex is not sent.
    var fbr = { v: 1, p: [], d: [] };
    document.querySelectorAll("[data-fbr-item]").forEach(function (row) {
      var yes = row.querySelector('.fbr-btn.on[data-fbr-val="yes"]');
      if (!yes || row.hidden) return;
      (row.dataset.fbrKind === "p" ? fbr.p : fbr.d).push(row.dataset.fbrItem);
    });
    if (fbr.p.length || fbr.d.length) history.fbr = fbr;
    var cycle = null;
    if (sex === "F") {
      var lmp = document.getElementById("fLmp").value || null;
      var cycleLen = numOrNull("fCycleLen");
      var flowDays = numOrNull("fFlowDays");
      var flowIntensity = document.getElementById("fFlowIntensity").value;
      var pain = document.getElementById("fPain").value;
      var regular = document.getElementById("fRegular").checked;
      var menarcheAge = numOrNull("fMenarche");
      var contraception = document.getElementById("fContraception").value;
      var ttcMonths = numOrNull("fTtc");
      var symptoms = Array.prototype.map.call(document.querySelectorAll("#symptomChips .chip.on"), function (c) { return c.dataset.symptom; });
      // her card 11: only rows with SOMETHING typed travel -- an added-then-
      // left-blank card is not a reported cycle. No SQL change needed:
      // submit_intake_form's p_cycle is already a jsonb blob (a nested key
      // costs nothing server-side); phIntakeComputeDiff reads it back out.
      var ivfSel = document.querySelector("#ivfSeg .sexbtn.on");
      var ivfCycles = (ivfSel && ivfSel.dataset.ivf === "yes")
        ? ivfRows.filter(function (r) { return r.when || r.clinic || r.eggs !== "" || r.fertilised !== "" || r.frozen !== ""; })
            .map(function (r) { return { ref: r.ref || null, when: r.when || null, clinic: r.clinic || null,
              eggs: r.eggs === "" ? null : Number(r.eggs), fertilised: r.fertilised === "" ? null : Number(r.fertilised),
              frozen: r.frozen === "" ? null : Number(r.frozen) }; })
        : [];
      var hasCycleAnswer = lmp || cycleLen != null || flowDays != null || menarcheAge != null || contraception !== "none" || ttcMonths != null || symptoms.length || flowIntensity !== "moderate" || pain !== "none" || !regular || ivfCycles.length;
      if (hasCycleAnswer) cycle = { lmp: lmp, cycleLen: cycleLen, flowDays: flowDays, flowIntensity: flowIntensity, pain: pain, regular: regular, menarcheAge: menarcheAge, contraception: contraception, ttcMonths: ttcMonths, symptoms: symptoms, ivfCycles: ivfCycles };
    }
    return { demographics: demographics, history: history, cycle: cycle };
  }

  function onSubmit(e) {
    e.preventDefault();
    var btn = document.getElementById("submitBtn");
    var errEl = document.getElementById("formErr");
    // second line of defence: the button is disabled while anything is
    // missing, but Enter in a text box can still submit the form
    if (missingItems().length) { showMissing = true; refreshGate(); return; }
    errEl.hidden = true;
    submitting = true;
    btn.disabled = true; btn.textContent = "Submitting…";
    var payload = collectPayload();
    sb.rpc("submit_intake_form", { p_token: token, p_demographics: payload.demographics, p_history: payload.history, p_cycle: payload.cycle }).then(function (res) {
      if (res.error) throw res.error;
      if (res.data !== true) {
        centerScreen("Already sent", "This was already sent — thank you! If you need to change anything, contact your practitioner directly.");
        return;
      }
      centerScreen("Thank you", "Your information has been sent to your practitioner for review before your visit. You can close this page now.");
    }).catch(function () {
      errEl.textContent = "Something went wrong sending this — please try again.";
      errEl.hidden = false;
      submitting = false;
      btn.textContent = "Submit";
      refreshGate();
    });
  }

  // her own answers, in the shape applyPrefill reads (a resend: her 2026-10-26 pick "Same link reopens")
  function answersAsPrefill(row) {
    var d = row.demographics || {}, h = row.history || {}, c = row.cycle || null, p = { history: {} };
    if (row.prefill && Array.isArray(row.prefill.qs)) p.qs = row.prefill.qs;
    ["sex", "dob", "mobile", "email", "address"].forEach(function (k) { if (d[k]) p[k] = d[k]; });
    Object.keys(h).forEach(function (k) { if (h[k] === "yes" || h[k] === "no" || h[k] === "unsure") p.history[k] = h[k]; });
    if (h.notes) p.notes = h.notes;
    if (Array.isArray(h.supps)) p.supps = h.supps;
    if (typeof h.fhNote === "string") p.fhNote = h.fhNote;
    if (Array.isArray(h.others)) p.others = h.others;
    if (h.fbr) p.fbr = h.fbr;
    if (c) { p.cycle = c; if (Array.isArray(c.ivfCycles) && c.ivfCycles.length) p.ivf = c.ivfCycles; else if (Array.isArray(c.ivfCycles)) p.ivfNo = true; }
    return p;
  }

  if (!token) {
    centerScreen("Link incomplete", "This link looks incomplete. Please check you copied the whole link your practitioner sent you.");
    return;
  }
  sb.rpc("get_intake_form", { p_token: token }).then(function (res) {
    if (res.error) throw res.error;
    var row = Array.isArray(res.data) ? res.data[0] : res.data;
    if (!row) { centerScreen("Link not found", "This link isn’t valid. Check you copied the whole link, or ask your practitioner to send a new one."); return; }
    if (row.status === "submitted" || row.status === "applied") {
      if (!row.history && !row.demographics) { centerScreen("Already submitted", "You’ve already submitted this — thank you! If you need to make changes, contact your practitioner directly."); return; }
      renderForm(row.patient_name || "there", answersAsPrefill(row), { at: row.submitted_at });
      return;
    }
    if (row.status === "dismissed") { centerScreen("Link no longer active", "This link is no longer active. Please contact your practitioner for a new one."); return; }
    renderForm(row.patient_name || "there", row.prefill);
  }).catch(function () {
    centerScreen("Couldn’t load this form", "Something went wrong loading this form. Please try again, or contact your practitioner.");
  });
})();
</script>
</body>
</html>
