<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musculoskeletal Assessments, mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --herb: #165C74; --herb-deep: #0B3B4B; --herb-tint: #EDF5F8; --ink: #141F23; --soft: #4A575B; --faint: #626D71; --line: #D3DEE2; --paper: #F4F8FA; --white: #fff;
    --msk: #2E6089; --msk-deep: #12304A; --msk-tint: #E9F1F8; --msk-solid: #095181;
    --gold: #D9AE47; --gold-deep: #8A6D1A; --gold-tint: #FFFBE2;
    --red: #C62828; --red-tint: #FBECEC; --green: #2E7D4F; --green-tint: #EAF5EC; --amber: #C27A00; --amber-tint: #FFF4DF;
    --disp: 'Barlow Semi Condensed','Arial Narrow',sans-serif; --body: 'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); font: 400 13px/1.45 var(--body); color: var(--ink); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mockbar { position: sticky; top: 0; z-index: 20; background: var(--msk-deep); color: #fff; display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
  .mockbar h1 { font: 700 16px var(--disp); letter-spacing: .06em; text-transform: uppercase; margin: 0 8px 0 0; }
  .mockbar .sc { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 600; }
  .mockbar .sc.on { background: #fff; color: var(--msk-deep); border-color: #fff; }
  .mockbar .note { margin-left: auto; font-size: 12px; opacity: .8; }
  .wrap { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 20px; max-width: 1280px; margin: 18px auto; padding: 0 20px; }
  /* the app's own rail (cut down) */
  .rail { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 14px; align-self: start; position: sticky; top: 64px; }
  .rail h4 { margin: 10px 0 4px; font: 600 10.5px var(--disp); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .rail h4:first-child { margin-top: 0; }
  .rail div { padding: 5px 8px; border-radius: 8px; color: var(--soft); font-size: 12.5px; }
  .rail div.on { background: var(--msk-tint); color: var(--msk-deep); font-weight: 700; }
  .rail div.dim { color: var(--faint); }
  .rail .tick { color: var(--green); font-weight: 700; margin-left: 4px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { margin: 0; font: 700 18px var(--disp); letter-spacing: .04em; text-transform: uppercase; color: var(--msk-deep); }
  .card h3 { margin: 0 0 8px; font: 600 11px var(--disp); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .sub { color: var(--faint); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; color: var(--soft); }
  .chip.on { background: var(--msk); border-color: var(--msk); color: #fff; font-weight: 600; }
  .chip.auto::after { content: " · from pain map"; font-weight: 400; font-size: 11px; opacity: .85; }
  .btn { border: 1px solid var(--msk); background: var(--white); color: var(--msk-deep); border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 12.5px; }
  .btn.solid { background: var(--msk-solid); color: #fff; border-color: var(--msk-solid); }
  .btn.gold { background: var(--gold-tint); border-color: var(--gold); color: var(--gold-deep); }
  /* exam tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 14px; }
  .tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 3px solid transparent; color: var(--soft); font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .tabs button.on { color: var(--msk-deep); border-bottom-color: var(--msk); }
  .tabs .ct { font-size: 10.5px; background: var(--msk-tint); color: var(--msk-deep); border-radius: 999px; padding: 1px 7px; }
  .tabs .ct.done { background: var(--green-tint); color: var(--green); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font: 600 10.5px var(--disp); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 0 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.n { font-weight: 600; }
  .pill { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--soft); }
  .pill.on { background: var(--msk); border-color: var(--msk); color: #fff; font-weight: 600; }
  .pill.pos.on { background: var(--red); border-color: var(--red); }
  .pill.neg.on { background: var(--green); border-color: var(--green); }
  .pill.g1.on { background: var(--red); border-color: var(--red); }
  .pill.g2.on { background: var(--amber); border-color: var(--amber); }
  .pill.g3.on { background: var(--green); border-color: var(--green); }
  input[type=text], input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 64px; background: #fff; }
  input.wide { width: 100%; }
  .bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 70px; }
  .bar i { display: block; height: 100%; background: var(--msk); border-radius: 4px; }
  .bar i.warn { background: var(--amber); } .bar i.bad { background: var(--red); } .bar i.good { background: var(--green); }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; }
  .split { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 20px; align-items: start; }
  .fig svg { display: block; width: 100%; height: auto; }
  .spot { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--soft); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px; margin: 1px 3px 1px 0; background: var(--msk-tint); color: var(--msk-deep); }
  .tag.t1 { background: var(--amber-tint); color: var(--amber); } .tag.t2 { background: #F3E6D8; color: #7a4b1a; } .tag.t3 { background: var(--red-tint); color: var(--red); }
  .tag.w { background: var(--red-tint); color: var(--red); } .tag.ok { background: var(--green-tint); color: var(--green); }
  .flag { background: var(--red-tint); border: 1px solid #E9B8B8; color: #7d1717; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; }
  .gold { background: var(--gold-tint); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 12px; color: var(--gold-deep); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--white); }
  .tile .k { font: 600 10.5px var(--disp); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .tile .v { font: 700 20px var(--disp); color: var(--msk-deep); margin-top: 2px; }
  .tile .d { font-size: 12px; font-weight: 600; } .d.up { color: var(--green); } .d.down { color: var(--red); } .d.same { color: var(--faint); }
  .muted { color: var(--faint); }
  .screen { display: none; } .screen.on { display: block; }
  .arrow { color: var(--msk); font-weight: 700; }
  .scale { display: flex; gap: 3px; }
  .scale button { width: 24px; height: 26px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 11.5px; padding: 0; }
  .scale button.on { background: var(--msk); color: #fff; border-color: var(--msk); font-weight: 700; }
  .disc { font-size: 12.5px; color: var(--soft); } .disc li { margin: 4px 0; }
  .disc b { color: var(--ink); }
  .kbd { font: 600 10.5px var(--disp); letter-spacing: .08em; text-transform: uppercase; color: var(--msk); }
  @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } .rail { display: none; } .split, .two { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2,1fr); } }
</style>

      <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><select data-addm style="border:1px solid var(--line);border-radius:8px;padding:5px 8px"><option value="">+ Add a muscle not on the figure…</option>${MU.filter(m => m.view === "none").map(m => `<option value="${m.id}">${m.name}</option>`).join("")}</select></div></div></div>`;
  }
  if (t === "rom") {
    const blocks = PH_TP_OBJ_REGIONS.filter(([rk]) => S.regions.has(rk)).map(([rk, rl]) => `<h3>${rl}</h3><table><tr><th>Movement</th><th>Normal</th><th>Active</th><th>Passive</th><th>Pain</th><th>% of normal</th></tr>${PH_TP_OBJ_ROM_LIB[rk].map((e, i) => { const r = S.rom[`${rk}:${i}`] || {}, p = romPct(rk, i, r); return `<tr><td class="n">${e.name}</td><td>${e.normal}°</td><td><input type="number" data-rom="${rk}:${i}:a" value="${r.a || ""}"${e.pair ? ' placeholder="L / R"' : ""}></td><td><input type="number" data-rom="${rk}:${i}:p" value="${r.p || ""}"></td><td><span class="chips">${[["none", "None"], ["end", "At end"], ["arc", "Painful arc"]].map(([v, l]) => `<button class="pill${r.pain === v ? " on" : ""}" data-rompain="${rk}:${i}:${v}">${l}</button>`).join("")}</span></td><td style="min-width:110px"><div class="bar"><i class="${p < 60 ? "bad" : p < 85 ? "warn" : "good"}" style="width:${p}%"></i></div><span class="sub">${p ? p + "%" : "—"}</span></td></tr>`; }).join("")}</table>`).join("");

  if (t === "mmt") return PH_TP_OBJ_REGIONS.filter(([rk]) => S.regions.has(rk)).map(([rk, rl]) => `<h3>${rl}</h3><table><tr><th>Level</th><th>Muscle</th><th>Right</th><th>Left</th></tr>${(PH_TP_OBJ_MMT_LIB[rk] || []).map((e, i) => `<tr><td class="n">${e.level || ""}</td><td>${e.muscle}</td>${["R", "L"].map(s => `<td><span class="chips">${[["1", "Weak"], ["2", "Mildly weak"], ["3", "Strong"]].map(([v, l]) => `<button class="pill g${v}${S.mmt[`${rk}:${i}:${s}`] === v ? " on" : ""}" data-mmt="${rk}:${i}:${s}:${v}">${l}</button>`).join("")}</span></td>`).join("")}</tr>`).join("")}</table>`).join("") + `<div class="sub" style="margin-top:8px">Your 3-point scale, kept. Right and left are separate here (the current tracker has one grade per muscle).</div>`;
  if (t === "neuro") {
    const up = S.regions.has("cervical") || S.regions.has("shoulder") || S.regions.has("elbow"), low = S.regions.has("lumbar") || S.regions.has("hip") || S.regions.has("knee") || S.regions.has("ankle");
    const derm = [...(up ? [["C5", "Lateral upper arm"], ["C6", "Thumb"], ["C7", "Middle finger"], ["C8", "Little finger"], ["T1", "Medial forearm"]] : []), ...(low ? [["L4", "Medial lower leg"], ["L5", "Top of foot"], ["S1", "Outer foot"]] : [])];
    const refl = [...(up ? [["Biceps", "C5"], ["Brachioradialis", "C6"], ["Triceps", "C7"]] : []), ...(low ? [["Patellar", "L4"], ["Achilles", "S1"]] : [])];
    const opt = (key, arr) => `<span class="chips">${arr.map(v => `<button class="pill${S.neuro[key] === v ? " on" : ""}" data-neuro="${key}:${v}">${v}</button>`).join("")}</span>`;

    <div><h3>Reflexes</h3><table><tr><th>Reflex</th><th>Right</th><th>Left</th></tr>${refl.map(([n, l]) => `<tr><td class="n">${n} <span class="muted">${l}</span></td>${["R", "L"].map(s => `<td>${opt(`r${n}${s}`, ["Absent", "Reduced", "Normal", "Brisk"])}</td>`).join("")}</tr>`).join("")}</table><div class="sub" style="margin-top:8px">Strength by nerve root (myotomes) is on the Strength tab: the same rows, not asked twice.</div></div></div>`;
  }
  if (t === "tests") return PH_TP_OBJ_REGIONS.filter(([rk]) => S.regions.has(rk)).map(([rk, rl]) => `<h3>${rl}</h3><table><tr><th>Test</th><th>Result</th><th>What it shows</th></tr>${(PH_TP_OBJ_TEST_LIB[rk] || []).map((e, i) => { const v = S.tests[`${rk}:${i}`] || "nt"; return `<tr><td class="n">${e.name}</td><td><span class="chips">${[["nt", "Not tested"], ["pos", "Positive"], ["neg", "Negative"]].map(([k, l]) => `<button class="pill ${k}${v === k ? " on" : ""}" data-test="${rk}:${i}:${k}">${l}</button>`).join("")}</span></td><td class="sub"><b>${e.purpose}</b><br>Technique: ${e.tech}. Positive: ${e.pos}.</td></tr>`; }).join("")}</table>`).join("");
  if (t === "func") return `<div class="two"><div><h3>Patient-specific function (0 = unable, 10 = as before)</h3>${S.psfs.map((a, i) => `<div style="margin:8px 0"><div class="n" style="font-weight:600;margin-bottom:4px">${a[0]}</div>${scale("psfs" + i, a[1])}</div>`).join("")}<button class="btn" style="margin-top:8px">+ Her own activity</button></div>
    <div><h3>Quick functional checks</h3>${["Hand behind back", "Hand behind head", "Squat to 90°", "Single-leg stand 10 s", "Sit to stand ×5", "Reach to the top shelf"].map(f => `<div style="display:flex;gap:8px;align-items:center;margin:5px 0"><span style="width:160px">${f}</span><span class="chips">${["Easy", "Limited", "Painful", "Can't"].map(v => `<button class="pill${S.func[f] === v ? " on" : ""}" data-func="${esc(f)}:${v}">${v}</button>`).join("")}</span></div>`).join("")}</div></div>`;
  // summary & treat

  return `<div class="gold" style="margin-bottom:12px">Impression (writes itself from the exam, yours to edit): <span style="font-weight:500">${esc(impression())}</span></div>

    <div class="card" style="margin:0;background:var(--msk-tint)"><h3>Goes to the Treatment tab</h3>${S.treat.size ? [...S.treat].map(k => { const m = nm(k); return m ? `<div style="padding:5px 0;border-bottom:1px solid var(--line)"><b>${m.name}</b> ${sideOf(k)}<div class="sub">${m.acu}</div></div>` : ""; }).join("") : `<div class="muted">Nothing chosen yet.</div>`}<div class="sub" style="margin-top:8px">Also fills the Care Plan phase's Points cell when it is blank (never overwrites what you wrote).</div></div></div>`;
}

  const improved = rows.filter(r => dir(r) > 0).length, worse = rows.filter(r => dir(r) < 0).length;
  $("#s2").innerHTML = `
  <div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h2>Musculoskeletal Assessments</h2><div class="sub">Test Patient · visit 4 · last measured ${LAST.date} (visit 3) · phase 1 of 3</div></div>
    <div class="chips"><button class="btn" data-same="1">Same as last time for everything</button><button class="btn gold" data-bestre="1">Show improved values</button></div></div>
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="k">Pain now</div><div class="v">${rows[0].last} → ${rows[0].now}</div><div class="d ${pick(rows[0])[0]}">${pick(rows[0])[2]} ${Math.abs(rows[0].last - rows[0].now)} ${pick(rows[0])[1]}</div></div>
      <div class="tile"><div class="k">Shoulder flexion</div><div class="v">${rows[1].last}° → ${rows[1].now}°</div><div class="d ${pick(rows[1])[0]}">${pick(rows[1])[2]} ${Math.abs(rows[1].now - rows[1].last)}°</div></div>
      <div class="tile"><div class="k">Improved</div><div class="v">${improved} of ${rows.length}</div><div class="d up">${worse ? worse + " worse" : "none worse"}</div></div>
      <div class="tile"><div class="k">Tender points</div><div class="v">${rows.find(r => r.id === "tp").last} → ${rows.find(r => r.id === "tp").now}</div><div class="d ${pick(rows.find(r => r.id === "tp"))[0]}">${pick(rows.find(r => r.id === "tp"))[1]}</div></div>
      <div class="tile"><div class="k">Pain over 4 visits</div><div class="v" style="font-size:14px"><svg width="120" height="34" viewBox="0 0 120 34"><polyline points="4,6 44,10 84,17 116,${34 - rows[0].now * 3.2}" fill="none" stroke="var(--msk)" stroke-width="2.2"/><circle cx="116" cy="${34 - rows[0].now * 3.2}" r="3.5" fill="var(--msk)"/></svg></div></div></div></div>
  <div class="card"><h3>Re-measure · only change what is different (it starts from today's best guess, edit the exceptions)</h3>
    <table><tr><th>Measure</th><th>Baseline</th><th>Last (3 Oct)</th><th>Today</th><th>Change</th><th style="width:150px">Toward target</th></tr>${rows.map((r, i) => { const [c, w, a] = pick(r), prog = Math.max(0, Math.min(100, Math.round((r.better === "up" ? (r.now - r.base) / (r.target - r.base) : (r.base - r.now) / (r.base - r.target)) * 100)));
      return `<tr><td class="n">${r.name}<div class="sub">${r.region}</div></td><td class="muted">${r.base}${r.unit}</td><td>${r.last}${r.unit}</td><td>${r.kind === "num" ? `<input type="number" data-re="${i}" value="${r.now}" style="width:70px"> ${r.unit}` : `<span class="chips">${r.opts.map((o, j) => `<button class="pill${r.now === j ? " on" : ""}" data-repill="${i}:${j}">${o}</button>`).join("")}</span>`}</td><td class="d ${c}" style="font-weight:700">${a} ${w}</td><td><div class="bar"><i class="${prog >= 70 ? "good" : "warn"}" style="width:${prog}%"></i></div><span class="sub">${prog}% · target ${r.kind === "num" ? r.target + r.unit : r.opts[r.target]}</span></td></tr>`; }).join("")}</table>
    <div class="sub" style="margin-top:10px">Special tests, strength, tender points and function use the same pattern. A return visit opens here first (above the full exam, which stays one tap away). Saving files today's numbers as visit 4 against the plan phase.</div></div>`;

  <li><b>Motor points.</b> Palpation and weak strength readings rank muscles; one tap adds them to Today's session with the nerve, the motor-point location, the nearest classical point, and a safety caution (lung, kidney, carotid, sciatic). The library starts at about 60 muscles across neck, shoulder, elbow, back, hip, knee and ankle. <b>All of it is draft wording and positions: yours to check before it is trusted.</b></li>
  <li><b>Kept as you set them:</b> the 3-point Weak / Mildly weak / Strong scale (never 0–5), the existing ROM and special-test library, no formula suggestions, derived-on-read (nothing re-typed), scoped repaints (no jump to the top).</li>
  <li><b>New in the exam:</b> red-flag and needling-safety screen, severity / irritability / nature, observation, trigger-point palpation on the body figure, end-feel, right and left separately, reflexes and dermatomes, 0–10 pain, patient-specific function scores. Thoracic, wrist / hand and SIJ regions get added to the library.</li></ul>
  <h3 style="margin-top:14px">Needs your word</h3><ul class="disc"><li>Is that the page you meant by "the pain page"? (Today the pain map lives on Today's visit and inside the Care Plan; there is no separate Pain page any more.)</li><li>Should a red flag block Dispense / Log, or only warn?</li><li>Mock only shows right shoulder. Which regions do you treat most, so I check those muscle positions first?</li></ul>`;
}

// ---------- events ----------
function show(n) { S.sc = n; $$(".screen").forEach((e, i) => e.classList.toggle("on", i + 1 === n)); $$(".mockbar .sc").forEach(b => b.classList.toggle("on", +b.dataset.sc === n)); render(); }
function render() { rail(); screen1(); screen2(); screen3(); screen4(); }
document.addEventListener("click", e => {
  const t = e.target.closest("button, .spot"); if (!t) return; const d = t.dataset;
  if (d.sc && t.classList.contains("sc")) return show(+d.sc);
  if (d.tab) S.tab = d.tab;
  else if (d.reg) S.regions.has(d.reg) ? S.regions.delete(d.reg) : S.regions.add(d.reg);
  else if (d.view) S.view = d.view;
  else if (d.spot) S.pal[d.spot] = ((S.pal[d.spot] || 0) + 1) % 4;
  else if (d.clear) { S.pal[d.clear] = 0; delete S.refer[d.clear]; }
  else if (d.refer) S.refer[d.refer] = !S.refer[d.refer];
  else if (d.obs) S.obs.has(d.obs) ? S.obs.delete(d.obs) : S.obs.add(d.obs);
  else if (d.sin) { const [k, v] = d.sin.split(":"); S.sin[k] = v; }
  else if (d.sc10) { const [k, n] = d.sc10.split(":"); if (k.startsWith("psfs")) S.psfs[+k.slice(4)][1] = +n; else S.nprs[k] = +n; }
  else if (d.mmt) { const p = d.mmt.split(":"); const k = p.slice(0, 3).join(":"); S.mmt[k] = S.mmt[k] === p[3] ? "" : p[3]; }
  else if (d.test) { const p = d.test.split(":"); S.tests[p[0] + ":" + p[1]] = p[2]; }
  else if (d.rompain) { const p = d.rompain.split(":"); const k = p[0] + ":" + p[1]; (S.rom[k] = S.rom[k] || {}).pain = p[2]; }
  else if (d.neuro) { const i = d.neuro.lastIndexOf(":"); S.neuro[d.neuro.slice(0, i)] = d.neuro.slice(i + 1); }
  else if (d.func) { const i = d.func.lastIndexOf(":"); S.func[d.func.slice(0, i)] = d.func.slice(i + 1); }
  else if (d.treat) S.treat.has(d.treat) ? S.treat.delete(d.treat) : S.treat.add(d.treat);
  else if (d.repill) { const [i, j] = d.repill.split(":").map(Number); S.re[i].now = j; }
  else if (d.same) S.re.forEach(r => r.now = r.last);
  else if (d.bestre) initRe();
  else return;
  render();
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.flag) el.checked ? S.flags.add(d.flag) : S.flags.delete(d.flag);
  else if (d.safety) el.checked ? S.safety.add(d.safety) : S.safety.delete(d.safety);
  else if (d.addm) { if (el.value) { S.pal[el.value] = 1; } }
  else return;
  render();
});
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if (d.rom) { const [rk, i, f] = d.rom.split(":"); (S.rom[rk + ":" + i] = S.rom[rk + ":" + i] || {})[f] = el.value; const pos = el.selectionStart; render(); const again = document.querySelector(`[data-rom="${d.rom}"]`); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { } } }
  else if (d.re != null) { S.re[+d.re].now = +el.value; const i = d.re; render(); const again = document.querySelector(`[data-re="${i}"]`); if (again) { again.focus(); } }
});
initRe(); decisions(); (function () { const h = (location.hash || "#1").slice(1).split("-"); if (h[1]) S.tab = h[1]; show(+h[0] || 1); })();
</script>
</body>
