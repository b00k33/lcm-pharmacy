<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appointments List — three mocks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* the app's own tokens (index.html :root), so a mock looks like the build */
:root{
  --font-body:'Inter',-apple-system,'Segoe UI',sans-serif; --font-disp:'Barlow Semi Condensed','Arial Narrow','Inter',sans-serif;
  --herb:#165C74; --herb-deep:#0B3B4B; --herb-tint:#EDF5F8;
  --msk:#2E6089; --msk-deep:#12304A; --msk-tint:#E9F1F8;
  --gyn:#A83C50; --gyn-deep:#6B1B2B; --gyn-tint:#FBEDF0;
  --purple:#6B4E9B; --purple-deep:#4A3470; --purple-tint:#EFEAF7;
  --acute:#B07A1E; --acute-deep:#7A5312; --acute-tint:#F8F0DD;
  --ink:#141F23; --soft:#4A575B; --faint:#626D71; --line:#D3DEE2; --white:#fff; --paper:#F6F9FA; --cream:#EEF5F7;
  --low:#E8960C; --low-deep:#A6690A; --low-tint:#FCEFD9;
  --gold:#D9AE47; --gold-deep:#8A6D1A; --gold-tint:#FFFBE2;
  --struct:#0B3B4B; --struct-link:#7BBDD3;
  --ok:#2E7D5B; --ok-tint:#E6F3EC;
  --fs-9-5:9.5px; --fs-10-5:10.5px; --fs-11:11px; --fs-12:12px; --fs-12-5:12.5px; --fs-13:13px; --fs-14:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);font-size:var(--fs-12-5);color:var(--ink);background:#DDE6EA;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}

/* ---- mock harness (not part of the app) ---- */
.harness{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.harness h1{font-size:14px;margin:0 6px 0 0;font-weight:800;color:var(--herb-deep)}
.seg{display:inline-flex;background:var(--cream);border-radius:999px;padding:3px;gap:2px;position:relative}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--soft);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed=true]{color:#fff}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--herb-deep);transition:transform .3s var(--ease),width .3s var(--ease)}
.harness .hl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.replay{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--herb-deep)}
.replay:hover{border-color:var(--herb-deep)}
.notes{max-width:1176px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.note{background:#fff;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;color:var(--soft)}
.note b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--herb-deep);margin-bottom:3px}
@media (max-width:760px){.notes{grid-template-columns:1fr}}
.stagewrap{padding:14px 16px 90px}
.frame{--w:1176px;width:min(var(--w),100%);margin:0 auto;background:var(--paper);border-radius:10px;overflow:hidden;container-type:inline-size;transition:width .4s var(--ease);box-shadow:0 6px 24px rgba(11,59,75,.12)}
.frame.narrow{--w:860px}

/* ---- the app's page head + toolbar (as built) ---- */
.apphead{background:var(--struct);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.apphead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.apphead .sm{font-size:11.5px;color:#9CBAC4;margin-right:12px}
.apphead .disc{width:34px;height:34px;border-radius:50%;background:#7FB6C9;display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:14px 22px 6px}
.pillgrp{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.pillgrp span{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--soft)}
.pillgrp span.on{background:var(--struct);color:#fff}
.navb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--soft)}
.search{flex:1 1 220px;min-width:160px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{border:0;outline:0;background:none;padding:9px 0;width:100%;font:inherit;font-size:12.5px}
.lensbar{display:none;align-items:center;gap:8px;padding:2px 22px 0;font-size:12px;color:var(--soft)}
.lensbar.on{display:flex}
.lensbar .lp{display:inline-flex;align-items:center;gap:6px;background:var(--herb-tint);color:var(--herb-deep);border-radius:999px;padding:4px 6px 4px 10px;font-weight:700}
.lensbar .lp button{border:0;background:#fff;border-radius:50%;width:18px;height:18px;line-height:1;color:var(--soft);display:grid;place-items:center;padding:0}
.listwrap{padding:8px 22px 22px}

/* ---- shared bits ---- */
.dot{width:7px;height:7px;border-radius:50%;background:var(--fam,var(--herb));flex:none;display:inline-block}
.fam-msk{--fam:var(--msk);--famd:var(--msk-deep);--famt:var(--msk-tint)}
.fam-gyn{--fam:var(--gyn);--famd:var(--gyn-deep);--famt:var(--gyn-tint)}
.fam-purple{--fam:var(--purple);--famd:var(--purple-deep);--famt:var(--purple-tint)}
.fam-acute{--fam:var(--acute);--famd:var(--acute-deep);--famt:var(--acute-tint)}
.kind{font-size:var(--fs-10-5);font-weight:700;letter-spacing:.03em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.drop{color:var(--herb)} .ic.bell{color:var(--gold-deep)}
.sub{display:flex;align-items:center;gap:6px;min-width:0}
.wheel{width:15px;height:15px;border-radius:50%;background:conic-gradient(var(--herb) calc(var(--p)*1%),#D3DEE2 0);position:relative;flex:none}
.wheel::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:var(--fs-11);font-weight:700;white-space:nowrap;line-height:1.2}
.chip.ready{background:var(--ok-tint);color:var(--ok)}
.chip.short{background:var(--low-tint);color:var(--low-deep)}
.chip.done{background:transparent;color:var(--ok);padding-left:0;padding-right:0}
.chip.new{background:var(--gold-tint);color:var(--gold-deep)}
.chip.acu{background:var(--msk-tint);color:var(--msk-deep)}
.chip.ordering{background:var(--low-tint);color:var(--low-deep)}
.chip.ordering::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--low);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.ord{border:1px solid var(--low);background:#fff;color:var(--low-deep);border-radius:999px;font-size:var(--fs-11);font-weight:700;padding:2px 9px;transition:background .2s,color .2s}
.ord:hover{background:var(--low);color:#fff}
.stcell{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap;min-width:0}

.add{border:0;background:none;padding:0;color:var(--faint);font-size:var(--fs-12);border-bottom:1px dashed #B5C2C6}
.add:hover{color:var(--herb);border-bottom-color:var(--herb)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.strip{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ck,#A9BCC0)}
.free{display:flex;align-items:center;gap:8px;padding:3px 14px 3px 20px;font-size:var(--fs-10-5);font-weight:600;color:var(--faint)}
.free::before,.free::after{content:"";height:0;border-top:1px dashed var(--line);flex:1}
.free::before{max-width:20px}
.now{display:flex;align-items:center;gap:8px;padding:2px 0 2px;color:var(--gold-deep);font-size:var(--fs-10-5);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.now i{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
.now::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(217,174,71,.5);animation:ring 2s infinite}
@keyframes ring{70%{box-shadow:0 0 0 7px rgba(217,174,71,0)}100%{box-shadow:0 0 0 0 rgba(217,174,71,0)}}
.dim{opacity:.28}
.row-anim{animation:rowIn .42s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.morph{animation:morph .6s var(--ease)}
@keyframes morph{0%{background:rgba(217,174,71,.35)}100%{background:transparent}}

/* day = a head and a foldable body */
.day{margin-top:2px}
.dayhead{display:flex;align-items:center;gap:8px;padding:12px 0 6px;font-size:var(--fs-11);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--herb-deep);cursor:pointer;user-select:none}
.dayhead .sub2{font-weight:600;text-transform:none;letter-spacing:0;color:var(--soft)}
.dayhead .chev{width:14px;height:14px;transition:transform .25s var(--ease);color:var(--faint)}
.day.closed .chev{transform:rotate(-90deg)}
.dayrows{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease)}
.dayrows>.in{overflow:hidden;min-height:0}
.day.closed .dayrows{grid-template-rows:0fr}
.day.today .dayhead::after{content:"Today";font-size:10px;letter-spacing:.04em;background:var(--gold-tint);color:var(--gold-deep);border-radius:999px;padding:2px 8px}

/* plan picker popover */
.pick{position:fixed;z-index:80;background:#fff;border-radius:10px;box-shadow:0 10px 32px rgba(11,59,75,.22);padding:6px;min-width:220px;max-width:280px;transform-origin:top left;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}}
.pick h6{margin:6px 8px 4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.pick button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;border-radius:8px;padding:8px;font-size:12.5px;font-weight:600}
.pick button:hover{background:var(--herb-tint)}
.pick button .ck{margin-left:auto;color:var(--ok);opacity:0}
.pick button.cur .ck{opacity:1}
.pick button.newp{color:var(--herb);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--struct);color:#fff;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:90;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--struct-link);font-weight:800;padding:0}

/* plan pill (B, C) and plain plan cell (A) */
.pill{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;border-radius:999px;padding:4px 10px;background:var(--famt);color:var(--famd);font-size:12px;font-weight:700;transition:transform .15s,box-shadow .2s}
.pill:hover{box-shadow:0 0 0 2px var(--fam) inset}
.pill.none,.planA.none{background:none;border:1px dashed #AEBDC2;color:var(--faint);font-weight:600}
.pill.none:hover,.planA.none:hover{border-color:var(--herb);color:var(--herb);box-shadow:none}
.phs{font-size:var(--fs-11);color:var(--soft);min-width:0}

/* ================= MOCK A · quiet table ================= */
.hA,.rA{display:grid;grid-template-columns:96px minmax(120px,.9fr) minmax(150px,1.05fr) 78px minmax(0,1.4fr) minmax(0,1.4fr) 138px;gap:2px 14px;align-items:center;padding:0 14px 0 20px}
.hA{padding-top:6px;padding-bottom:6px;font-size:var(--fs-9-5);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.hA span:last-child{text-align:right}
.tableA{background:#fff;border-radius:10px;overflow:hidden}
.rA{position:relative;min-height:52px;padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.rA:hover{background:#F8FBFC}
.rA .chev2{position:absolute;right:2px;top:19px;width:12px;height:12px;color:var(--faint);opacity:0;transition:opacity .2s,transform .25s var(--ease)}
.rA:hover .chev2{opacity:1}
.rA.open .chev2{transform:rotate(90deg);opacity:1}
.rA.open{background:var(--herb-tint)}
.rA .c-time{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.rA .c-time b{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.rA .c-time small{font-size:var(--fs-10-5);color:var(--faint);font-weight:600}
.rA.done .c-time b::after{content:" ✓";color:var(--ok);font-weight:800}
.rA .c-pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rA .c-pt .nm{font-weight:700;color:var(--herb-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rA.done .c-pt .nm{color:var(--soft)}
.planA{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:2px 6px 2px 0;font-size:12.5px;font-weight:700;color:var(--famd);text-align:left;transition:background .15s,padding .15s}
.planA:hover{background:var(--famt);padding-left:6px}
.planA.none{padding:2px 9px;border-radius:999px}
.c-plan{display:flex;flex-direction:column;gap:1px;min-width:0;align-items:flex-start}
.c-plan .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-plan .phs{padding-left:0;max-width:100%}
.c-plan .phs.ell{display:block}
.c-cd{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.c-cd b{font-family:var(--font-disp);font-size:14px;font-variant-numeric:tabular-nums}
.c-cd em{font-style:normal;font-size:var(--fs-11);color:var(--soft)}
.c-cd.none{color:#B5C2C6}
.c-fg{color:var(--soft);min-width:0;line-height:1.35}
.c-fg .ell{display:block}
.xp{grid-column:1 / -1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.rA.open .xp{grid-template-rows:1fr}
.xp-in{overflow:hidden;min-height:0}
.xg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:14px 24px;padding:10px 0 4px;opacity:0;transform:translateY(-4px);transition:opacity .25s .08s,transform .25s .08s}
.rA.open .xg{opacity:1;transform:none}
.xg h6{margin:0 0 3px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.xg p{margin:0;color:var(--ink);line-height:1.45}
.xg .src{display:block;margin-top:3px;font-size:10.5px;color:var(--faint)}
.xcd{grid-column:1 / 3;display:none;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.xa{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--herb-deep);transition:border-color .2s,transform .15s}
.act:hover{border-color:var(--herb-deep);transform:translateY(-1px)}
@container (max-width:1040px){
  .hA,.rA{grid-template-columns:90px minmax(110px,.9fr) minmax(140px,1.1fr) 74px minmax(0,1.5fr) 134px}
  .hA .h-g,.rA .c-g{display:none}
  .xg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@container (max-width:880px){
  .hA,.rA{grid-template-columns:84px minmax(100px,.9fr) minmax(130px,1.1fr) minmax(0,1.3fr) 130px}
  .hA .h-cd,.rA .c-cd{display:none}
  .xcd{display:flex}
  .rA .c-plan .cdline{display:flex}
}
.cdline{display:none;align-items:center;gap:5px;font-size:var(--fs-11);color:var(--soft)}

/* ================= MOCK B · two-line rows ================= */
.hB,.rB{display:grid;grid-template-columns:96px minmax(120px,.8fr) minmax(170px,1fr) minmax(0,2fr) 142px;gap:2px 16px;align-items:center;padding:0 14px 0 22px}
.hB{padding-top:4px;padding-bottom:6px;font-size:var(--fs-9-5);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.hB span:last-child{text-align:right}
.rB{position:relative;background:#fff;border-radius:9px;margin-bottom:5px;padding-top:9px;padding-bottom:9px;cursor:pointer;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s,opacity .25s}
.rB .strip{border-radius:9px 0 0 9px}
.rB:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(11,59,75,.10)}
.rB.open{box-shadow:0 0 0 2px var(--herb) inset}
.rB .c-time{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.rB .c-time b{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.rB .c-time small{font-size:var(--fs-10-5);color:var(--faint);font-weight:600}
.rB.done .c-time b::after{content:" ✓";color:var(--ok);font-weight:800}
.rB .c-pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.rB .c-pt .nm{font-weight:700;color:var(--herb-deep);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rB.done .c-pt .nm{color:var(--soft)}
.rB .c-plan{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.rB .c-plan .pill{min-width:0}
.rB .c-plan .pill .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rB .c-plan .meta{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.rB .c-plan .meta .phs{flex:0 1 auto}
.rB .c-plan .meta .cdline{flex:none;white-space:nowrap}
.pillx{display:inline-flex;align-items:stretch;max-width:100%;min-width:0;border-radius:999px;background:var(--famt);color:var(--famd);font-size:12px;font-weight:700;transition:box-shadow .2s,background .25s,color .25s}
.pillx:hover{box-shadow:0 0 0 1.5px var(--fam) inset}
.pillx button{border:0;background:none;color:inherit;font:inherit;display:flex;align-items:center;gap:6px;padding:4px 2px 4px 10px;min-width:0}
.pillx .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pillx .car{padding:4px 8px 4px 4px;border-radius:0 999px 999px 0}
.pillx .car:hover{background:rgba(0,0,0,.07)}
.pillx.active{background:var(--fam);color:#fff}
.pillx.active .dot{background:#fff}
.rB .c-fg2{display:flex;flex-direction:column;gap:3px;min-width:0}
.rB .c-fg2 p{margin:0;display:flex;gap:7px;align-items:flex-start;color:var(--soft);line-height:1.4;max-height:1.4em;overflow:hidden;transition:max-height .3s var(--ease)}
.rB .c-fg2 p .tx{min-width:0;flex:1}
.rB .c-fg2 p.f{color:var(--ink);font-weight:500}
.rB .c-fg2 p svg{margin-top:2px;color:var(--faint)}
.rB .c-fg2 p.more .tx{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.rB.open .c-fg2 p{max-height:6em}
.rB.open .c-fg2 p.more .tx{-webkit-mask-image:none;mask-image:none}
.rB.dim{opacity:.28}
.tag-st{white-space:nowrap}
@container (max-width:880px){
  .hB,.rB{grid-template-columns:84px minmax(100px,.8fr) minmax(150px,1fr) minmax(0,1.6fr) 138px;gap:2px 12px}
}
@container (max-width:760px){
  .hB,.rB{grid-template-columns:80px minmax(90px,.9fr) minmax(130px,1fr) 136px}
  .hB .h-fg,.rB .c-fg2{display:none}
}

/* ================= MOCK C · list + card ================= */
.splitC{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px;align-items:start}
.rC{position:relative;display:grid;grid-template-columns:82px minmax(0,1fr) minmax(110px,170px) 18px;gap:10px;align-items:center;padding:9px 12px 9px 20px;background:#fff;border-radius:8px;margin-bottom:3px;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.rC:hover{background:#F8FBFC}
.rC.sel{background:var(--herb-tint)}
.rC.sel .strip{width:9px}
.rC .strip{border-radius:8px 0 0 8px;transition:width .2s}
.rC .tm{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rC.done .tm::after{content:" ✓";color:var(--ok)}
.rC .pt{display:flex;flex-direction:column;gap:1px;min-width:0}
.rC .pt .nm{font-weight:700;color:var(--herb-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rC .pt .fl{font-size:var(--fs-11);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rC .pill{font-size:11.5px;padding:3px 9px}
.rC .pill .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdot{width:10px;height:10px;border-radius:50%;justify-self:end;background:#C8D3D6;transition:transform .2s}
.sdot.ready{background:var(--ok)} .sdot.short{background:var(--low)} .sdot.new{background:var(--gold)} .sdot.done{background:#B9C6CA} .sdot.acu{background:var(--msk)} .sdot.ordering{background:var(--low);animation:pulse 1.2s infinite}
.rC:hover .sdot{transform:scale(1.25)}
.cardC{position:sticky;top:76px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 14px rgba(11,59,75,.08);overflow:hidden}
.cardC .swap{animation:swap .34s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(10px)}}
.cardC .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cardC h3{margin:0;font-size:17px;font-weight:800;color:var(--herb-deep);letter-spacing:-.01em}
.cardC .when{font-size:12px;color:var(--soft);margin-top:2px}
.cardC .sec{margin-top:14px}
.cardC .sec h6{margin:0 0 5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.cardC .sec p{margin:0;line-height:1.5}
.cardC .src{font-size:10.5px;color:var(--faint);margin-top:3px;display:block}
.segC{display:flex;flex-direction:column;gap:4px;position:relative}
.segC button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;text-align:left;font-weight:600;font-size:12.5px;transition:border-color .2s,background .2s}
.segC button.on{border-color:var(--fam);background:var(--famt);color:var(--famd)}
.segC button:hover{border-color:var(--fam)}
.cdbig{display:flex;align-items:center;gap:10px}
.cdbig .wheel{width:34px;height:34px}
.cdbig .wheel::after{inset:7px}
.cdbig b{font-family:var(--font-disp);font-size:24px;line-height:1}
.cdbig span{color:var(--soft);font-size:12px}
.cardC .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.cardC .empty{display:grid;place-items:center;height:160px;color:var(--faint)}
@container (max-width:900px){ .splitC{grid-template-columns:minmax(0,1fr)} .cardC{position:static} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div class="harness">
  <h1>Appointments · List</h1>
  <div class="seg" id="segView" role="group" aria-label="Mock">
    <span class="thumb"></span>
    <button data-v="A" aria-pressed="true">A · Quiet table</button>
    <button data-v="B" aria-pressed="false">B · Two-line rows</button>
    <button data-v="C" aria-pressed="false">C · List + card</button>
  </div>
  <span class="hl">Window</span>
  <div class="seg" id="segW" role="group" aria-label="Window width">
    <span class="thumb"></span>
    <button data-w="wide" aria-pressed="true">Sidebar closed</button>
    <button data-w="narrow" aria-pressed="false">Sidebar open</button>
  </div>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<div class="notes" id="notes"></div>

<div class="stagewrap">
  <div class="frame" id="frame">
    <div class="apphead"><h2>Appointments</h2><div><span class="sm">10 booked ahead</span><span class="disc"></span></div></div>
    <div class="toolbar">
      <button class="navb" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b style="font-size:13px">12–17 Oct</b>
      <button class="navb" aria-label="Next"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="pillgrp"><span>Day</span><span>3</span><span>5</span><span>6</span><span class="on">7</span></div>
      <div class="pillgrp"><span>Grid</span><span class="on">List</span></div>
      <label class="search"><input id="q" type="search" placeholder="Search patient…" autocomplete="off"></label>
    </div>
    <div class="lensbar" id="lensbar"><span>Showing</span><span class="lp"><span id="lensname"></span><button id="lensx" aria-label="Show every plan">×</button></span></div>
    <div class="listwrap" id="stage"></div>
  </div>
</div>

<div class="pick" id="pick" hidden></div>
<div class="toast" id="toast"><span id="toastmsg"></span><button id="toastundo" hidden>Undo</button></div>

<script>
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const PLANS = {
  neck:{name:"Neck & shoulder", fam:"msk"}, back:{name:"Low back pain", fam:"msk"},
  cold:{name:"Acute illness", fam:"acute"}, stress:{name:"General stress", fam:"purple"},
  ivf:{name:"IVF Protocol", fam:"gyn"}, nat:{name:"Natural fertility", fam:"gyn"},
  peri:{name:"Perimenopause & menopause", fam:"gyn"}, preg:{name:"Pregnancy", fam:"gyn"}
};
const DAYS = [
  {key:"mon", label:"Mon 12 Oct 2026"}, {key:"tue", label:"Tue 13 Oct 2026"},
  {key:"wed", label:"Wed 14 Oct 2026", today:true}, {key:"thu", label:"Thu 15 Oct 2026"}
];
const A = [
 {id:1,day:"mon",time:"2:00 pm",end:"3:00 pm",mins:60,name:"Mika Tanaka",kind:"ACU+CHM",col:"#2FA98C",plan:"neck",plans:["neck"],phase:"Restoring range",tracked:true,
  focus:"Pain · Neck & shoulder",fsrc:"Treatment Care Plan",goal:"Free up neck and shoulder movement and settle referred head and arm symptoms",gsrc:"Treatment Care Plan",st:"ready"},
 {id:2,day:"mon",time:"3:00 pm",end:"4:00 pm",mins:60,name:"Kai Morgan",kind:"ACU+CHM",col:"#3DAA7F",plan:"cold",plans:["cold"],phase:"Acute — while unwell",fu:true,
  focus:"Middle deficient cold (Xiao Jian Zhong Tang type) (main), with Yang deficiency and cold in the lower burner",fsrc:"Cliniko briefing",goal:"Help recover from illness · Acute — while unwell",gsrc:"Treatment Care Plan",st:"short"},
 {id:3,day:"mon",time:"4:30 pm",end:"5:15 pm",mins:45,name:"Rae Lindqvist",kind:"ACU",col:"#2A3A9C",plan:"ivf",plans:["ivf","nat"],phase:"Pre-ET (Embryo Transfer)",cd:{n:3,ph:"Period",approx:true},tracked:true,fu:true,
  focus:"Blood stasis (main), with Cold in the channels (Dang Gui Si Ni type), Blood deficiency and Qi stagnation",fsrc:"record",goal:"Build blood flow and a receptive lining through stimulation, collection and transfer",gsrc:"record",st:"acu"},
 {id:4,day:"mon",time:"5:15 pm",end:"6:00 pm",mins:45,name:"Jon Walsh",kind:"ACU+CHM",col:"#E3DE45",plan:"stress",plans:["stress"],phase:"Maintenance",done:"5:51 pm",
  focus:"Heat (main), with Yin deficiency",fsrc:"record",goal:"A flexible template for a stress presentation that doesn't fit neatly into any one pattern",gsrc:"record",st:"done"},
 {id:5,day:"tue",time:"12:00 pm",end:"1:00 pm",mins:60,name:"Mara Quinn",kind:"ACU+CHM",col:"#3DAA7F",plan:"nat",plans:["nat","back"],phase:"Follicular — Week 1",cd:{n:29,ph:"Luteal"},tracked:true,fu:true,
  focus:"Yang deficiency / cold (main), with Middle deficient cold (Xiao Jian Zhong Tang type) and Blood stasis",fsrc:"record",goal:"Support a full, regular cycle — a receptive lining for natural conception. Warm the lower burner",gsrc:"Treatment Care Plan",st:"ready"},
 {id:6,day:"tue",time:"4:45 pm",end:"5:00 pm",mins:15,name:"Sol Reyes",kind:"ACU+CHM",col:"#C0392B",plan:null,plans:[],phase:"",tracked:true,focus:"",goal:"",st:"new",gap:"free · 3 h 45 min"},
 {id:7,day:"wed",time:"3:00 pm",end:"4:00 pm",mins:60,name:"Jules Cheng",kind:"ACU+CHM",col:"#3DAA7F",plan:"peri",plans:["peri"],phase:"Perimenopause — the lead-up years",cd:null,tracked:true,fu:true,

 {id:8,day:"wed",time:"4:30 pm",end:"5:30 pm",mins:60,name:"Emi Dalton",kind:"ACU+CHM",col:"#3AA9C0",plan:"preg",plans:["preg"],phase:"Early Pregnancy",tracked:true,
  focus:"Fertility · Pregnancy",fsrc:"Treatment Care Plan",goal:"Regulate the cycle and support conception",gsrc:"record",st:"ready"},
 {id:9,day:"thu",time:"10:00 am",end:"11:00 am",mins:60,name:"Lena Barrow",kind:"ACU+CHM",col:"#3DAA7F",plan:null,plans:["back"],phase:"",focus:"",goal:"",st:"ordering"},
 {id:10,day:"thu",time:"11:00 am",end:"12:00 pm",mins:60,name:"Tomas Deli",kind:"ACU+CHM",col:"#3DAA7F",plan:"stress",plans:["stress"],phase:"Settling in",
  focus:"Stress · General stress",fsrc:"Treatment Care Plan",goal:"A flexible template for a stress presentation that doesn't fit neatly into any one pattern",gsrc:"record",st:"ready"}
];
const srcTxt = s => s === "record" ? "written from the record" : "from the " + esc(s);
const byId = id => A.find(a => a.id == id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = {
  drop:'<svg class="ic drop" viewBox="0 0 24 24" title="Cycle tracked"><path d="M12 3s6 6.3 6 10.5A6 6 0 0 1 6 13.5C6 9.3 12 3 12 3z"/></svg>',
  bell:'<svg class="ic bell" viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2V11a4.5 4.5 0 0 0-9 0v4zM10 20a2 2 0 0 0 4 0"/></svg>',
  chev:'<svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  chev2:'<svg class="ic chev2" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  target:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
  flag:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 21V4m0 0h11l-2 4 2 4H6"/></svg>',
  phone:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  text:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  user:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  edit:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};
const fam = a => a.plan ? "fam-" + PLANS[a.plan].fam : "";
const kindTxt = a => `<span class="kind">${a.kind}</span>`;
const subLine = a => `<span class="sub">${kindTxt(a)}${a.tracked ? ico.drop : ""}${a.fu ? ico.bell : ""}</span>`;
const wheel = (n, len=28) => `<i class="wheel" style="--p:${Math.min(100, Math.round(n / len * 100))}"></i>`;
const cdCell = a => a.cd ? `${wheel(a.cd.n)}<span><b>${a.cd.approx ? "~" : ""}${a.cd.n}</b></span><em>${esc(a.cd.ph)}</em>` : "—";
const statusHtml = a => {
  if (a.st === "ready") return `<span class="chip ready">✓ Ready</span>`;
  if (a.st === "short") return `<span class="chip short">⚠ 1 short</span><button class="ord" data-ord="${a.id}">Order</button>`;
  if (a.st === "ordering") return `<span class="chip ordering">1 short · ordering</span>`;
  if (a.st === "done") return `<span class="chip done">✓ ${a.done}</span>`;
  if (a.st === "new") return `<span class="chip new">new</span>`;
  if (a.st === "acu") return `<span class="chip acu">ACU only</span>`;
  return "";
};
const pickBtn = (a, cls) => a.plan
  ? `<button class="${cls} ${fam(a)}" data-plan-open="${a.id}" title="${esc(PLANS[a.plan].name)} — change plan">${cls === "pill" ? `<i class="dot"></i>` : `<i class="dot"></i>`}<span class="pn">${esc(PLANS[a.plan].name)}</span></button>`
  : `<button class="${cls} none" data-plan-open="${a.id}">Pick a plan</button>`;

/* ---------- A ---------- */
const rowA = (a, i) => `<div class="rA row-anim ${a.done ? "done" : ""}" data-id="${a.id}" data-name="${esc(a.name.toLowerCase())}" style="--ck:${a.col};--i:${i}">
  <i class="strip"></i>
  <div class="c-time"><b>${a.time}</b><small>– ${a.end} · ${a.mins} min</small></div>
  <div class="c-pt"><span class="nm">${esc(a.name)}</span>${subLine(a)}</div>
  <div class="c-plan ${fam(a)}">${pickBtn(a, "planA")}${a.phase ? `<span class="phs ell" title="${esc(a.phase)}">${esc(a.phase)}</span>` : ""}${a.cd ? `<span class="cdline">${wheel(a.cd.n)}CD ${a.cd.approx ? "~" : ""}${a.cd.n} · ${esc(a.cd.ph)}</span>` : ""}</div>
  <div class="c-cd ${a.cd ? "" : "none"}">${cdCell(a)}</div>
  <div class="c-fg c-f">${a.focus ? `<span class="ell" title="${esc(a.focus)}">${esc(a.focus)}</span>` : `<button class="add" data-act="Opens the focus box">add focus</button>`}</div>
  <div class="c-fg c-g">${a.goal ? `<span class="ell" title="${esc(a.goal)}">${esc(a.goal)}</span>` : `<button class="add" data-act="Opens the goal box">add goal</button>`}</div>
  <div class="stcell" id="st${a.id}">${statusHtml(a)}</div>
  ${ico.chev2}
  <div class="xp"><div class="xp-in"><div class="xg">
    <div><h6>Presenting focus</h6><p>${a.focus ? esc(a.focus) : "—"}</p>${a.fsrc ? `<span class="src">${srcTxt(a.fsrc)}</span>` : ""}</div>
    <div class="x-g"><h6>Treatment goal</h6><p>${a.goal ? esc(a.goal) : "—"}</p>${a.gsrc ? `<span class="src">${srcTxt(a.gsrc)}</span>` : ""}</div>
    ${a.cd ? `<div class="xcd">${wheel(a.cd.n)}Cycle day ${a.cd.approx ? "~" : ""}${a.cd.n} · ${esc(a.cd.ph)}</div>` : ""}
    <div class="xa"><button class="act" data-act="Opens ${esc(a.name)}'s profile">${ico.user}Profile</button><button class="act" data-act="Calls ${esc(a.name)}">${ico.phone}Call</button><button class="act" data-act="Texts ${esc(a.name)}">${ico.text}Text</button><button class="act" data-act="Opens the booking">${ico.edit}Edit</button></div>
  </div></div></div>
</div>`;

/* ---------- B ---------- */
const rowB = (a, i) => `<div class="rB row-anim ${a.done ? "done" : ""}${lens && a.plan !== lens ? " dim" : ""}" data-id="${a.id}" data-name="${esc(a.name.toLowerCase())}" style="--ck:${a.col};--i:${i}">
  <i class="strip"></i>
  <div class="c-time"><b>${a.time}</b><small>– ${a.end} · ${a.mins} min</small></div>
  <div class="c-pt"><span class="nm">${esc(a.name)}</span>${subLine(a)}</div>
  <div class="c-plan ${fam(a)}">${a.plan ? `<span class="pillx ${fam(a)}${lens === a.plan ? " active" : ""}"><button class="lbl" data-lens="${a.plan}" title="Show only ${esc(PLANS[a.plan].name)}"><i class="dot"></i><span class="pn">${esc(PLANS[a.plan].name)}</span></button><button class="car" data-plan-open="${a.id}" title="Change plan" aria-label="Change plan"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></span>` : `<button class="pill none" data-plan-open="${a.id}">Pick a plan</button>`}
    <span class="meta">${a.phase ? `<span class="phs ell" title="${esc(a.phase)}">${esc(a.phase)}</span>` : ""}${a.cd ? `<span class="cdline" style="display:flex">${wheel(a.cd.n)}CD ${a.cd.approx ? "~" : ""}${a.cd.n}</span>` : ""}</span></div>
  <div class="c-fg2">
    <p class="f" title="Presenting focus">${ico.target}<span class="tx">${a.focus ? esc(a.focus) : `<button class="add" data-act="Opens the focus box">add focus</button>`}</span></p>
    <p class="g" title="Treatment goal">${ico.flag}<span class="tx">${a.goal ? esc(a.goal) : `<button class="add" data-act="Opens the goal box">add goal</button>`}</span></p>
  </div>
  <div class="stcell" id="st${a.id}">${statusHtml(a)}</div>
</div>`;

/* ---------- C ---------- */
const rowC = (a, i) => `<div class="rC row-anim ${a.done ? "done" : ""}${sel == a.id ? " sel" : ""}" data-id="${a.id}" data-name="${esc(a.name.toLowerCase())}" style="--ck:${a.col};--i:${i}">
  <i class="strip"></i>
  <span class="tm">${a.time}</span>
  <span class="pt"><span class="nm">${esc(a.name)}</span><span class="fl">${a.focus ? esc(a.focus) : "no focus yet"}</span></span>
  ${a.plan ? `<span class="pill ${fam(a)}"><i class="dot"></i><span class="pn">${esc(PLANS[a.plan].name)}</span></span>` : `<span class="pill none">No plan yet</span>`}
  <i class="sdot ${a.st}" title="${a.st}"></i>
</div>`;
const cardC = a => !a ? `<div class="empty">Pick a booking</div>` : `<div class="swap">
  <div class="top"><div><h3>${esc(a.name)}</h3><div class="when">${DAYS.find(d => d.key === a.day).label.replace(" 2026", "")} · ${a.time} – ${a.end}</div><div class="sub" style="margin-top:6px">${kindTxt(a)}${a.tracked ? ico.drop : ""}${a.fu ? ico.bell : ""}</div></div><div class="stcell" id="st${a.id}">${statusHtml(a)}</div></div>
  <div class="sec"><h6>Treatment plan</h6>${a.plans.length || a.plan ? `<div class="segC">${[...new Set([...(a.plan ? [a.plan] : []), ...a.plans])].map(k => `<button class="fam-${PLANS[k].fam} ${a.plan === k ? "on" : ""}" data-setplan="${a.id}|${k}"><i class="dot"></i>${esc(PLANS[k].name)}${a.plan === k ? `<span style="margin-left:auto">${ico.check}</span>` : ""}</button>`).join("")}</div>${a.phase ? `<span class="src" style="margin-top:6px">${esc(a.phase)}</span>` : ""}` : `<button class="pill none" data-act="Starts a Treatment Care Plan">${ico.plus} New Treatment Care Plan</button>`}</div>
  ${a.cd ? `<div class="sec"><h6>Cycle</h6><div class="cdbig">${wheel(a.cd.n)}<b>${a.cd.approx ? "~" : ""}${a.cd.n}</b><span>${esc(a.cd.ph)}</span></div></div>` : ""}
  <div class="sec"><h6>Presenting focus</h6><p>${a.focus ? esc(a.focus) : `<button class="add" data-act="Opens the focus box">add focus</button>`}</p>${a.fsrc ? `<span class="src">${srcTxt(a.fsrc)}</span>` : ""}</div>
  <div class="sec"><h6>Treatment goal</h6><p>${a.goal ? esc(a.goal) : `<button class="add" data-act="Opens the goal box">add goal</button>`}</p>${a.gsrc ? `<span class="src">${srcTxt(a.gsrc)}</span>` : ""}</div>
  <div class="acts"><button class="act" data-act="Opens ${esc(a.name)}'s profile">${ico.user}Profile</button><button class="act" data-act="Calls ${esc(a.name)}">${ico.phone}Call</button><button class="act" data-act="Texts ${esc(a.name)}">${ico.text}Text</button><button class="act" data-act="Opens the booking">${ico.edit}Edit</button></div>
</div>`;

/* ---------- state + render ---------- */
let view = "A", lens = null, sel = 3, q = "";
const NOTES = {
  A: ["Keeps", "Every column you asked for, in the same order, plus a new Treatment plan column (plan name, phase under it).",
      "Calmer", "One line per cell, no PLAN / AUTO / Cliniko tags on the row, no coloured phase chip. Tap a row to unfold the full focus and goal, who wrote them, and the Profile / Call / Text / Edit buttons.",
      "Trade-off", "Still a wide table. With the sidebar open the Goal column steps aside, then the CD column folds into the plan cell, so nothing ever overlaps."],
  B: ["Keeps", "The Treatment plan as its own column, shown as a coloured pill in the plan's colour family. CD sits under the pill.",
      "Calmer", "Five columns, rows as soft cards with air between them. Focus and goal share one cell (two short lines). Tap a pill to show only that plan; tap a row to unfold the text.",
      "Trade-off", "CD is no longer its own column. Focus and goal read as two lines of one cell."],
  C: ["Keeps", "Plan, status, time and name on a lean list. Everything else for the selected booking sits in a card beside it, in full words.",
      "Calmer", "The least on screen: five facts a row. The card shows the whole focus, goal, cycle day and the plan choice, so nothing is cut off. Up and down keys walk the list.",
      "Trade-off", "Goal and CD are no longer visible down the list, only for the booking you select."]
};
function renderNotes() {
  const n = NOTES[view], el = $("#notes");
  el.innerHTML = [0, 2, 4].map(i => `<div class="note"><b>${n[i]}</b>${n[i + 1]}</div>`).join("");
}
function dayBlocks(rowFn, head) {
  let idx = 0;
  return DAYS.map(d => {
    const rows = A.filter(a => a.day === d.key);
    let prevEnd = null;
    const inner = (d.today ? `<div class="now"><span>Now 11:10 am</span><i></i></div>` : "") + rows.map(a => {
      const free = a.gap ? `<div class="free"><span>${a.gap}</span></div>` : "";
      return free + rowFn(a, idx++);
    }).join("");
    return `<section class="day${d.today ? " today" : ""}" data-day="${d.key}"><div class="dayhead">${ico.chev}<span>${d.label}</span><span class="sub2">· ${rows.length} patient${rows.length === 1 ? "" : "s"}</span></div><div class="dayrows"><div class="in">${inner}</div></div></section>`;
  }).join("");
}
function render() {
  const st = $("#stage");
  if (view === "A") st.innerHTML = `<div class="tableA"><div class="hA"><span>Time</span><span>Patient</span><span>Treatment plan</span><span class="h-cd">CD</span><span>Presenting focus</span><span class="h-g">Treatment goal</span><span>Status</span></div>${dayBlocks(rowA)}</div>`;
  if (view === "B") st.innerHTML = `<div class="hB"><span>Time</span><span>Patient</span><span>Treatment plan</span><span class="h-fg">Focus &amp; goal</span><span>Status</span></div>${dayBlocks(rowB)}`;
  if (view === "C") st.innerHTML = `<div class="splitC"><div>${dayBlocks(rowC)}</div><aside class="cardC" id="card">${cardC(byId(sel))}</aside></div>`;
  applySearch(); measureMore(); lensBar();
  renderNotes();
}
function applySearch() {
  $$("#stage [data-name]").forEach(r => r.classList.toggle("dim", (q && !r.dataset.name.includes(q)) || (view === "B" && lens && byId(r.dataset.id).plan !== lens)));
  $$("#stage .pillx").forEach(p => p.classList.toggle("active", !!lens && p.querySelector("[data-lens]").dataset.lens === lens));
}
function measureMore() {
  if (view !== "B") return;
  $$(".rB .c-fg2 p").forEach(p => { const tx = $(".tx", p); p.classList.remove("more"); if (tx && tx.scrollHeight > 0 && p.scrollHeight > p.clientHeight + 2) p.classList.add("more"); });
}
function lensBar() {
  const on = view === "B" && lens;
  $("#lensbar").classList.toggle("on", !!on);
  if (on) $("#lensname").textContent = PLANS[lens].name + " · " + A.filter(a => a.plan === lens).length;
}
function rerenderRow(id) {
  const a = byId(id), el = $(`#stage [data-id="${id}"]`);
  if (!el) return render();
  const fn = view === "A" ? rowA : view === "B" ? rowB : rowC;
  const open = el.classList.contains("open");
  const tmp = document.createElement("div"); tmp.innerHTML = fn(a, 0);
  const nu = tmp.firstElementChild; nu.classList.remove("row-anim"); nu.style.animation = "none";
  if (open) nu.classList.add("open");
  el.replaceWith(nu);
  nu.classList.add("morph"); setTimeout(() => nu.classList.remove("morph"), 650);
  applySearch(); measureMore();
  if (view === "C") { $("#card").innerHTML = cardC(a); $$("#stage .rC").forEach(r => r.classList.toggle("sel", r.dataset.id == sel)); }
}

/* ---------- interactions ---------- */
let undoFn = null, toastT = 0;
function toast(msg, undo) {
  $("#toastmsg").textContent = msg; undoFn = undo || null; $("#toastundo").hidden = !undo;
  $("#toast").classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("on"), undo ? 5500 : 2600);
}
$("#toastundo").onclick = () => { if (undoFn) undoFn(); $("#toast").classList.remove("on"); undoFn = null; };
function closePick() { const p = $("#pick"); p.hidden = true; p.innerHTML = ""; }
function openPick(btn, id) {
  const a = byId(id), p = $("#pick");
  const keys = [...new Set([...(a.plan ? [a.plan] : []), ...a.plans])];
  p.innerHTML = `<h6>Which plan is this visit for?</h6>` + keys.map(k => `<button class="fam-${PLANS[k].fam} ${a.plan === k ? "cur" : ""}" data-set="${id}|${k}"><i class="dot"></i>${esc(PLANS[k].name)}<span class="ck">${ico.check}</span></button>`).join("") + `<button class="newp" data-act="Starts a Treatment Care Plan for ${esc(a.name)}">${ico.plus} New Treatment Care Plan</button>`;
  p.hidden = false;
  const r = btn.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  let left = Math.min(Math.max(8, r.left), innerWidth - w - 8), top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  p.style.left = left + "px"; p.style.top = top + "px";
}
function setPlan(id, key) {
  const a = byId(id), before = a.plan, bp = a.phase;
  a.plan = key; if (key !== before) a.phase = key === "nat" ? "Follicular — Week 1" : key === "ivf" ? "Pre-ET (Embryo Transfer)" : a.phase || "Phase 1";
  rerenderRow(id); closePick();
  toast(`Filed to ${PLANS[key].name}`, () => { a.plan = before; a.phase = bp; rerenderRow(id); });
}
function order(id) {
  const a = byId(id), st = $("#st" + id);
  if (!st) return;
  st.querySelector(".chip").classList.add("ordering"); st.querySelector(".chip").className = "chip ordering";
  st.innerHTML = `<span class="chip ordering">1 short · ordering</span>`; a.st = "ordering";
  $$(`#stage [data-id="${id}"] .sdot`).forEach(d => d.className = "sdot ordering");
  toast("Added to the order");
}
function setLens(k) { lens = lens === k ? null : k; applySearch(); lensBar(); }
function select(id) {
  sel = id; $$("#stage .rC").forEach(r => r.classList.toggle("sel", r.dataset.id == id));
  $("#card").innerHTML = cardC(byId(id));
}
$("#stage").addEventListener("click", e => {
  const t = e.target; let el;
  if ((el = t.closest("[data-plan-open]"))) { e.stopPropagation(); openPick(el, el.dataset.planOpen); return; }
  if ((el = t.closest("[data-setplan]"))) { const [id, k] = el.dataset.setplan.split("|"); if (byId(id).plan !== k) setPlan(id, k); return; }
  if ((el = t.closest("[data-ord]"))) { e.stopPropagation(); order(el.dataset.ord); return; }
  if ((el = t.closest("[data-lens]"))) { e.stopPropagation(); setLens(el.dataset.lens); return; }
  if ((el = t.closest("[data-act]"))) { e.stopPropagation(); toast(el.dataset.act); return; }
  if ((el = t.closest(".dayhead"))) { el.parentElement.classList.toggle("closed"); return; }
  if (view === "A" && (el = t.closest(".rA"))) { const was = el.classList.contains("open"); $$(".rA.open").forEach(r => r.classList.remove("open")); if (!was) el.classList.add("open"); return; }
  if (view === "B" && (el = t.closest(".rB"))) { el.classList.toggle("open"); return; }
  if (view === "C" && (el = t.closest(".rC"))) { select(el.dataset.id); return; }
});
$("#pick").addEventListener("click", e => {
  const el = e.target.closest("[data-set]"); if (el) { const [id, k] = el.dataset.set.split("|"); if (byId(id).plan === k) closePick(); else setPlan(id, k); return; }
  const n = e.target.closest("[data-act]"); if (n) { toast(n.dataset.act); closePick(); }
});
document.addEventListener("click", e => { if (!e.target.closest("#pick") && !e.target.closest("[data-plan-open]")) closePick(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePick();
  if (view === "C" && (e.key === "ArrowDown" || e.key === "ArrowUp") && !/INPUT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    const ids = $$("#stage .rC").filter(r => !r.closest(".day.closed")).map(r => +r.dataset.id), i = ids.indexOf(+sel);
    const n = ids[Math.min(ids.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
    if (n) { select(n); $(`#stage .rC[data-id="${n}"]`).scrollIntoView({block:"nearest", behavior:"smooth"}); }
  }
});
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); applySearch(); });
$("#lensx").onclick = () => setLens(lens);
$("#replay").onclick = () => render();
function thumb(seg) { const on = $("button[aria-pressed=true]", seg), t = $(".thumb", seg); t.style.width = on.offsetWidth + "px"; t.style.transform = `translateX(${on.offsetLeft - 3}px)`; }
$("#segView").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; $$("#segView button").forEach(x => x.setAttribute("aria-pressed", x === b)); thumb($("#segView")); closePick(); render(); });
$("#segW").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $$("#segW button").forEach(x => x.setAttribute("aria-pressed", x === b)); thumb($("#segW")); $("#frame").classList.toggle("narrow", b.dataset.w === "narrow"); setTimeout(measureMore, 450); });
addEventListener("resize", () => { measureMore(); closePick(); thumb($("#segView")); thumb($("#segW")); });
addEventListener("load", () => { setTimeout(() => { thumb($("#segView")); thumb($("#segW")); measureMore(); }, 250); });
document.fonts && document.fonts.ready.then(() => { thumb($("#segView")); thumb($("#segW")); measureMore(); });
thumb($("#segView")); thumb($("#segW"));
render();
</script>
</body>
</html>
